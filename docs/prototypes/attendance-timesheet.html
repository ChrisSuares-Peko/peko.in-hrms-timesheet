<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peko Attendance & Timesheet prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --surface-2:#FAFAFB; --ink:#101828; --ink-2:#475467; --muted:#8A94A6;
  --line:#EAECF0; --line-2:#D0D5DD;
  --red:#E30000; --red-hover:#C40000; --red-soft:#FFF1F0; --red-ink:#B42318;
  --green:#05A357; --green-soft:#E7F8EE; --green-ink:#067647;
  --amber:#FDA700; --amber-soft:#FFF6E0; --amber-ink:#93370D;
  --blue:#2E62E8; --blue-soft:#EEF3FF; --blue-ink:#1D3F9E;
  --track:#F0F2F5; --entry:#344054; --entry-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.06);
  --overlay:rgba(16,24,40,.45);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1116; --surface:#161A21; --surface-2:#1B2029; --ink:#E7EAF0; --ink-2:#B4BCC9; --muted:#7D8696;
    --line:#262C37; --line-2:#363D4A;
    --red:#FF4545; --red-hover:#FF6161; --red-soft:#3A1717; --red-ink:#FFB4AB;
    --green:#2BC77A; --green-soft:#12301F; --green-ink:#8BE3B5;
    --amber:#FDB022; --amber-soft:#33270E; --amber-ink:#FEC84B;
    --blue:#6E95FF; --blue-soft:#172440; --blue-ink:#AFC4FF;
    --track:#1F2530; --entry:#9AA7BD; --entry-ink:#0E1116;
    --shadow:0 1px 2px rgba(0,0,0,.4);
    --overlay:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1116; --surface:#161A21; --surface-2:#1B2029; --ink:#E7EAF0; --ink-2:#B4BCC9; --muted:#7D8696;
  --line:#262C37; --line-2:#363D4A;
  --red:#FF4545; --red-hover:#FF6161; --red-soft:#3A1717; --red-ink:#FFB4AB;
  --green:#2BC77A; --green-soft:#12301F; --green-ink:#8BE3B5;
  --amber:#FDB022; --amber-soft:#33270E; --amber-ink:#FEC84B;
  --blue:#6E95FF; --blue-soft:#172440; --blue-ink:#AFC4FF;
  --track:#1F2530; --entry:#9AA7BD; --entry-ink:#0E1116;
  --shadow:0 1px 2px rgba(0,0,0,.4); --overlay:rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Roboto,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* shell */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:22px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.logo{font-weight:700;font-size:24px;letter-spacing:-.5px;padding:0 14px 22px;display:flex;align-items:center;gap:8px}
.logo-mark{width:22px;height:22px;border-radius:4px;background:var(--ink);position:relative}
.logo-mark::after{content:"";position:absolute;right:-3px;bottom:-3px;width:10px;height:10px;background:var(--red);border-radius:2px}
.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:10px 14px;border-radius:8px;color:var(--ink-2);font-weight:500}
.nav:hover{background:var(--surface-2)}
.nav[aria-current="page"]{background:var(--red-soft);color:var(--red-ink)}
.nav svg{width:18px;height:18px;flex:none}
.nav .count{margin-left:auto;background:var(--red);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px;font-weight:500}
.side-foot{margin-top:auto;padding:12px 14px;font-size:12px;color:var(--muted)}
.main{min-width:0;display:flex;flex-direction:column}
.top{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;gap:16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top h1{font-size:18px;margin:0;font-weight:500}
.top .sub{color:var(--muted);font-size:13px}
.who{margin-left:auto;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:6px 12px 6px 6px}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:500;font-size:13px;background:var(--red-soft);color:var(--red-ink);flex:none}
.who b{display:block;font-size:13px;font-weight:500}
.who span{display:block;font-size:12px;color:var(--muted)}
.content{padding:20px 28px 96px;max-width:1240px;width:100%}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;color:var(--ink-2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tab[aria-selected="true"]{color:var(--red);border-bottom-color:var(--red)}
.tab .n{background:var(--track);color:var(--ink-2);border-radius:10px;padding:0 7px;font-size:12px}
.tab[aria-selected="true"] .n{background:var(--red-soft);color:var(--red-ink)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 14px;font-weight:500;color:var(--ink-2);border-right:1px solid var(--line-2)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

/* basics */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.pad{padding:18px 20px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted)}
.small{font-size:12px}
h2{font-size:16px;font-weight:500;margin:0}
h3{font-size:14px;font-weight:500;margin:0}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:var(--red-hover)}
.btn.good{background:var(--green);border-color:var(--green);color:#fff}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2);padding:6px 8px}
.btn.ghost:hover{background:var(--track)}
.btn.link{border:0;background:none;padding:0;color:var(--blue);font-weight:500}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--track);color:var(--ink-2)}
.chip.green{background:var(--green-soft);color:var(--green-ink)}
.chip.red{background:var(--red-soft);color:var(--red-ink)}
.chip.amber{background:var(--amber-soft);color:var(--amber-ink)}
.chip.blue{background:var(--blue-soft);color:var(--blue-ink)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.banner{border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;margin-bottom:14px;border:1px solid}
.banner.red{background:var(--red-soft);border-color:transparent;color:var(--red-ink)}
.banner.amber{background:var(--amber-soft);border-color:transparent;color:var(--amber-ink)}
.banner.blue{background:var(--blue-soft);border-color:transparent;color:var(--blue-ink)}
.banner.grey{background:var(--track);border-color:transparent;color:var(--ink-2)}
.banner b{font-weight:500}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:13px;color:var(--ink-2);font-weight:500}
.input{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%}
textarea.input{min-height:76px;resize:vertical}
.err{color:var(--red-ink);font-size:12px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2)}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.scroll-x{overflow-x:auto}

/* timesheet */
.ts-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.weekbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.weekbar .range{font-size:16px;font-weight:500;min-width:170px}
.day{display:grid;grid-template-columns:118px minmax(0,1fr);gap:16px;padding:16px 18px;border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:0}
.day.off{background:var(--surface-2)}
.day.today .dname{color:var(--red)}
.dname{font-weight:500}
.dsub{font-size:12px;color:var(--muted)}
.win{font-size:12px;color:var(--ink-2);margin-bottom:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.track{position:relative;height:18px;background:var(--track);border-radius:4px;margin-bottom:6px;overflow:hidden}
.track .w{position:absolute;top:0;bottom:0;background:var(--blue-soft);border-left:2px solid var(--blue);border-right:2px solid var(--blue)}
.track .seg-in{position:absolute;top:4px;bottom:4px;background:var(--entry);border-radius:2px}
.track .seg-out{position:absolute;top:4px;bottom:4px;border-radius:2px;background:repeating-linear-gradient(135deg,var(--amber) 0 4px,#FFD27A 4px 8px)}
.ticks{position:relative;height:14px;font-size:10px;color:var(--muted);margin-bottom:8px}
.ticks span{position:absolute;transform:translateX(-50%)}
.entry{display:grid;grid-template-columns:118px 58px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-top:1px dashed var(--line)}
.entry:first-of-type{border-top:0}
.entry .t{font-variant-numeric:tabular-nums;font-weight:500}
.entry .d{color:var(--ink-2);font-variant-numeric:tabular-nums}
.entry .desc{min-width:0;overflow-wrap:anywhere}
.entry .acts{display:flex;gap:2px}
.ot{margin-top:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--amber-soft);color:var(--amber-ink);border-radius:8px;padding:8px 10px;font-size:13px}
.ot b{font-weight:500}
.editor{display:grid;grid-template-columns:110px 110px minmax(0,1fr) auto;gap:8px;align-items:start;padding:8px 0}
.editor .err{grid-column:1/-1}
.addline{margin-top:6px}
.empty-day{color:var(--muted);font-size:13px;padding:2px 0}
.lockline{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:4px}
.card{position:sticky;top:84px}
.card .big{font-size:22px;font-weight:500;letter-spacing:-.3px}
.bars{display:flex;flex-direction:column;gap:7px;margin:14px 0}
.bar{display:grid;grid-template-columns:34px 1fr 64px;gap:8px;align-items:center;font-size:12px}
.bar .b{height:6px;background:var(--track);border-radius:3px;overflow:hidden;position:relative}
.bar .b i{position:absolute;left:0;top:0;bottom:0;background:var(--ink-2);border-radius:3px}
.bar .b i.over{background:var(--amber)}
.bar .v{text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}
.divider{height:1px;background:var(--line);margin:14px 0}
.hist{list-style:none;margin:0;padding:0}
.hist li{padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;display:grid;grid-template-columns:86px 1fr;gap:10px}
.hist li:last-child{border-bottom:0}

/* diff */
.diffday{padding:12px 0;border-bottom:1px solid var(--line)}
.diffday:last-child{border-bottom:0}
.drow{display:grid;grid-template-columns:20px 120px 1fr;gap:8px;padding:6px 8px;border-radius:6px;margin-top:4px;font-size:13px}
.drow.add{background:var(--green-soft);color:var(--green-ink)}
.drow.del{background:var(--red-soft);color:var(--red-ink)}
.drow.del .x{text-decoration:line-through}
.drow.edit{background:var(--amber-soft);color:var(--amber-ink)}
.old{text-decoration:line-through;opacity:.75}

/* requests */
.req{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line)}
.req:last-child{border-bottom:0}
.req .title{font-weight:500}
.chain{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:12px}
.step{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;background:var(--track);color:var(--ink-2)}
.step.done{background:var(--green-soft);color:var(--green-ink)}
.step.pending{background:var(--blue-soft);color:var(--blue-ink)}
.step.rejected{background:var(--red-soft);color:var(--red-ink)}
.step.skipped{background:transparent;border:1px dashed var(--line-2);color:var(--muted)}
.arrow{color:var(--muted)}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-weight:500;margin-bottom:4px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.stat{padding:14px 16px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:22px;font-weight:500;margin-top:2px}
.headline{display:flex;align-items:baseline;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.headline .num{font-size:34px;font-weight:700;letter-spacing:-1px}

/* settings */
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mode{border:1px solid var(--line-2);border-radius:10px;padding:14px;text-align:left;background:var(--surface)}
.mode[aria-pressed="true"]{border-color:var(--red);box-shadow:0 0 0 1px var(--red);background:var(--red-soft)}
.mode b{display:block;font-weight:500;margin-bottom:4px}
.mode span{color:var(--ink-2);font-size:13px}
.setgrid{display:grid;gap:16px}

/* modal + toast + demo */
.overlay{position:fixed;inset:0;background:var(--overlay);display:grid;place-items:center;padding:20px;z-index:50}
.modal{background:var(--surface);border-radius:14px;width:min(560px,100%);max-height:calc(100vh - 40px);overflow:auto;box-shadow:0 20px 50px rgba(16,24,40,.25)}
.modal.wide{width:min(980px,100%)}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--surface);z-index:1}
.modal-b{padding:18px 20px}
.modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--surface)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:500;z-index:60;box-shadow:var(--shadow)}
.demo{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.demo-pop{width:300px;padding:16px}
.demo-btn{background:var(--ink);color:var(--surface);border:0;border-radius:999px;padding:10px 16px;font-weight:500;box-shadow:var(--shadow)}

@media (max-width:1020px){
  .ts-layout{grid-template-columns:1fr}
  .card{position:static;order:-1}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;padding:8px 10px;overflow-x:auto;z-index:10;border-right:0;border-bottom:1px solid var(--line);top:env(safe-area-inset-top,0px)}
  .logo{padding:0 10px 0 4px;font-size:20px}
  .side-foot{display:none}
  .nav{width:auto;white-space:nowrap}
  .top{position:static;padding:12px 16px;flex-wrap:wrap}
  .who{margin-left:0}
  .content{padding:16px 14px 96px}
  .day{grid-template-columns:1fr;gap:6px;padding:14px}
  .entry{grid-template-columns:96px 52px minmax(0,1fr);}
  .entry .acts{grid-column:1/-1;justify-content:flex-end}
  .editor{grid-template-columns:1fr 1fr}
  .editor .input.desc{grid-column:1/-1}
  .modes{grid-template-columns:1fr}
  .req{grid-template-columns:1fr}
  .demo-pop{width:min(300px,calc(100vw - 40px))}
}

/* v2 additions */
.crumb{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:13px;color:var(--muted)}
.crumb button{border:0;background:none;color:var(--blue);padding:0;font-weight:500}
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px;text-align:left;min-height:168px}
.hcard.link{cursor:pointer}
.hcard.link:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.hcard .hk{font-weight:500;font-size:15px;display:flex;align-items:center;gap:8px}
.hcard .hv{font-size:20px;font-weight:500;letter-spacing:-.3px}
.hcard .hs{color:var(--ink-2);font-size:13px}
.hcard .hf{margin-top:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hcard.feature{border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset}
.hcard.dim{opacity:.6}
.viewbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.viewbar .range{font-size:16px;font-weight:500;min-width:150px}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal-h{font-size:12px;color:var(--muted);padding:8px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface-2)}
.cal-cell{min-height:88px;padding:8px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:4px;border-top:0;border-left:0;font:inherit;color:inherit;cursor:pointer}
.cal-cell:hover{background:var(--surface-2)}
.cal-cell.out{background:var(--surface-2);color:var(--muted);cursor:default}
.cal-cell.sel{box-shadow:inset 0 0 0 2px var(--red)}
.cal-cell .dn{font-size:12px;font-weight:500}
.cal-cell.today .dn{color:var(--red)}
.cal-cell .cv{font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
.cal-cell .cs{font-size:11px;color:var(--ink-2);line-height:1.3}
.mini{display:inline-flex;align-items:center;gap:4px;font-size:11px;border-radius:999px;padding:1px 7px;font-weight:500;width:max-content;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini.present{background:var(--green-soft);color:var(--green-ink)}
.mini.late,.mini.half,.mini.ot{background:var(--amber-soft);color:var(--amber-ink)}
.mini.absent{background:var(--red-soft);color:var(--red-ink)}
.mini.leave,.mini.holiday,.mini.open{background:var(--blue-soft);color:var(--blue-ink)}
.mini.off,.mini.offwork,.mini.notin{background:var(--track);color:var(--ink-2)}
.mini.offwork{background:var(--amber-soft);color:var(--amber-ink)}

.split{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.todaybox{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.todaybox .clock{font-size:28px;font-weight:500;letter-spacing:-.5px;font-variant-numeric:tabular-nums}

.daystrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:12px}
.daystrip button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--ink-2)}
.daystrip button b{font-size:15px;font-weight:500;color:var(--ink)}
.daystrip button[aria-pressed="true"]{border-color:var(--red);background:var(--red-soft)}
.daystrip button[aria-pressed="true"] b{color:var(--red-ink)}
.daybig .track{height:26px}
.daybig .day{grid-template-columns:1fr}

(function(){

/* ---------------- dates & time ---------------- */
const pad = n => String(n).padStart(2, '0');
const toKey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = fromKey(k); d.setDate(d.getDate() + n); return toKey(d); };
const dow = k => fromKey(k).getDay();
const mondayOf = k => addDays(k, -((dow(k) + 6) % 7));
const monthOf = k => k.slice(0, 7);
const firstOf = m => m + '-01';
const isWeekend = k => dow(k) === 0 || dow(k) === 6;
const DAY_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAY_LONG = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MON_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const fmtDate = k => { const d = fromKey(k); return DAY_SHORT[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()]; };
const fmtLong = k => { const d = fromKey(k); return DAY_LONG[d.getDay()] + ', ' + d.getDate() + ' ' + MON_LONG[d.getMonth()]; };
const fmtShort = k => { const d = fromKey(k); return d.getDate() + ' ' + MON[d.getMonth()]; };
const fmtMonth = m => { const [y, mm] = m.split('-').map(Number); return MON_LONG[mm - 1] + ' ' + y; };
const addMonths = (m, n) => { const [y, mm] = m.split('-').map(Number); const d = new Date(y, mm - 1 + n, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); };
const weekRange = ws => { const a = fromKey(ws), b = fromKey(addDays(ws, 6)); return a.getMonth() === b.getMonth() ? a.getDate() + '–' + b.getDate() + ' ' + MON[b.getMonth()] + ' ' + b.getFullYear() : fmtShort(ws) + ' – ' + fmtShort(addDays(ws, 6)) + ' ' + b.getFullYear(); };
const weekDays = ws => [0, 1, 2, 3, 4, 5, 6].map(d => addDays(ws, d));
const TODAY = toKey(new Date());
const THIS_WEEK = mondayOf(TODAY);
const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const toTime = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
const dur = m => { m = Math.max(0, Math.round(m)); const h = Math.floor(m / 60), r = m % 60; if (!h) return r + 'm'; return r ? h + 'h ' + r + 'm' : h + 'h'; };
const r5 = m => Math.round(m / 5) * 5;
const ceil15 = m => Math.ceil(m / 15) * 15;
const floor15 = m => Math.floor(m / 15) * 15;
const inr = n => '₹' + Number(n).toLocaleString('en-IN');
const clone = o => JSON.parse(JSON.stringify(o));
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };

function rng(seed) {
  let h = 2166136261;
  for (let i = 0; i < seed.length; i++) { h ^= seed.charCodeAt(i); h = Math.imul(h, 16777619); }
  let a = h >>> 0;
  return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function useMedia(q) {
  const [m, setM] = useState(() => window.matchMedia ? window.matchMedia(q).matches : false);
  useEffect(() => { if (!window.matchMedia) return; const mq = window.matchMedia(q); const h = () => setM(mq.matches); mq.addEventListener ? mq.addEventListener('change', h) : mq.addListener(h); return () => { mq.removeEventListener ? mq.removeEventListener('change', h) : mq.removeListener(h); }; }, [q]);
  return m;
}

  { id: 'ACME-001', name: 'Priya Nair', title: 'Engineering Manager', dept: 'Engineering', mgr: 'ACME-021' },

];
const EMAP = Object.fromEntries(EMP.map(e => [e.id, e]));
const EMPLOYEE_ID = 'ACME-002';
const MANAGER_ID = 'ACME-001';
const SHIFTS = { Engineering: ['09:30', '18:30'], Sales: ['10:00', '19:00'], Operations: ['08:00', '17:00'], Finance: ['09:30', '18:30'], HR: ['09:30', '18:30'], Leadership: ['09:30', '18:30'] };
const shiftOf = e => SHIFTS[e.dept].map(toMin);
const shiftLen = e => { const [a, b] = shiftOf(e); return b - a; };
const initials = n => n.split(' ').map(p => p[0]).join('').slice(0, 2);
const first = n => n.split(' ')[0];
const HOL = { '01-26': 'Republic Day', '08-15': 'Independence Day', '10-02': 'Gandhi Jayanti', '11-01': 'Kannada Rajyotsava', '12-25': 'Christmas' };
const holidayOf = k => HOL[k.slice(5)] || null;
const isOff = k => isWeekend(k) || !!holidayOf(k);
const POOLS = {
  Engineering: ['Sprint standup and planning', 'Payroll API: leave balance endpoint', 'Code review for attendance sync PR', 'Bug fixes on ESS mobile layout', 'Pairing on timesheet export', 'Unit tests for payslip service', 'Release checklist and deployment', 'Investigating slow dashboard query', 'Design review with product', 'Refactoring auth middleware'],

const STORE_KEY = 'peko-timesheet-proto-v2';
const submitDateOf = (s, ws) => addDays(ws, (s.settings.submitDay + 6) % 7);
function hist(w, at, by, text) { w.history.push({ at, by, text }); }

function genDay(e, inM, outM, rnd, s) {
  const [ss, se] = shiftOf(e);
  const start = Math.max(ceil15(inM), ss), end = Math.min(floor15(outM), se);
  const pool = POOLS[e.dept];
  const out = [];
  [[start, 13 * 60], [14 * 60, end - (rnd() < 0.35 ? 30 : 0)]].forEach(([a, b]) => {
    let t = a;
    while (b - t >= 30) {
      let len = Math.min(b - t, 60 + Math.floor(rnd() * 4) * 30);
      if (b - t - len < 30) len = b - t;
      out.push({ id: 'e' + (s.seq++), start: toTime(t), end: toTime(t + len), desc: pool[Math.floor(rnd() * pool.length)] });
      t += len;
      if (rnd() < 0.15 && b - t > 45) t += 15;
    }
  });
  return out;
}

function buildDemo() {
  const s = {
    version: 2, builtFor: THIS_WEEK, seq: 1000,
    settings: { mode: 'both', submitDay: 5, tsApproval: true, graceMin: 15, halfDayMin: 270, breakMin: 60, otMin: 30, l2: { attendance: 'HR', overtime: 'Finance', leave: 'HR', reimbursement: 'Finance', timesheet: 'None' }, lastProcessed: addMonths(monthOf(TODAY), -2) },
    weeks: {}, attendance: {}, requests: [],
  };
  const W = [-5, -4, -3, -2, -1, 0].map(i => addDays(THIS_WEEK, i * 7));
  EMP.forEach(e => {
    const rnd = rng(e.id);
    const [ss, se] = shiftOf(e);
    W.forEach(ws => {
      const entries = {};
      weekDays(ws).forEach(k => {
        if (isOff(k) || k > TODAY) return;
        const inM = r5(ss + Math.round(rnd() * 30) - 5);
        if (k === TODAY) { if (nowMin() >= inM) s.attendance[e.id + '|' + k] = { in: toTime(inM) }; return; }
        const outM = r5(se + Math.round(rnd() * 25) - 10);
        s.attendance[e.id + '|' + k] = { in: toTime(inM), out: toTime(outM) };
        entries[k] = genDay(e, inM, outM, rnd, s);
      });
      const w = { status: ws === THIS_WEEK ? 'draft' : 'approved', entries, approved: null, change: null, comment: null, history: [] };
      if (w.status === 'approved') {
        const sub = submitDateOf(s, ws);
        if (!e.mgr) hist(w, sub, 'System', 'Auto-submitted and auto-approved (no reporting manager)');
        else { hist(w, sub, 'System', 'Auto-submitted on ' + DAY_LONG[s.settings.submitDay]); hist(w, addDays(sub, 3), EMAP[e.mgr].name, 'Approved'); }
        w.approved = clone(entries);
      }
      s.weeks[e.id + '|' + ws] = w;
    });
  });
  const wk = (id, i) => s.weeks[id + '|' + W[5 + i]];
  const workDays = ws => weekDays(ws).filter(k => !isOff(k) && k < TODAY);
  const setDay = (id, k, tin, tout, extra, keepEarly) => {

/* ---------------- track ---------------- */
const T0 = 7 * 60, T1 = 22 * 60, TSPAN = T1 - T0;
const pct = m => ((Math.min(Math.max(m, T0), T1) - T0) / TSPAN) * 100;
function DayTrack({ win, list }) {
  const segs = [];
  (list || []).forEach(e => {
    const a = toMin(e.start), b = toMin(e.end);
    if (win.start == null) { segs.push({ a, b, out: true }); return; }
    if (a < win.start) segs.push({ a, b: Math.min(b, win.start), out: true });
    const ia = Math.max(a, win.start), ib = Math.min(b, win.end);
    if (ib > ia) segs.push({ a: ia, b: ib, out: false });
    if (b > win.end) segs.push({ a: Math.max(a, win.end), b, out: true });
  });
  return html`<div className="track" aria-hidden="true">
    ${win.start != null && html`<div className="w" style=${{ left: pct(win.start) + '%', width: (pct(win.end) - pct(win.start)) + '%' }}></div>`}
    ${segs.map((s, i) => html`<div key=${i} className=${s.out ? 'seg-out' : 'seg-in'} style=${{ left: pct(s.a) + '%', width: Math.max(0.6, pct(s.b) - pct(s.a)) + '%' }}></div>`)}
  </div>`;
}
function Ticks() {
  return html`<div className="ticks" aria-hidden="true">${[8, 10, 12, 14, 16, 18, 20].map(h => html`<span key=${h} style=${{ left: pct(h * 60) + '%' }}>${h > 12 ? (h - 12) + 'pm' : h === 12 ? '12pm' : h + 'am'}</span>`)}</div>`;
}

function reqStatusText(r) {

  if (r.status === 'pending_l2') return 'with ' + r.l2 + ' team';
  return r.status === 'approved' ? 'approved' : 'rejected';
}
function ReqStatusChip({ r }) {
  const cls = r.status === 'approved' ? 'green' : r.status === 'rejected' ? 'red' : 'blue';
  const lbl = r.type === 'overtime' && r.data.kind === 'planned' ? 'Planned overtime' : TYPE_LABEL[r.type];
  return html`<span className=${'chip ' + cls}><span className="dot"></span>${lbl} ${reqStatusText(r)}</span>`;
}
function Chain({ r }) {
  const e = EMAP[r.empId];
  const t1 = r.trail.find(t => t.level === 1), t2 = r.trail.find(t => t.level === 2);
  const s1 = t1 ? (t1.action === 'Skipped' ? 'skipped' : t1.action === 'Approved' ? 'done' : 'rejected') : r.status === 'pending_l1' ? 'pending' : '';
  const s2 = t2 ? (t2.action === 'Approved' ? 'done' : 'rejected') : r.status === 'pending_l2' ? 'pending' : '';
  const sym = st => st === 'done' ? '✓' : st === 'rejected' ? '✕' : st === 'pending' ? '…' : '';
  const showL2 = !!r.l2 || r.status === 'pending_l1';
  return html`<div className="chain">
    <span className=${'step ' + s1}>${sym(s1)} ${e.mgr ? EMAP[e.mgr].name + ' (manager)' : 'No manager, skipped'}</span>
    ${showL2 && html`<span className="arrow">→</span>`}
    ${showL2 && html`<span className=${'step ' + s2}>${sym(s2)} ${r.l2 ? r.l2 + ' team' : 'Level 2 per settings'}</span>`}
  </div>`;
}
function reqTitle(r) { return r.type === 'overtime' && r.data.kind === 'planned' ? 'Planned overtime' : TYPE_LABEL[r.type]; }
function reqSummary(r) {
  const d = r.data;
  if (r.type === 'overtime') return dur(d.minutes) + ' on ' + fmtDate(d.date) + (holidayOf(d.date) ? ' (' + holidayOf(d.date) + ')' : isWeekend(d.date) ? ' (weekly off)' : '') + (d.note ? '. ' + d.note : '');
  if (r.type === 'leave') return d.leaveType + ' leave, ' + fmtShort(d.from) + (d.to !== d.from ? ' – ' + fmtShort(d.to) : '') + ' (' + d.days + (d.days === 1 ? ' day' : ' days') + '). ' + d.reason;
  if (r.type === 'reimbursement') return inr(d.amount) + ', ' + d.category + '. ' + d.description;
  if (r.type === 'attendance') {
    const parts = [];
    if (d.from.in !== d.to.in) parts.push('check-in ' + d.from.in + ' → ' + d.to.in);
    if (d.from.out !== d.to.out) parts.push('check-out ' + (d.from.out || 'none') + (d.autoFix ? ' (auto)' : '') + ' → ' + d.to.out);
    return fmtDate(d.date) + ': ' + parts.join(', ') + '. ' + d.reason;
  }
  return '';
}

      if (approvalOn(s) && w.status === 'submitted') { const last = w.history[w.history.length - 1]; if (!last || last.text !== 'Edited while waiting for approval') hist(w, TODAY, emp.name, 'Edited while waiting for approval'); }
    });
  };
  const del = (k, id) => {
    if (draft && draft.ws === mondayOf(k)) { setDraft(prev => { const d = clone(prev); d.entries[k] = (d.entries[k] || []).filter(e => e.id !== id); return d; }); return; }
    update(s => { const w = writeWeek(s, emp.id, mondayOf(k)); w.entries[k] = (w.entries[k] || []).filter(e => e.id !== id); });
  };
  const p = periodOf(store, emp, view, cursor, entriesFor);
  const step = n => { setSel(null); setCursor(view === 'day' ? addDays(cursor, n) : view === 'week' ? addDays(cursor, 7 * n) : firstOf(addMonths(monthOf(cursor), n))); };
  const pick = k => { setCursor(k); setSel(view === 'day' ? null : k); };
  const changeView = v => { setView(v); if (v === 'day') { setCursor(sel || cursor); setSel(null); } };
  const totLogged = p.days.reduce((t, k) => t + sumMins(entriesFor(k)), 0);
  const totExp = p.days.reduce((t, k) => t + expectedFor(store, emp, k), 0);
  const onOT = (k, o) => setOtModal({ k, o, mins: o.extra });
  const onFix = store.settings.mode === 'both' ? (k, pr) => setFix({ k, prefill: pr }) : null;

  const allLocked = weekDays(fws).every(k => isLocked(store, k));
  const editingThis = draft && draft.ws === fws;
  const pendingChanges = editingThis ? diffEntries(fweek.approved || fweek.entries, draft.entries) : [];
  let statusLine, actions = null;
  if (!appr) statusLine = 'Approval is off. ' + (mgr ? mgr.name : 'Your manager') + ' can see your timesheet, and you can edit it until payroll is processed.';
  else if (allLocked) statusLine = 'Payroll is processed for this period, so it can’t be changed.';
  else if (editingThis) { statusLine = 'Editing a copy. The approved week stays until ' + (mgr ? mgr.name : 'HR') + ' approves your change. ' + pendingChanges.reduce((t, d) => t + d.rows.length, 0) + ' change(s) so far.';
    actions = [html`<button key="s" className="btn sm primary" disabled=${!pendingChanges.length} onClick=${() => setAskReason(true)}>Send change</button>`, html`<button key="d" className="btn sm" onClick=${() => setDraft(null)}>Discard</button>`]; }
  else if (fweek.change) { statusLine = 'Change waiting for ' + (mgr ? mgr.name : 'HR') + '. Reason: ' + fweek.change.reason;
    actions = [html`<button key="v" className="btn sm" onClick=${() => setShowProposed(v => !v)}>${showProposed ? 'Show approved' : 'Show my changes'}</button>`, html`<button key="w" className="btn sm ghost" onClick=${() => { update(s => { const w = writeWeek(s, emp.id, fws); w.change = null; hist(w, TODAY, emp.name, 'Withdrew the change request'); }); notify('Change request withdrawn'); }}>Withdraw</button>`]; }
  else if (fweek.status === 'approved') { statusLine = 'Approved by ' + (mgr ? mgr.name : 'system') + '. You can still request a change.'; actions = html`<button className="btn sm" onClick=${() => setDraft({ ws: fws, entries: clone(fweek.entries) })}>Request a change</button>`; }
  else if (fweek.status === 'rejected') { statusLine = (mgr ? mgr.name : 'Manager') + ' asked for an update: ' + fweek.comment; actions = html`<button className="btn sm primary" onClick=${() => { update(s => submitWeek(s, emp.id, fws, emp.name, 'Resubmitted after changes')); notify('Resubmitted to ' + (mgr ? mgr.name : 'HR')); }}>Resubmit</button>`; }
  else if (fweek.status === 'submitted') { const sub = fweek.history.slice().reverse().find(h => /submit/i.test(h.text)); statusLine = 'Sent to ' + (mgr ? mgr.name : 'HR') + (sub ? ' on ' + fmtShort(sub.at) : '') + '. You can keep editing until it’s approved.'; }
  else { const sd = submitDateOf(store, fws); statusLine = sd >= TODAY ? 'Auto-submits to ' + (mgr ? mgr.name : 'HR') + ' on ' + fmtDate(sd) + '.' : 'Goes out on the next submission run.'; }

  return html`<div>
    <div className="ts-top">
      <${Calendar3} emp=${emp} cursor=${cursor} sel=${view === 'day' ? cursor : sel} rangeFn=${p.rangeFn} onPick=${pick}
        onShift=${n => { setCursor(firstOf(addMonths(monthOf(cursor), n))); setSel(null); }} onToday=${() => { setCursor(TODAY); setSel(view === 'day' ? null : TODAY); }} />
      <div className="ts-side">
        <section className="panel pad" aria-label="Week status">
          <div className="row"><h3>Week of ${fmtShort(fws)}</h3><span className="spacer"></span><${WeekChip} w=${fweek} /></div>
          <div className="small" style=${{ margin: '8px 0', color: 'var(--ink-2)' }}>${statusLine}</div>
          ${actions && html`<div className="row" style=${{ gap: '6px' }}>${kids(actions)}</div>`}
        </section>
        <${UnloggedCard} emp=${emp} days=${p.days} entriesFor=${entriesFor} view=${view} onPick=${k => { if (view === 'day') setCursor(k); else setSel(k); }} />
        ${appr && html`<${HistoryCard} week=${fweek} />`}
      </div>
    </div>
    <div className="viewbar" style=${{ marginTop: '18px' }}>
      <${Seg} label="View" value=${view} onChange=${changeView} options=${[['day', 'Day'], ['week', 'Week'], ['month', 'Month']]} />
      <button className="btn sm" aria-label="Previous" onClick=${() => step(-1)}>‹</button>
      <span className="range">${p.label}</span>
      <button className="btn sm" aria-label="Next" onClick=${() => step(1)}>›</button>
      <span className="spacer"></span>
      <span className="small" style=${{ color: 'var(--ink-2)' }}>Logged <b style=${{ fontWeight: 500 }}>${dur(totLogged)}</b> of ${dur(totExp)} expected</span>
      ${editingThis && html`<span className="chip amber">Editing a change</span>`}
      ${showProposed && fweek.change && !editingThis && html`<span className="chip amber">Showing your proposed changes</span>`}
    </div>
    <${DayLines} emp=${emp} days=${p.days} entriesFor=${entriesFor} view=${view} sel=${sel} onToggle=${k => { if (view !== 'day') setSel(sel === k ? null : k); }}
      panel=${k => html`<${EntriesPanel} emp=${emp} k=${k} list=${entriesFor(k)} editable=${canEdit(k)} onSave=${save} onDelete=${del} onRequestOT=${draft ? null : onOT} onFix=${draft ? null : onFix} />`} />
    ${askReason && html`<${CommentModal} title="Send change for approval" label=${'Why are you changing this week? ' + (mgr ? mgr.name : 'HR') + ' will see this.'} confirm="Send for approval" required onClose=${() => setAskReason(false)}
      onSubmit=${reason => { update(s => { const w = writeWeek(s, emp.id, draft.ws);
        if (!emp.mgr) { w.entries = clone(draft.entries); w.approved = clone(draft.entries); hist(w, TODAY, emp.name, 'Changed an approved week. Auto-approved (no reporting manager): ' + reason); }
        else { w.change = { entries: clone(draft.entries), reason, at: TODAY, by: emp.name }; hist(w, TODAY, emp.name, 'Requested a change: ' + reason); } });
        setDraft(null); setAskReason(false); notify('Change sent to ' + (mgr ? mgr.name : 'HR')); }} />`}
    ${otModal && html`<${OvertimeModal} emp=${emp} prefill=${otModal} onClose=${() => setOtModal(null)} />`}

function weekStatusText(store, emp, w) {

    ${tab === 'changes' && html`<div>${diffs.map(d => html`<div key=${d.day} className="diffday">
        <div className="row"><b style=${{ fontWeight: 500 }}>${fmtDate(d.day)}</b><span className="muted small">${dur(d.before)} → ${dur(d.after)}</span></div>

          : r.kind === 'del' ? html`<div key=${i} className="drow del"><span>−</span><span className="x">${cell(r.before)}</span><span className="x">${r.before.desc}</span></div>`
          : html`<div key=${i} className="drow edit"><span>~</span>
              <span>${entTime(r.before) !== entTime(r.after) || entryMins(r.before) !== entryMins(r.after) ? kids(html`<span className="old">${cell(r.before)}</span><br/>${cell(r.after)}`) : cell(r.after)}</span>

    ${tab === 'sheet' && html`<${TimesheetBrowser} emp=${emp} start=${item.ws} startView="week" override=${{ ws: item.ws, entries: shown }}

              ${c.l ? html`<b style=${{ fontWeight: 500, fontVariantNumeric: 'tabular-nums' }}>${dur(c.l)}</b>` : null}${c.note}${c.ot ? html`<span className="mini ot">+${dur(c.ot.extra)}</span>` : null}</button></td>`; })}
          <td><b style=${{ fontWeight: 500 }}>${dur(total)}</b></td>
          ${appr && html`<td><${WeekChip} w=${w} /></td>`}
        </tr>`; })}</tbody></table></div>`
    : html`<div className="panel scroll-x"><table>
      <thead><tr><th>Team member</th><th>Logged</th><th>Days with nothing logged</th><th>Extra hours</th>${appr && html`<th>Weeks</th>`}</tr></thead>

function TimesheetSummary() {

  </div>`;

}
function Settings() {
  const { store, update, notify, reset } = useApp();
  const st = store.settings;
  const lastMonth = addMonths(monthOf(TODAY), -1);
  const blockers = st.lastProcessed < lastMonth ? payrollBlockers(store, lastMonth) : [];
  const set = (k, v) => update(s => { s.settings[k] = v; });
  const modes = [['attendance', 'Attendance only', 'Employees check in and out. No timesheets.'], ['both', 'Attendance + timesheet', 'Check in and out, then log what you worked on. Each day runs from check-in to check-out.'], ['timesheet', 'Timesheet only', 'No check-in. Each day runs on the shift times, and timesheets count as days worked.']];
  const comps = [['attendance', 'Attendance corrections'], ['overtime', 'Overtime'], ['leave', 'Leave'], ['reimbursement', 'Reimbursements'], ['timesheet', 'Timesheets']];
  return html`<div className="setgrid">
    <div className="panel pad"><h2 style=${{ marginBottom: '4px' }}>How Acme tracks time</h2><div className="muted small" style=${{ marginBottom: '14px' }}>Changes apply to everyone straight away.</div>
      <div className="modes">${modes.map(([k, t, d]) => html`<button key=${k} className="mode" aria-pressed=${st.mode === k} onClick=${() => { set('mode', k); notify('Switched to ' + t.toLowerCase()); }}><b>${t}</b><span>${d}</span></button>`)}</div></div>
    <div className="panel pad"><h2 style=${{ marginBottom: '4px' }}>Working day rules</h2><div className="muted small" style=${{ marginBottom: '14px' }}>Used for late marks, half days and overtime suggestions.</div>
      <div className="rules">
        <${NumField} id="g" label="Grace period after shift start" value=${st.graceMin} unit="min" onChange=${v => set('graceMin', v)} />
        <${NumField} id="h" label="Half day if time at work is under" value=${st.halfDayMin / 60} unit="hours" step="0.5" onChange=${v => set('halfDayMin', Math.round(v * 60))} />
        <${NumField} id="b" label="Break included in each shift" value=${st.breakMin} unit="min" onChange=${v => set('breakMin', v)} />
        <${NumField} id="o" label="Suggest overtime from" value=${st.otMin} unit="min extra" onChange=${v => set('otMin', v)} />
      </div>
      <div className="small muted">A 9h shift includes the break. Overtime is time beyond the shift length, whatever time someone checks in. Weekends and holidays count in full. Days without a check-out close automatically at shift end.</div></div>
    ${st.mode !== 'attendance' && html`<div className="panel pad"><div className="row"><div style=${{ flex: 1, minWidth: '240px' }}><h2 style=${{ marginBottom: '4px' }}>Timesheet approval</h2>
        <div className="muted small">When on, timesheets go to the reporting manager every ${DAY_LONG[st.submitDay]}, and payroll for a month can't be processed until every timesheet in it is approved.</div></div>
        <button className="switch" role="switch" aria-checked=${st.tsApproval} aria-label="Timesheet approval" onClick=${() => { set('tsApproval', !st.tsApproval); notify('Timesheet approval ' + (st.tsApproval ? 'off' : 'on')); }}></button></div>
      ${st.tsApproval && html`<div className="row" style=${{ marginTop: '14px' }}><label htmlFor="sd" className="small" style=${{ fontWeight: 500 }}>Submit every</label>
        <select id="sd" className="input" style=${{ width: 'auto' }} value=${st.submitDay} onChange=${e => set('submitDay', Number(e.target.value))}>${[1, 2, 3, 4, 5, 6, 0].map(d => html`<option key=${d} value=${d}>${DAY_LONG[d]}</option>`)}</select>
        <button className="btn" onClick=${() => { update(runSubmission); notify('Submission run done'); }}>Simulate submission day</button></div>`}</div>`}
    <div className="panel"><div className="pad" style=${{ paddingBottom: '8px' }}><h2 style=${{ marginBottom: '4px' }}>Approvals</h2><div className="muted small">Level 1 is always the reporting manager. The CEO has no manager, so their requests skip to level 2.</div></div>
      <div className="scroll-x"><table><thead><tr><th>Request</th><th>Level 1</th><th>Level 2</th></tr></thead>
        <tbody>${comps.map(([k, l]) => { const off = (k === 'timesheet' && (st.mode === 'attendance' || !st.tsApproval)) || (k === 'attendance' && st.mode === 'timesheet');
          return html`<tr key=${k} style=${{ opacity: off ? 0.5 : 1 }}><td>${l}${off && html`<div className="muted small">Not in use</div>`}</td><td>Reporting manager</td>
            <td><select className="input" style=${{ width: 'auto' }} aria-label=${'Level 2 for ' + l} value=${st.l2[k]} disabled=${off} onChange=${e => update(s => { s.settings.l2[k] = e.target.value; })}>${['HR', 'Finance', 'None'].map(x => html`<option key=${x} value=${x}>${x === 'None' ? 'None (manager is final)' : x + ' team'}</option>`)}</select></td></tr>`; })}</tbody></table></div></div>
    <div className="panel pad"><h2 style=${{ marginBottom: '4px' }}>Run payroll</h2><div className="muted small" style=${{ marginBottom: '12px' }}>Once payroll is processed for a month, its timesheets and attendance can't be edited.</div>
      <div className="row"><span>Processed up to <b style=${{ fontWeight: 500 }}>${fmtMonth(st.lastProcessed)}</b></span><span className="spacer"></span>
        ${st.lastProcessed < lastMonth ? html`<button className="btn primary" disabled=${blockers.length > 0} onClick=${() => { set('lastProcessed', lastMonth); notify('Payroll processed for ' + fmtMonth(lastMonth)); }}>Process payroll for ${fmtMonth(lastMonth)}</button>`
          : html`<button className="btn" onClick=${() => { set('lastProcessed', addMonths(lastMonth, -1)); notify('Undid ' + fmtMonth(lastMonth) + ' payroll (demo)'); }}>Undo ${fmtMonth(lastMonth)} (demo)</button>`}</div>
      ${blockers.length > 0 && html`<div><div className="banner amber" style=${{ marginTop: '12px', marginBottom: 0 }}><div><b>Can't process ${fmtMonth(lastMonth)} yet.</b> These timesheets need approval first.</div></div>
        <div className="blockers">${blockers.map(b => html`<div key=${b.e.id}><b style=${{ fontWeight: 500 }}>${b.e.name}</b><span className="muted">manager: ${b.e.mgr ? EMAP[b.e.mgr].name : 'none'}</span>${b.open.map(o => html`<span key=${o.ws} className=${'chip ' + WEEK_STATUS[o.st].cls}>${fmtShort(o.ws)}: ${WEEK_STATUS[o.st].label}</span>`)}</div>`)}</div></div>`}</div>
    <div className="panel pad row"><div><h2 style=${{ marginBottom: '4px' }}>Demo data</h2><div className="muted small">Puts every timesheet and request back to the starting state.</div></div><span className="spacer"></span><button className="btn" onClick=${reset}>Reset demo data</button></div>
  </div>`;
}
function Employees() {
  return html`<div className="panel scroll-x"><table><thead><tr><th>Employee</th><th>ID</th><th>Department</th><th>Designation</th><th>Reports to</th><th>Shift</th></tr></thead>
    <tbody>${EMP.map(e => html`<tr key=${e.id}><td><b style=${{ fontWeight: 500 }}>${e.name}</b>${e.id === EMPLOYEE_ID ? html` <span className="chip blue">ESS - Employee</span>` : e.id === MANAGER_ID ? html` <span className="chip blue">ESS - Manager</span>` : null}</td><td className="muted">${e.id}</td><td>${e.dept}</td><td>${e.title}</td><td>${e.mgr ? EMAP[e.mgr].name : 'None'}</td><td className="muted">${SHIFTS[e.dept].join('–')}</td></tr>`)}</tbody></table></div>`;
}
function Payroll() {
  const { store } = useApp();
  const [tab, setTab] = useState('approvals');
  const pending = store.requests.filter(r => r.status === 'pending_l2' && reqVisible(store, r)).length;
  const TABS = [{ k: 'approvals', label: 'Approvals', n: pending }, approvalOn(store) && { k: 'summary', label: 'Timesheet status' }, { k: 'settings', label: 'Attendance & timesheet settings' }, { k: 'employees', label: 'Employees', n: EMP.length }].filter(Boolean);
  const cur = TABS.find(t => t.k === tab) ? tab : TABS[0].k;
  return html`<div><${Tabs} tabs=${TABS} value=${cur} onChange=${setTab} />
    ${cur === 'approvals' && html`<${PayrollApprovals} />`}${cur === 'summary' && html`<${TimesheetSummary} />`}${cur === 'settings' && html`<${Settings} />`}${cur === 'employees' && html`<${Employees} />`}</div>`;
}

/* ---------------- demo controls & app ---------------- */
function DemoControls() {
  const { store, update, notify, reset } = useApp();
  const [open, setOpen] = useState(false);
  return html`<div className="demo">
    ${open && html`<div className="panel demo-pop" role="dialog" aria-label="Demo controls"><h3 style=${{ marginBottom: '10px' }}>Demo controls</h3>
      <div className="field"><label>Tracking mode</label><${Seg} label="Tracking mode" value=${store.settings.mode} onChange=${k => { update(s => { s.settings.mode = k; }); notify(MODE_LABEL[k]); }} options=${[['attendance', 'Attendance'], ['both', 'Both'], ['timesheet', 'Timesheet']]} /></div>
      <div className="row">${approvalOn(store) && html`<button className="btn sm" onClick=${() => { update(runSubmission); notify('Submission run done'); }}>Simulate submission day</button>`}<button className="btn sm" onClick=${reset}>Reset demo data</button></div>
      <div className="small muted" style=${{ marginTop: '10px' }}>Changes are saved in this browser, so approvals carry across the three tabs.</div></div>`}
    <button className="demo-btn" aria-expanded=${open} onClick=${() => setOpen(o => !o)}>${open ? 'Close' : 'Demo controls'}</button>
  </div>`;
}
function App() {
  const [store, setStore] = useState(loadStore);
  const [section, setSection] = useState('ess-employee');
  const [toast, setToast] = useState(null);
  useEffect(() => { try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) { /* ignore */ } }, [store]);
  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), 2600); return () => clearTimeout(t); }, [toast]);
  const update = useCallback(fn => setStore(prev => { const s = clone(prev); fn(s); return s; }), []);
  const notify = useCallback(msg => setToast({ msg, id: Date.now() }), []);
  const reset = useCallback(() => { setStore(buildDemo()); setToast({ msg: 'Demo data reset', id: Date.now() }); }, []);
  const ctx = useMemo(() => ({ store, update, notify, reset }), [store, update, notify, reset]);
  const mgrReports = EMP.filter(e => e.mgr === MANAGER_ID).map(e => e.id);
  const mgrCount = teamTimesheetItems(store, MANAGER_ID).length + store.requests.filter(r => mgrReports.includes(r.empId) && r.status === 'pending_l1' && reqVisible(store, r)).length;
  const payCount = store.requests.filter(r => r.status === 'pending_l2' && reqVisible(store, r)).length;
  const NAV = [{ k: 'payroll', label: 'Payroll', icon: Icon.payroll, n: payCount }, { k: 'ess-employee', label: 'ESS - Employee', icon: Icon.emp }, { k: 'ess-manager', label: 'ESS - Manager', icon: Icon.mgr, n: mgrCount }];
  const persona = section === 'ess-employee' ? EMAP[EMPLOYEE_ID] : section === 'ess-manager' ? EMAP[MANAGER_ID] : null;
  const titles = { payroll: ['Payroll', 'Approvals, timesheet status and settings for Acme'], 'ess-employee': ['ESS - Employee', 'Signed in as ' + EMAP[EMPLOYEE_ID].name], 'ess-manager': ['ESS - Manager', 'Signed in as ' + EMAP[MANAGER_ID].name + ', manages ' + mgrReports.length + ' people'] };
  return html`<${Ctx.Provider} value=${ctx}>
    <div className="app">
      <nav className="side" aria-label="Services">
        <div className="logo"><span className="logo-mark" aria-hidden="true"></span>Peko</div>
        ${NAV.map(n => html`<button key=${n.k} className="nav" aria-current=${section === n.k ? 'page' : undefined} onClick=${() => setSection(n.k)}>${n.icon}<span>${n.label}</span>${n.n ? html`<span className="count">${n.n}</span>` : null}</button>`)}
        <div className="side-foot">Attendance & Timesheet prototype<br/>Mode: ${MODE_LABEL[store.settings.mode]}</div>
      </nav>
      <div className="main">
        <header className="top"><div><h1>${titles[section][0]}</h1><div className="sub">${titles[section][1]}</div></div>
          <div className="who"><span className="avatar">${persona ? initials(persona.name) : 'A'}</span><div><b>${persona ? persona.name : 'Acme Technologies Pvt Ltd'}</b><span>${persona ? persona.title : 'Corporate'}</span></div></div></header>
        <main className="content">
          ${section === 'payroll' && html`<${Payroll} />`}
          ${section === 'ess-employee' && html`<${Ess} key="emp" emp=${EMAP[EMPLOYEE_ID]} />`}
          ${section === 'ess-manager' && html`<${Ess} key="mgr" emp=${EMAP[MANAGER_ID]} isManager />`}
        </main>
      </div>
    </div>
    <${DemoControls} />
    ${toast && html`<div className="toast" role="status" key=${toast.id}>${toast.msg}</div>`}
  <//>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
})();

</script>
</body>
</html>
