const DEV_PAGES = [['shared', 'Shared platform (every module)'], ['attendance', 'Attendance'], ['timesheet', 'Timesheet'], ['overtime', 'Overtime'], ['leave', 'Leave'], ['reimbursement', 'Reimbursements'], ['people', 'Profile & employees'], ['myteam', 'My team (approvers)'], ['ess-shell', 'ESS shell: Overview & navigation'], ['settings', 'Payroll settings']];
// which module a page belongs to
const PAGE_MODULE = { 'ess:home': 'ess-shell', 'ess:time': 'attendance', 'ess:team': 'myteam', 'ess:leave': 'leave', 'ess:reimbursement': 'reimbursement', 'ess:profile': 'people', 'pay:timesheet': 'timesheet', 'pay:attendance': 'attendance', 'pay:leave': 'leave', 'pay:overtime': 'overtime', 'pay:reimbursement': 'reimbursement', 'pay:employees': 'people', 'pay:settings': 'settings' };
function DevNotes({ section, essPage }) {
  const { notify } = useApp();
  const [open, setOpen] = useState(false);
  const [pick, setPick] = useState(null);
  const here = PAGE_MODULE[section === 'payroll' ? 'pay:' + CUR.payTab : 'ess:' + (essPage || 'home')] || 'shared';
  const key = pick || here;
  const n = DEV_NOTES[key];
  const asText = k => { const x = DEV_NOTES[k]; return '# ' + x.title + '\n\n' + x.sections.map(([h, items]) => '## ' + h + '\n' + items.map(i => '- ' + i).join('\n')).join('\n\n'); };
  const copy = all => { try { navigator.clipboard.writeText(all ? DEV_PAGES.map(([k]) => asText(k)).join('\n\n') : asText(key)); notify(all ? 'All developer notes copied' : 'Notes for this page copied'); } catch (e) { notify('Couldn\u2019t copy'); } };
  return html`<div>
    <button className="devn-btn" aria-expanded=${open} onClick=${() => { setOpen(o => !o); setPick(null); }}>${open ? 'Close notes' : 'Developer notes'}</button>
    ${open && html`<div className="drawer-scrim" onClick=${e => { if (e.target === e.currentTarget) setOpen(false); }}><aside className="drawer devn" role="dialog" aria-label="Developer notes">
      <div className="drawer-h"><div><h2>Developer notes</h2><div className="small muted">Prototype-only. Grouped by module, so each module can be built on its own.</div></div><button className="btn ghost sm" aria-label="Close" onClick=${() => setOpen(false)}>\u2715</button></div>
      <div className="devn-bar"><select className="input" aria-label="Page" value=${key} onChange=${e => setPick(e.target.value)}>${DEV_PAGES.map(([k, l]) => html`<option key=${k} value=${k}>${l}${k === here ? ' (this page\u2019s module)' : ''}</option>`)}</select>
        <button className="btn sm" onClick=${() => copy(false)}>Copy</button><button className="btn sm ghost" onClick=${() => copy(true)}>Copy all</button></div>
      <div className="drawer-b">
        <h3 className="devn-title">${n.title}</h3>
        ${n.sections.map(([h, items]) => html`<section key=${h} className="devn-sec"><h4>${h}</h4><ul>${items.map((i, j) => html`<li key=${j}>${i}</li>`)}</ul></section>`)}
        ${key !== 'shared' ? html`<button className="btn link small" onClick=${() => setPick('shared')}>Also read: Shared platform \u203a</button>` : null}
      </div>
    </aside></div>`}
  </div>`;
}
function DemoControls() {
  const { store, update, notify, reset } = useApp();
  const [open, setOpen] = useState(false);
  return html`<div className="demo">
    ${open && html`<div className="panel demo-pop" role="dialog" aria-label="Demo controls"><h3 style=${{ marginBottom: '10px' }}>Demo controls</h3>
      <div className="field"><label>Tracking mode</label><${Seg} label="Tracking mode" value=${store.settings.mode} onChange=${k => { update(s => { s.settings.mode = k; }); notify(MODE_LABEL[k]); }} options=${[['attendance', 'Attendance'], ['both', 'Both'], ['timesheet', 'Timesheet']]} /></div>
      <div className="row">${approvalOn(store) && html`<button className="btn sm" onClick=${() => { update(runSubmission); notify('Submission run done'); }}>Simulate submission day</button>`}<button className="btn sm" onClick=${() => { update(s => { delete s.attendance[EMPLOYEE_ID + '|' + TODAY]; delete s.attendance[MANAGER_ID + '|' + TODAY]; }); notify('Today’s check-in cleared for both personas'); }}>Reset today’s check-in</button><button className="btn sm" onClick=${reset}>Reset demo data</button></div>
      ${(() => { const lm = addMonths(monthOf(TODAY), -1); const done = store.settings.lastProcessed >= lm; const bl = done ? [] : payrollBlockers(store, lm); return html`<div className="field" style=${{ marginTop: '10px' }}><label>Payroll (demo)</label>
        <div className="small muted" style=${{ marginBottom: '6px' }}>Processed up to ${fmtMonth(store.settings.lastProcessed)}. Processing records the month as paid. Nothing is locked; later changes go to the next payroll.${!done && bl.length ? ' ' + bl.length + ' employee' + (bl.length === 1 ? ' has' : 's have') + ' timesheets for ' + fmtMonth(lm) + ' not approved yet.' : ''}</div>
        <div className="row" style=${{ gap: '6px' }}>${done ? html`<button className="btn sm" onClick=${() => { update(s => { s.settings.lastProcessed = addMonths(lm, -1); }); notify('Undid ' + fmtMonth(lm) + ' payroll (demo)'); }}>Undo ${fmtMonth(lm)}</button>` : kids(html`<button className="btn sm primary" disabled=${bl.length > 0} title=${bl.length ? 'Approve the remaining timesheets first' : ''} onClick=${() => { update(s => { s.settings.lastProcessed = lm; }); notify('Payroll processed for ' + fmtMonth(lm) + '.'); }}>Process ${fmtMonth(lm)} payroll</button>${bl.length ? html`<button className="btn sm" onClick=${() => { update(s => { s.settings.lastProcessed = lm; }); notify('Processed ' + fmtMonth(lm) + ' anyway (demo override)'); }}>Process anyway</button>` : null}`)}</div></div>`; })()}
      <div className="field" style=${{ marginTop: '10px' }}><label>Rohan’s dates (for the leave demo)</label><div className="row" style=${{ flexWrap: 'nowrap', gap: '6px' }}>
        <label className="efl" style=${{ flex: 1 }}><span>Joined</span><input className="input" type="date" value=${empLife(store, EMPLOYEE_ID).doj} onChange=${e => e.target.value && update(s => { s.empLife = s.empLife || {}; s.empLife[EMPLOYEE_ID] = Object.assign({}, empLife(s, EMPLOYEE_ID), { doj: e.target.value }); })} /></label>
        <label className="efl" style=${{ flex: 1 }}><span>Status</span><select className="input" value=${empLife(store, EMPLOYEE_ID).status} onChange=${e => update(s => { s.empLife = s.empLife || {}; s.empLife[EMPLOYEE_ID] = Object.assign({}, empLife(s, EMPLOYEE_ID), { status: e.target.value, confirmedOn: e.target.value === 'active' ? TODAY : null }); })}><option value="probation">Probation</option><option value="active">Active</option></select></label>
        <label className="efl" style=${{ flex: 1 }}><span>Leaving</span><input className="input" type="date" value=${empLife(store, EMPLOYEE_ID).exit || ''} onChange=${e => update(s => { s.empLife = s.empLife || {}; s.empLife[EMPLOYEE_ID] = Object.assign({}, empLife(s, EMPLOYEE_ID), { exit: e.target.value || null }); })} /></label></div></div>
      <div className="small muted" style=${{ marginTop: '10px' }}>Changes are saved in this browser, so approvals carry across the three tabs.</div></div>`}
    <button className="demo-btn" aria-expanded=${open} onClick=${() => setOpen(o => !o)}>${open ? 'Close' : 'Demo controls'}</button>
  </div>`;
}
function App() {
  const [store, setStore] = useState(loadStore);
  const [section, setSection] = useState('ess-employee');
  const [essNav, setEssNav] = useState({ 'ess-employee': { k: 'home', params: {} }, 'ess-manager': { k: 'home', params: {} } });
  const setNavFor = sec => v => setEssNav(prev => Object.assign({}, prev, { [sec]: v }));
  const [toast, setToast] = useState(null);
  useEffect(() => { try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) { /* ignore */ } }, [store]);
  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), 2600); return () => clearTimeout(t); }, [toast]);
  const update = useCallback(fn => setStore(prev => { const s = clone(prev); fn(s); return s; }), []);
  const notify = useCallback(msg => setToast({ msg, id: Date.now() }), []);
  const reset = useCallback(() => { setStore(buildDemo()); setToast({ msg: 'Demo data reset', id: Date.now() }); }, []);
  syncConfig(store);
  const ctx = useMemo(() => ({ store, update, notify, reset }), [store, update, notify, reset]);
  const mgrReports = EMP.filter(e => e.mgr === MANAGER_ID).map(e => e.id);
  const mgrCount = teamTimesheetItems(store, MANAGER_ID).length + personQueue(store, MANAGER_ID).length;
  const payCount = store.requests.filter(r => r.status === 'pending_l2' && reqVisible(store, r)).length;
  const NAV = [{ k: 'payroll', label: 'Payroll', icon: Icon.payroll, n: payCount }, { k: 'ess-employee', label: 'ESS - Employee', icon: Icon.emp }, { k: 'ess-manager', label: 'ESS - Manager', icon: Icon.mgr, n: mgrCount }];
  const persona = section === 'ess-employee' ? EMAP[EMPLOYEE_ID] : section === 'ess-manager' ? EMAP[MANAGER_ID] : null;
  const titles = { payroll: ['Payroll', 'Approvals, timesheet status and settings for Acme'], 'ess-employee': ['ESS - Employee', 'Signed in as ' + EMAP[EMPLOYEE_ID].name], 'ess-manager': ['ESS - Manager', 'Signed in as ' + EMAP[MANAGER_ID].name + ', manages ' + mgrReports.length + ' people'] };
  return html`<${Ctx.Provider} value=${ctx}>
    <div className="app">
      <nav className="side" aria-label="Services">
        <div className="logo"><span className="logo-mark" aria-hidden="true"></span>Peko</div>
        ${NAV.map(n => html`<div key=${n.k} className="navgrp">
          <button className="nav" aria-current=${section === n.k && n.k === 'payroll' ? 'page' : undefined} aria-expanded=${n.k !== 'payroll' ? section === n.k : undefined} onClick=${() => { setSection(n.k); if (n.k !== 'payroll') setNavFor(n.k)({ k: 'home', params: {} }); }}>${n.icon}<span>${n.label}</span>${n.n ? html`<span className="count">${n.n}</span>` : null}</button>
          ${n.k !== 'payroll' && section === n.k && html`<div className="subnav">${ESS_PAGES(store, n.k === 'ess-manager').map(([k, l]) => html`<button key=${k} className="subnav-i" aria-current=${essNav[n.k].k === k ? 'page' : undefined} onClick=${() => setNavFor(n.k)({ k, params: {}, n: Date.now() })}>${l}</button>`)}</div>`}
        </div>`)}
        <div className="side-foot">Attendance & Timesheet prototype<br/>Mode: ${MODE_LABEL[store.settings.mode]}</div>
      </nav>
      <div className="main">
        <header className="top"><div><h1>${titles[section][0]}</h1><div className="sub">${titles[section][1]}</div></div>
          <div className="who">${persona ? html`<${Photo} emp=${persona} cls="avatar" />` : html`<span className="avatar">A</span>`}<div><b>${persona ? persona.name : 'Acme Technologies Pvt Ltd'}</b><span>${persona ? persona.title : 'Corporate'}</span></div></div></header>
        <main className="content">
          ${section === 'payroll' && html`<${Payroll} />`}
          ${section === 'ess-employee' && html`<${Ess} key="emp" emp=${EMAP[EMPLOYEE_ID]} nav=${essNav['ess-employee']} setNav=${setNavFor('ess-employee')} />`}
          ${section === 'ess-manager' && html`<${Ess} key="mgr" emp=${EMAP[MANAGER_ID]} isManager nav=${essNav['ess-manager']} setNav=${setNavFor('ess-manager')} />`}
        </main>
      </div>
    </div>
    <${DemoControls} />
    <${DevNotes} section=${section} essPage=${section !== 'payroll' ? essNav[section].k : null} />
    ${toast && html`<div className="toast" role="status" key=${toast.id}>${toast.msg}</div>`}
  <//>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
})();

</script>
</body>
</html>
