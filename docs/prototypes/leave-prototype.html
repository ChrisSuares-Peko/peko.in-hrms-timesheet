<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peko Attendance & Timesheet prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --surface-2:#FAFAFB; --ink:#101828; --ink-2:#475467; --muted:#8A94A6;
  --line:#EAECF0; --line-2:#D0D5DD;
  --red:#E30000; --red-hover:#C40000; --red-soft:#FFF1F0; --red-ink:#B42318;
  --green:#05A357; --green-soft:#E7F8EE; --green-ink:#067647;
  --amber:#FDA700; --amber-soft:#FFF6E0; --amber-ink:#93370D;
  --blue:#2E62E8; --blue-soft:#EEF3FF; --blue-ink:#1D3F9E;
  --track:#F0F2F5; --entry:#344054; --entry-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.06);
  --overlay:rgba(16,24,40,.45);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1116; --surface:#161A21; --surface-2:#1B2029; --ink:#E7EAF0; --ink-2:#B4BCC9; --muted:#7D8696;
    --line:#262C37; --line-2:#363D4A;
    --red:#FF4545; --red-hover:#FF6161; --red-soft:#3A1717; --red-ink:#FFB4AB;
    --green:#2BC77A; --green-soft:#12301F; --green-ink:#8BE3B5;
    --amber:#FDB022; --amber-soft:#33270E; --amber-ink:#FEC84B;
    --blue:#6E95FF; --blue-soft:#172440; --blue-ink:#AFC4FF;
    --track:#1F2530; --entry:#9AA7BD; --entry-ink:#0E1116;
    --shadow:0 1px 2px rgba(0,0,0,.4);
    --overlay:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1116; --surface:#161A21; --surface-2:#1B2029; --ink:#E7EAF0; --ink-2:#B4BCC9; --muted:#7D8696;
  --line:#262C37; --line-2:#363D4A;
  --red:#FF4545; --red-hover:#FF6161; --red-soft:#3A1717; --red-ink:#FFB4AB;
  --green:#2BC77A; --green-soft:#12301F; --green-ink:#8BE3B5;
  --amber:#FDB022; --amber-soft:#33270E; --amber-ink:#FEC84B;
  --blue:#6E95FF; --blue-soft:#172440; --blue-ink:#AFC4FF;
  --track:#1F2530; --entry:#9AA7BD; --entry-ink:#0E1116;
  --shadow:0 1px 2px rgba(0,0,0,.4); --overlay:rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Roboto,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* shell */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:22px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.logo{font-weight:700;font-size:24px;letter-spacing:-.5px;padding:0 14px 22px;display:flex;align-items:center;gap:8px}
.logo-mark{width:22px;height:22px;border-radius:4px;background:var(--ink);position:relative}
.logo-mark::after{content:"";position:absolute;right:-3px;bottom:-3px;width:10px;height:10px;background:var(--red);border-radius:2px}
.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:10px 14px;border-radius:8px;color:var(--ink-2);font-weight:500}
.nav:hover{background:var(--surface-2)}
.nav[aria-current="page"]{background:var(--red-soft);color:var(--red-ink)}
.nav svg{width:18px;height:18px;flex:none}
.nav .count{margin-left:auto;background:var(--red);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px;font-weight:500}
.side-foot{margin-top:auto;padding:12px 14px;font-size:12px;color:var(--muted)}
.main{min-width:0;display:flex;flex-direction:column}
.top{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;gap:16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top h1{font-size:18px;margin:0;font-weight:500}
.top .sub{color:var(--muted);font-size:13px}
.who{margin-left:auto;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:6px 12px 6px 6px}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:500;font-size:13px;background:var(--red-soft);color:var(--red-ink);flex:none}
.who b{display:block;font-size:13px;font-weight:500}
.who span{display:block;font-size:12px;color:var(--muted)}
.content{padding:20px 28px 96px;max-width:1240px;width:100%}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;color:var(--ink-2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tab[aria-selected="true"]{color:var(--red);border-bottom-color:var(--red)}
.tab .n{background:var(--track);color:var(--ink-2);border-radius:10px;padding:0 7px;font-size:12px}
.tab[aria-selected="true"] .n{background:var(--red-soft);color:var(--red-ink)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 14px;font-weight:500;color:var(--ink-2);border-right:1px solid var(--line-2)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

/* basics */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.pad{padding:18px 20px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted)}
.small{font-size:12px}
h2{font-size:16px;font-weight:500;margin:0}
h3{font-size:14px;font-weight:500;margin:0}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:var(--red-hover)}
.btn.good{background:var(--green);border-color:var(--green);color:#fff}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2);padding:6px 8px}
.btn.ghost:hover{background:var(--track)}
.btn.link{border:0;background:none;padding:0;color:var(--blue);font-weight:500}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--track);color:var(--ink-2)}
.chip.green{background:var(--green-soft);color:var(--green-ink)}
.chip.red{background:var(--red-soft);color:var(--red-ink)}
.chip.amber{background:var(--amber-soft);color:var(--amber-ink)}
.chip.blue{background:var(--blue-soft);color:var(--blue-ink)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.banner{border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;margin-bottom:14px;border:1px solid}
.banner.red{background:var(--red-soft);border-color:transparent;color:var(--red-ink)}
.banner.amber{background:var(--amber-soft);border-color:transparent;color:var(--amber-ink)}
.banner.blue{background:var(--blue-soft);border-color:transparent;color:var(--blue-ink)}
.banner.grey{background:var(--track);border-color:transparent;color:var(--ink-2)}
.banner b{font-weight:500}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:13px;color:var(--ink-2);font-weight:500}
.input{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%}
textarea.input{min-height:76px;resize:vertical}
.err{color:var(--red-ink);font-size:12px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2)}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.scroll-x{overflow-x:auto}

/* timesheet */
.ts-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.weekbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.weekbar .range{font-size:16px;font-weight:500;min-width:170px}
.day{display:grid;grid-template-columns:118px minmax(0,1fr);gap:16px;padding:16px 18px;border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:0}
.day.off{background:var(--surface-2)}
.day.today .dname{color:var(--red)}
.dname{font-weight:500}
.dsub{font-size:12px;color:var(--muted)}
.win{font-size:12px;color:var(--ink-2);margin-bottom:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.track{position:relative;height:18px;background:var(--track);border-radius:4px;margin-bottom:6px;overflow:hidden}
.track .w{position:absolute;top:0;bottom:0;background:var(--blue-soft);border-left:2px solid var(--blue);border-right:2px solid var(--blue)}
.track .seg-in{position:absolute;top:4px;bottom:4px;background:var(--entry);border-radius:2px}
.track .seg-out{position:absolute;top:4px;bottom:4px;border-radius:2px;background:repeating-linear-gradient(135deg,var(--amber) 0 4px,#FFD27A 4px 8px)}
.ticks{position:relative;height:14px;font-size:10px;color:var(--muted);margin-bottom:8px}
.ticks span{position:absolute;transform:translateX(-50%)}
.entry{display:grid;grid-template-columns:118px 58px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-top:1px dashed var(--line)}
.entry:first-of-type{border-top:0}
.entry .t{font-variant-numeric:tabular-nums;font-weight:500}
.entry .d{color:var(--ink-2);font-variant-numeric:tabular-nums}
.entry .desc{min-width:0;overflow-wrap:anywhere}
.entry .acts{display:flex;gap:2px}
.ot{margin-top:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--amber-soft);color:var(--amber-ink);border-radius:8px;padding:8px 10px;font-size:13px}
.ot b{font-weight:500}
.editor{display:grid;grid-template-columns:110px 110px minmax(0,1fr) auto;gap:8px;align-items:start;padding:8px 0}
.editor .err{grid-column:1/-1}
.addline{margin-top:6px}
.empty-day{color:var(--muted);font-size:13px;padding:2px 0}
.lockline{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:4px}
.card{position:sticky;top:84px}
.card .big{font-size:22px;font-weight:500;letter-spacing:-.3px}
.bars{display:flex;flex-direction:column;gap:7px;margin:14px 0}
.bar{display:grid;grid-template-columns:34px 1fr 64px;gap:8px;align-items:center;font-size:12px}
.bar .b{height:6px;background:var(--track);border-radius:3px;overflow:hidden;position:relative}
.bar .b i{position:absolute;left:0;top:0;bottom:0;background:var(--ink-2);border-radius:3px}
.bar .b i.over{background:var(--amber)}
.bar .v{text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}
.divider{height:1px;background:var(--line);margin:14px 0}
.hist{list-style:none;margin:0;padding:0}
.hist li{padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;display:grid;grid-template-columns:86px 1fr;gap:10px}
.hist li:last-child{border-bottom:0}

/* diff */
.diffday{padding:12px 0;border-bottom:1px solid var(--line)}
.diffday:last-child{border-bottom:0}
.drow{display:grid;grid-template-columns:20px 120px 1fr;gap:8px;padding:6px 8px;border-radius:6px;margin-top:4px;font-size:13px}
.drow.add{background:var(--green-soft);color:var(--green-ink)}
.drow.del{background:var(--red-soft);color:var(--red-ink)}
.drow.del .x{text-decoration:line-through}
.drow.edit{background:var(--amber-soft);color:var(--amber-ink)}
.old{text-decoration:line-through;opacity:.75}

/* requests */
.req{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line)}
.req:last-child{border-bottom:0}
.req .title{font-weight:500}
.chain{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:12px}
.step{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;background:var(--track);color:var(--ink-2)}
.step.done{background:var(--green-soft);color:var(--green-ink)}
.step.pending{background:var(--blue-soft);color:var(--blue-ink)}
.step.rejected{background:var(--red-soft);color:var(--red-ink)}
.step.skipped{background:transparent;border:1px dashed var(--line-2);color:var(--muted)}
.arrow{color:var(--muted)}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-weight:500;margin-bottom:4px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.stat{padding:14px 16px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:22px;font-weight:500;margin-top:2px}
.headline{display:flex;align-items:baseline;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.headline .num{font-size:34px;font-weight:700;letter-spacing:-1px}

/* settings */
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mode{border:1px solid var(--line-2);border-radius:10px;padding:14px;text-align:left;background:var(--surface)}
.mode[aria-pressed="true"]{border-color:var(--red);box-shadow:0 0 0 1px var(--red);background:var(--red-soft)}
.mode b{display:block;font-weight:500;margin-bottom:4px}
.mode span{color:var(--ink-2);font-size:13px}
.setgrid{display:grid;gap:16px}

/* modal + toast + demo */
.overlay{position:fixed;inset:0;background:var(--overlay);display:grid;place-items:center;padding:20px;z-index:50}
.modal{background:var(--surface);border-radius:14px;width:min(560px,100%);max-height:calc(100vh - 40px);overflow:auto;box-shadow:0 20px 50px rgba(16,24,40,.25)}
.modal.wide{width:min(980px,100%)}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--surface);z-index:1}
.modal-b{padding:18px 20px}
.modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--surface)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:500;z-index:60;box-shadow:var(--shadow)}
.demo{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.demo-pop{width:300px;padding:16px}
.demo-btn{background:var(--ink);color:var(--surface);border:0;border-radius:999px;padding:10px 16px;font-weight:500;box-shadow:var(--shadow)}

@media (max-width:1020px){
  .ts-layout{grid-template-columns:1fr}
  .card{position:static;order:-1}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;padding:8px 10px;overflow-x:auto;z-index:10;border-right:0;border-bottom:1px solid var(--line);top:env(safe-area-inset-top,0px)}
  .logo{padding:0 10px 0 4px;font-size:20px}
  .side-foot{display:none}
  .nav{width:auto;white-space:nowrap}
  .top{position:static;padding:12px 16px;flex-wrap:wrap}
  .who{margin-left:0}
  .content{padding:16px 14px 96px}
  .day{grid-template-columns:1fr;gap:6px;padding:14px}
  .entry{grid-template-columns:96px 52px minmax(0,1fr);}
  .entry .acts{grid-column:1/-1;justify-content:flex-end}
  .editor{grid-template-columns:1fr 1fr}
  .editor .input.desc{grid-column:1/-1}
  .modes{grid-template-columns:1fr}
  .req{grid-template-columns:1fr}
  .demo-pop{width:min(300px,calc(100vw - 40px))}
}

/* v2 additions */
.crumb{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:13px;color:var(--muted)}
.crumb button{border:0;background:none;color:var(--blue);padding:0;font-weight:500}
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px;text-align:left;min-height:168px}
.hcard.link{cursor:pointer}
.hcard.link:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.hcard .hk{font-weight:500;font-size:15px;display:flex;align-items:center;gap:8px}
.hcard .hv{font-size:20px;font-weight:500;letter-spacing:-.3px}
.hcard .hs{color:var(--ink-2);font-size:13px}
.hcard .hf{margin-top:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hcard.feature{border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset}
.hcard.dim{opacity:.6}
.viewbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.viewbar .range{font-size:16px;font-weight:500;min-width:150px}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal-h{font-size:12px;color:var(--muted);padding:8px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface-2)}
.cal-cell{min-height:88px;padding:8px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:4px;border-top:0;border-left:0;font:inherit;color:inherit;cursor:pointer}
.cal-cell:hover{background:var(--surface-2)}
.cal-cell.out{background:var(--surface-2);color:var(--muted);cursor:default}
.cal-cell.sel{box-shadow:inset 0 0 0 2px var(--red)}
.cal-cell .dn{font-size:12px;font-weight:500}
.cal-cell.today .dn{color:var(--red)}
.cal-cell .cv{font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
.cal-cell .cs{font-size:11px;color:var(--ink-2);line-height:1.3}
.mini{display:inline-flex;align-items:center;gap:4px;font-size:11px;border-radius:999px;padding:1px 7px;font-weight:500;width:max-content;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini.present{background:var(--green-soft);color:var(--green-ink)}
.mini.late,.mini.half,.mini.ot{background:var(--amber-soft);color:var(--amber-ink)}
.mini.absent{background:var(--red-soft);color:var(--red-ink)}
.mini.leave,.mini.holiday,.mini.open{background:var(--blue-soft);color:var(--blue-ink)}
.mini.off,.mini.offwork,.mini.notin{background:var(--track);color:var(--ink-2)}
.mini.offwork{background:var(--amber-soft);color:var(--amber-ink)}

.split{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.todaybox{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.todaybox .clock{font-size:28px;font-weight:500;letter-spacing:-.5px;font-variant-numeric:tabular-nums}

.daystrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:12px}
.daystrip button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--ink-2)}
.daystrip button b{font-size:15px;font-weight:500;color:var(--ink)}
.daystrip button[aria-pressed="true"]{border-color:var(--red);background:var(--red-soft)}
.daystrip button[aria-pressed="true"] b{color:var(--red-ink)}
.daybig .track{height:26px}
.daybig .day{grid-template-columns:1fr}

/* ---- employee: update a request that was sent back, then it starts again at the manager ---- */

/* ---------------- modals: overtime & attendance fix ---------------- */
function OvertimeModal({ emp, kind: kind0, prefill, onClose }) {
  const { update, notify, store } = useApp();
  const [kind, setKind] = useState(kind0 || 'worked');
  const [date, setDate] = useState(prefill ? prefill.k : kind0 === 'planned' ? addDays(TODAY, 1) : addDays(TODAY, -1));
  const [hours, setHours] = useState(prefill ? Math.floor(prefill.mins / 60) : 1);
  const [mins, setMins] = useState(prefill ? prefill.mins % 60 : 0);
  const [note, setNote] = useState('');
  const [err, setErr] = useState('');
  const mgr = emp.mgr ? EMAP[emp.mgr] : null;
  const go = () => {
    const total = Number(hours) * 60 + Number(mins);
    if (!date) return setErr('Pick a date.');
    if (kind === 'planned' && date < TODAY) return setErr('Planned overtime needs a date from today onwards.');
    if (kind === 'worked' && date > TODAY) return setErr('For a future date, use planned overtime.');
    if (total <= 0) return setErr('Overtime must be more than zero.');
    if (kind === 'planned' && !note.trim()) return setErr('Say what the planned work is, so your manager can approve it.');
    if (isLocked(store, date)) return setErr('Payroll for that month is processed. Overtime can no longer be claimed for it.');
    update(s => createRequest(s, 'overtime', emp.id, { kind, date, minutes: total, note: note.trim() }));
    notify((kind === 'planned' ? 'Planned overtime' : 'Overtime request') + ' sent to ' + (mgr ? mgr.name : store.settings.l2.overtime + ' team'));
    onClose();
  };
  return html`<${Modal} title=${kind === 'planned' ? 'Plan overtime' : 'Request overtime'} onClose=${onClose} footer=${[html`<button key="c" className="btn" onClick=${onClose}>Cancel</button>`, html`<button key="o" className="btn primary" onClick=${go}>Send request</button>`]}>
    ${!prefill && html`<div className="field"><${Seg} label="Overtime type" value=${kind} onChange=${k => { setKind(k); setErr(''); setDate(k === 'planned' ? addDays(TODAY, 1) : addDays(TODAY, -1)); }} options=${[['worked', 'Already worked'], ['planned', 'Planned (ask in advance)']]} /></div>`}
    ${prefill && html`<div className="banner amber"><div>${otText(prefill.o, emp)}</div></div>`}
    <div className="field"><label htmlFor="otd">Date</label><input id="otd" className="input" type="date" value=${date} min=${kind === 'planned' ? TODAY : undefined} max=${kind === 'worked' ? TODAY : undefined} onInput=${e => { setDate(e.target.value); setErr(''); }} /></div>
    <div className="row" style=${{ flexWrap: 'nowrap' }}>
      <div className="field" style=${{ flex: 1 }}><label htmlFor="oth">${kind === 'planned' ? 'Expected hours' : 'Hours'}</label><input id="oth" className="input" type="number" min="0" max="16" value=${hours} onInput=${e => { setHours(e.target.value); setErr(''); }} /></div>
      <div className="field" style=${{ flex: 1 }}><label htmlFor="otm">Minutes</label><input id="otm" className="input" type="number" min="0" max="59" step="5" value=${mins} onInput=${e => { setMins(e.target.value); setErr(''); }} /></div>
    </div>
    <div className="field"><label htmlFor="otn">${kind === 'planned' ? 'What needs the extra time?' : 'Note (optional)'}</label><textarea id="otn" className="input" value=${note} onInput=${e => { setNote(e.target.value); setErr(''); }}></textarea></div>
    <div className="small muted">${approvalLine(store, emp, 'overtime')}</div>
    ${err && html`<div className="err">${err}</div>`}
  <//>`;
}
/* correction popup: pick a date, see what's recorded, then correct it.
   A missed (auto 11:59 PM) check-out that hasn't been updated yet is saved directly, with no approval. */
function AttendanceFixModal({ emp, k: k0, prefill, onClose }) {
  const { store, update, notify } = useApp();
  const [k, setK] = useState(k0 || '');
  const [tin, setIn] = useState('');
  const [tout, setOut] = useState('');
  const [dirty, setDirty] = useState(false);
  const [askSwap, setAskSwap] = useState(null);
  const [reason, setReason] = useState('');
  const [err, setErr] = useState('');
  const mgr = emp.mgr ? EMAP[emp.mgr] : null;
  const [ss, se] = shiftOf(emp);
  const rec = k ? attOf(store, emp, k) : null;
  const selfMode = false; // every change to attendance goes for approval
  const [outDays, setOutDays] = useState(0);
  const pendingFor = d => store.requests.find(r => r.type === 'attendance' && r.empId === emp.id && r.data.date === d && (r.status === 'pending_l1' || r.status === 'pending_l2'));
  const loadDay = (d, pf) => {
    const a = attOf(store, emp, d);
    setIn(pf ? pf.in : a ? a.in : '');
    setOut(pf ? pf.out : a && a.out ? a.out : '');
    setOutDays(pf && pf.outDays != null ? pf.outDays : a && a.out ? (a.outDays || 0) : 0);
    setDirty(false); setErr('');
  };
  useEffect(() => { if (k0) loadDay(k0, prefill); }, []);
  const dateProblem = d => !d ? 'Pick a date.' : d > TODAY ? 'You can’t correct a future date.' : isLocked(store, d) ? 'Payroll is processed for ' + fmtMonth(monthOf(d)) + ', so it can’t be changed.' : pendingFor(d) ? 'There’s already a correction waiting for this day.' : '';
  const pickDate = d => {
    if (dirty && k && d !== k) { setAskSwap(d); return; }
    setK(d); setAskSwap(null);
    if (!dateProblem(d)) loadDay(d); else setErr(dateProblem(d));
  };
  const recordedText = !k ? 'Pick a date to see what was recorded.' : !rec ? 'No check-in recorded' : !rec.out ? 'Check-in ' + t12(rec.in) + ' · Still checked in' : 'Check-in ' + t12(rec.in) + ' · Check-out ' + t12(rec.out) + (rec.outDays === 1 ? ' (next day)' : rec.outDays > 1 ? ' (' + rec.outDays + ' days later)' : '');
  const save = () => {
    const p = dateProblem(k); if (p) return setErr(p);
    if (selfMode) {
      if (!tout) return setErr('Enter the time you actually left.');
      if (toMin(tout) <= toMin(rec.in)) return setErr('Check-out must be after your check-in at ' + rec.in + '.');
      update(s => {
        s.attendance[emp.id + '|' + k] = { in: rec.in, out: tout, src: 'employee', at: TODAY };
        s.requests.unshift({ id: 'REQ-' + (s.seq++), type: 'attendance', self: true, empId: emp.id, created: TODAY, data: { date: k, autoFix: true, from: { in: rec.in, out: '23:59' }, to: { in: rec.in, out: tout }, reason: reason.trim() || 'Updated missed check-out' }, status: 'approved', l2: null, trail: [{ level: 0, by: emp.name, action: 'Submitted', at: TODAY }] });
      });
      notify('Check-out saved for ' + fmtDate(k));
      return onClose();
    }
    if (!tin || !tout) return setErr('Enter both times.');
    if (outDays === 0 && toMin(tout) <= toMin(tin)) return setErr('Check-out must be after check-in. If you left after midnight, choose “Next day”.');
    if (rec && tin === rec.in && tout === rec.out && outDays === (rec.outDays || 0)) return setErr('Change at least one time.');
    if (!reason.trim()) return setErr('Add a reason.');
    update(s => createRequest(s, 'attendance', emp.id, { date: k, from: { in: rec ? rec.in : '–', out: rec && rec.out ? rec.out : '', outDays: rec ? rec.outDays || 0 : 0 }, to: { in: tin, out: tout, outDays }, reason: reason.trim() }));
    notify('Sent to ' + (mgr ? mgr.name : 'HR'));
    onClose();
  };
  const title = selfMode ? 'Update check-out · ' + fmtDate(k) : 'Request attendance correction' + (k ? ' · ' + fmtDate(k) : '');
  return html`<${Modal} title=${title} onClose=${onClose} footer=${[html`<button key="c" className="btn" onClick=${onClose}>Cancel</button>`, html`<button key="o" className="btn primary" onClick=${save}>${selfMode ? 'Save check-out' : 'Send for approval'}</button>`]}>
    <div className="field"><label htmlFor="fx-d">Date</label><input id="fx-d" className="input" type="date" max=${TODAY} value=${k} onChange=${e => pickDate(e.target.value)} /></div>
    ${askSwap && html`<div className="banner amber"><div style=${{ flex: 1 }}>You’ve edited the times. Load ${fmtDate(askSwap)} instead and replace them?</div>
      <button className="btn sm" onClick=${() => { const d = askSwap; setAskSwap(null); setDirty(false); setK(d); if (!dateProblem(d)) loadDay(d); else setErr(dateProblem(d)); }}>Replace</button><button className="btn sm ghost" onClick=${() => setAskSwap(null)}>Keep editing</button></div>`}
    <div className="rec-now"><span>Recorded now</span><b>${recordedText}</b></div>
    ${selfMode ? html`<div>
        <div className="banner blue"><div>This updates your check-out right away, with no approval needed. Your manager can see you entered it. You can only do this once for a day.</div></div>
        <div className="row" style=${{ flexWrap: 'nowrap' }}>
          <div className="field" style=${{ flex: 1 }}><label>Check-in</label><input className="input" type="time" value=${rec.in} disabled /></div>
          <div className="field" style=${{ flex: 1 }}><label htmlFor="fx-o">Actual check-out</label><input id="fx-o" className="input" type="time" value=${tout} autoFocus onInput=${e => { setOut(e.target.value); setDirty(true); setErr(''); }} /></div>
        </div>
        <div className="field"><label htmlFor="fx-n">Note (optional)</label><textarea id="fx-n" className="input" value=${reason} onInput=${e => setReason(e.target.value)}></textarea></div>
      </div>` : html`<div>
        <div className="row" style=${{ flexWrap: 'nowrap' }}>
          <div className="field" style=${{ flex: 1 }}><label htmlFor="fx-i">Check-in</label><input id="fx-i" className="input" type="time" placeholder=${toTime(ss)} disabled=${!k} value=${tin} onInput=${e => { setIn(e.target.value); setDirty(true); setErr(''); }} /></div>
          <div className="field" style=${{ flex: 1 }}><label htmlFor="fx-o2">Check-out</label><input id="fx-o2" className="input" type="time" placeholder=${toTime(se)} disabled=${!k} value=${tout} onInput=${e => { setOut(e.target.value); setDirty(true); setErr(''); }} /></div>
        </div>
        <div className="field"><label>Check-out was on</label><${Seg} label="Check-out day" value=${String(outDays)} onChange=${v => { setOutDays(+v); setDirty(true); setErr(''); }} options=${[['0', 'Same day'], ['1', 'Next day']]} /></div>
        <div className="field"><label htmlFor="fx-r">Reason</label><textarea id="fx-r" className="input" maxLength="300" disabled=${!k} placeholder="e.g. Was at a client site in the morning" value=${reason} onInput=${e => { setReason(e.target.value); setErr(''); }}></textarea><span className="small muted" style=${{ textAlign: 'right' }}>${reason.length} / 300</span></div>
        <div className="small muted">Your manager reviews this first, then Payroll, before your attendance changes. To change a past break, mention it in the reason.</div>
      </div>`}
    ${err && html`<div className="err" style=${{ marginTop: '8px' }}>${err}</div>`}
  <//>`;
}

/* ---------------- Attendance tab ---------------- */
function PunchButtons({ emp, full }) {
  const { store, update, notify } = useApp();
  const a = store.attendance[emp.id + '|' + TODAY] || {};
  const nowT = toTime(Math.min(1439, nowMin()));
  const prev = openSessionBefore(store, emp, TODAY);
  const checkedIn = a.in && !a.out;
  const onBreak = checkedIn && (a.breaks || []).some(b => !b.e);
  // you can't start a new day until the previous one is checked out
  if (prev && !a.in) {
    const pr = store.attendance[emp.id + '|' + prev];
    const doPrevOut = () => { const days = daysBetween(prev, TODAY); update(s => { const r = s.attendance[emp.id + '|' + prev]; r.out = nowT; r.outDays = days; r.breaks = (r.breaks || []).map(b => b.e ? b : Object.assign({}, b, { e: b.s })); }); notify('Checked out from ' + fmtDate(prev) + ' at ' + t12(nowT) + '. If that’s not when you left, request a correction.'); };
    return html`<div className="punch-wrap"><div className="punch-warn">You’re still checked in from <b>${fmtDate(prev)}</b> (since ${t12(pr.in)}). Check out of that day before checking in today.</div>
      <div className=${'punch' + (full ? ' full' : '')}><button className="btn primary" onClick=${doPrevOut}>Check out from ${fmtDate(prev)}</button><button className="btn" disabled title="Check out from the previous day first">Check in</button></div></div>`;
  }
  const doIn = () => { if (a.in) return; update(s => { const pl = (s.prefLoc && s.prefLoc[emp.id]) || { loc: 'office' }; s.attendance[emp.id + '|' + TODAY] = { in: nowT, breaks: [], locs: [{ at: nowT, loc: pl.loc, client: pl.client || null }] }; }); notify('Checked in at ' + t12(nowT)); };

function BreaksModal({ emp, onClose }) {
  const { store, update, notify } = useApp();

  const [rows, setRows] = useState(clone(a.breaks || []));
  const [err, setErr] = useState('');

    const inM = toMin(a.in), lim = a.out ? toMin(a.out) : nowMin();
    for (const b of rows) {
      if (!b.s) return setErr('Every break needs a start time.');
      if (b.e && toMin(b.e) <= toMin(b.s)) return setErr('A break must end after it starts.');
      if (toMin(b.s) < inM || (b.e && toMin(b.e) > lim)) return setErr('Breaks must be between your check-in (' + t12(a.in) + ') and ' + (a.out ? 'check-out (' + t12(a.out) + ')' : 'now') + '.');
    }
    const sorted = rows.slice().sort((x, y) => toMin(x.s) - toMin(y.s));
    for (let i = 1; i < sorted.length; i++) if (toMin(sorted[i].s) < toMin(sorted[i - 1].e || '23:59')) return setErr('Breaks can’t overlap.');

  if (leaveOn(store, emp.id, k) || halfLeaveOn(store, emp.id, k)) return 'lv';
  const w = store.weeks[emp.id + '|' + mondayOf(k)];

/* ---- employee: my timesheet ---- */

  useEffect(() => { setShowProposed(false); }, [fws]);
  const mgr = emp.mgr ? EMAP[emp.mgr] : null;
  const entriesFor = k => {
    const wk = mondayOf(k);
    const brk = breakEntries(store, emp.id, k).concat(leaveEntries(store, emp.id, k));
    if (draft && draft.ws === wk) return (draft.entries[k] || []).concat(brk);
    const w = readWeek(store, emp.id, wk);
    if (showProposed && wk === fws && w.change) return (w.change.entries[k] || []).concat(brk);
    return (w.entries[k] || []).concat(brk);
  };
  const canEdit = k => !isLocked(store, k);  // the buck stops when payroll is processed
  const save = (k, entry) => {
    if (draft && draft.ws === mondayOf(k)) { setDraft(prev => { const d = clone(prev); const list = d.entries[k] || []; d.entries[k] = entry.id ? list.map(e => e.id === entry.id ? entry : e) : list.concat([Object.assign({}, entry, { id: 'n' + Date.now() })]); return d; }); return; }
    update(s => {

  };
  const del = (k, id) => {

    update(s => { const w = markEdited(s, emp.id, mondayOf(k), emp.name, k); w.entries[k] = (w.entries[k] || []).filter(e => e.id !== id); });
  };
  const p = periodOf(store, emp, view, cursor, entriesFor);
  const step = n => { setSel(null); setCursor(view === 'day' ? addDays(cursor, n) : view === 'week' ? addDays(cursor, 7 * n) : firstOf(addMonths(monthOf(cursor), n))); };

  const totLogged = p.days.reduce((t, k) => t + sumMins(entriesFor(k)), 0);
  const totExp = p.days.reduce((t, k) => t + expectedFor(store, emp, k), 0);
  const wks = p.days.map(k => workedFor(store, emp, k));
  const totWorked = wks.reduce((t, w) => t + (w.mins || 0), 0);
  const unknownDays = wks.filter(w => w.kind === 'unknown').length;
  const ofWord = store.settings.mode === 'timesheet' ? 'shift' : 'worked';
  const onOT = (k, o) => setOtModal({ k, o, mins: o.extra });
  const onFix = store.settings.mode === 'both' ? (k, pr) => setFix({ k, prefill: pr }) : null;

  const allLocked = weekDays(fws).every(k => isLocked(store, k));
  const editingThis = draft && draft.ws === fws;

  let statusLine, actions = null;
  const lastSub = fweek.history.slice().reverse().find(h => /submit/i.test(h.text));

  const mgrName = mgr ? mgr.name : 'HR';

  if (appr) Object.keys(store.weeks).filter(x => x.startsWith(emp.id + '|')).sort().forEach(x => { const ws = x.split('|')[1]; const w = store.weeks[x]; if (ws === fws) return;
    if (w.status === 'rejected') notices.push({ id: 'sb' + ws, tone: 'back', title: 'Week of ' + fmtShort(ws) + ' sent back', text: w.comment, btn: 'Go to day', go: () => openWeek(ws) });
    else if (w.change) notices.push({ id: 'ch' + ws, tone: 'info', title: 'Change waiting · week of ' + fmtShort(ws), text: 'With ' + (mgr ? mgr.name : 'HR') + '. ' + w.change.reason, btn: 'Go to day', go: () => openWeek(ws) }); });
  { const pd = store.settings.mode === 'both' ? openSessionBefore(store, emp, TODAY) : null; if (pd && onGoTab) notices.push({ id: 'open' + pd, tone: 'info', title: 'Still checked in from ' + fmtDate(pd), text: 'Check out of that day before you check in today, then request a correction if needed.', btn: 'Go to attendance', go: () => onGoTab('attendance') }); }
  { let n = 0, m = 0; for (let i = 1; i <= 35; i++) { const d = addDays(TODAY, -i); if (isLocked(store, d)) continue; const o = otSuggestion(store, emp, d); if (o && !otRequestFor(store, emp.id, d)) { n++; m += o.extra; } }
    if (n && onGoTab) notices.push({ id: 'ot', tone: 'amber', title: dur(m) + ' of overtime not claimed', text: n + ' day' + (n === 1 ? '' : 's') + ' beyond your standard hours.', btn: 'Review overtime', go: () => onGoTab('overtime') }); }
  return html`<div>

      <div className="ts-notices">

            ${notices.map(x => html`<div key=${x.id} className=${'ov-note act ' + x.tone}><div><b>${x.title}</b><div className="small">${x.text}</div></div><button className="btn sm" onClick=${x.go}>${x.btn}</button></div>`)}
            <div className="ov-grp">Unlogged hours</div>
            <${UnloggedList} emp=${emp} days=${p.days} entriesFor=${entriesFor} view=${view} onPick=${k => { if (view === 'day') setCursor(k); else setSel(k); }} />
            ${appr && fweek.history.length > 0 && html`<div><div className="ov-grp">History</div><${HistoryInline} key=${fws} week=${fweek} /></div>`}

    <div className="viewbar" style=${{ marginTop: '18px' }}>
      <${Seg} label="View" value=${view} onChange=${changeView} options=${[['day', 'Day'], ['week', 'Week'], ['month', 'Month']]} />

      <span className="spacer"></span>
      <span className="small" style=${{ color: 'var(--ink-2)' }}>Logged <b style=${{ fontWeight: 500 }}>${dur(totLogged)}</b> of ${dur(totWorked)} ${ofWord}${unknownDays ? ' (' + unknownDays + ' day' + (unknownDays === 1 ? '' : 's') + ' not known)' : ''}</span>

      onSubmit=${reason => { update(s => { const w = writeWeek(s, emp.id, draft.ws);

        setDraft(null); setAskReason(false); notify('Change sent to ' + (mgr ? mgr.name : 'HR')); }} />`}
    ${otModal && html`<${OvertimeModal} emp=${emp} prefill=${otModal} onClose=${() => setOtModal(null)} />`}

function weekStatusText(store, emp, w) {
  const mgr = emp.mgr ? EMAP[emp.mgr] : null;
  if (!approvalOn(store)) return 'Approval is off for timesheets.';
  if (w.change) return 'Asked to change this approved week: ' + w.change.reason;
  if (w.status === 'submitted') { const sub = w.history.slice().reverse().find(h => /submit/i.test(h.text)); return 'Submitted' + (sub ? ' on ' + fmtShort(sub.at) : '') + '. Waiting for ' + (mgr ? mgr.name : 'approval') + '.'; }
  if (w.status === 'approved') return 'Approved.';
  if (w.status === 'rejected') return 'Sent back: ' + w.comment;
  return 'Not submitted yet.';
}

function WeekReview({ item, mgr, onClose, level }) {
  const { store, update, notify } = useApp();
  const emp = EMAP[item.id];
  const w = readWeek(store, item.id, item.ws);
  const lvl = item.level || level || 1;
  const isChange = !!w.baseline;
  const [tab, setTab] = useState(isChange ? 'changes' : 'sheet');
  const [rejecting, setRejecting] = useState(false);
  if (w.status !== (lvl === 2 ? 'with_payroll' : 'submitted')) return null;
  const shown = w.entries;
  const diffs = isChange ? diffEntries(w.baseline, w.entries) : [];
  const lockedChange = isChange && diffs.some(d => isLocked(store, d.day));
  const approve = () => {
    const toPayroll = lvl === 1 && store.settings.l2.timesheet !== 'None';
    update(s => { const x = writeWeek(s, item.id, item.ws);
      if (toPayroll) { x.status = 'with_payroll'; hist(x, TODAY, mgr.name, 'Approved, sent to Payroll'); }
      else { x.status = 'approved'; x.approved = clone(x.entries); delete x.baseline; hist(x, TODAY, mgr.name, 'Approved'); } });
    notify('Timesheet approved for ' + emp.name + (toPayroll ? ', sent to Payroll' : '')); onClose();
  };
  const reject = c => {
    update(s => { const x = writeWeek(s, item.id, item.ws);
      x.status = 'rejected'; x.comment = c; hist(x, TODAY, mgr.name, 'Sent back: ' + c); });
    notify('Timesheet sent back to ' + emp.name); setRejecting(false); onClose();
  };
  const weekTotal = Object.values(shown).reduce((t, l) => t + sumMins(l), 0);
  const cell = r => html`<span>${timed(r) ? r.start + ' – ' + r.end : 'No set time'}<span className="muted"> · ${dur(entryMins(r))}</span></span>`;
  return html`<${Modal} wide title=${emp.name + ', week of ' + weekRange(item.ws)} onClose=${onClose} footer=${[
      html`<span key="n" className="muted small" style=${{ marginRight: 'auto' }}>${lvl === 1 && store.settings.l2.timesheet !== 'None' ? 'After you approve, it goes to Payroll.' : 'This approval is final.'}</span>`,
      html`<button key="r" className="btn" onClick=${() => setRejecting(true)}>Ask for update</button>`,
      html`<button key="a" className="btn good" disabled=${lockedChange} onClick=${approve}>Approve timesheet</button>`]}>
    <div className="row" style=${{ marginBottom: '14px' }}>
      ${isChange ? html`<${Seg} label="Review" value=${tab} onChange=${setTab} options=${[['changes', 'What changed'], ['sheet', 'Full timesheet']]} />` : null}
      <span className="spacer"></span><span className="muted small">${dur(weekTotal)} logged this week${isChange ? ' after the change' : ''}</span></div>
    ${isChange && html`<div className="banner blue"><div><b>Edited after it was approved.</b> “What changed” compares it with the last approved version.</div></div>`}
    ${lockedChange && html`<div className="banner grey">${Icon.lock}<div>Payroll is already processed for part of this change, so it can't be approved. Reject it and ask ${first(emp.name)} to raise it for next month.</div></div>`}
    ${tab === 'changes' && html`<div>${diffs.map(d => html`<div key=${d.day} className="diffday">
        <div className="row"><b style=${{ fontWeight: 500 }}>${fmtDate(d.day)}</b><span className="muted small">${dur(d.before)} → ${dur(d.after)}</span></div>
        ${d.rows.map((r, i) => r.kind === 'add' ? html`<div key=${i} className="drow add"><span>+</span>${cell(r.after)}<span>${r.after.desc}</span></div>`
          : r.kind === 'del' ? html`<div key=${i} className="drow del"><span>−</span><span className="x">${cell(r.before)}</span><span className="x">${r.before.desc}</span></div>`
          : html`<div key=${i} className="drow edit"><span>~</span>
              <span>${entTime(r.before) !== entTime(r.after) || entryMins(r.before) !== entryMins(r.after) ? kids(html`<span className="old">${cell(r.before)}</span><br/>${cell(r.after)}`) : cell(r.after)}</span>
              <span>${r.before.desc !== r.after.desc ? kids(html`<span className="old">${r.before.desc}</span><br/>${r.after.desc}`) : r.after.desc}</span></div>`)}
      </div>`)}</div>`}
    ${tab === 'sheet' && html`<${TimesheetBrowser} emp=${emp} start=${item.ws} startView="week" override=${{ ws: item.ws, entries: shown }}
      statusFor=${ws => { const x = readWeek(store, emp.id, ws); return html`<section className="panel pad" aria-label="Week status"><div className="row"><h3>Week of ${fmtShort(ws)}</h3><span className="spacer"></span><${WeekChip} w=${x} /></div>
        <div className="small" style=${{ marginTop: '8px', color: 'var(--ink-2)' }}>${ws === item.ws ? (isChange ? 'Showing the week with the proposed change. Approve or reject below.' : 'This is the week you’re reviewing. Approve or send back below.') : weekStatusText(store, emp, x)}</div></section>`; }} />`}
    ${rejecting && html`<${CommentModal} title=${isChange ? 'Reject change' : 'Send timesheet back'} label=${'What should ' + first(emp.name) + ' fix?'} confirm=${isChange ? 'Reject change' : 'Send back'} danger required onClose=${() => setRejecting(false)} onSubmit=${reject} />`}
  <//>`;
}

  const clash = r => { const also = store.requests.filter(x => x.type === 'leave' && x.id !== r.id && x.status === 'approved' && EMAP[x.empId].dept === EMAP[r.empId].dept && x.data.from <= r.data.to && x.data.to >= r.data.from).map(x => first(EMAP[x.empId].name)); return also.length ? html`<span className="chip amber">Also off in ${EMAP[r.empId].dept}: ${Array.from(new Set(also)).join(', ')}</span>` : html`<span className="chip green">No one else off in ${EMAP[r.empId].dept}</span>`; };
  return html`<div>
    ${type === 'leave' ? html`<div className="row" style=${{ marginBottom: '-44px', justifyContent: 'flex-end', position: 'relative', zIndex: 1 }}><button className="btn primary" onClick=${() => setAdd(true)}>Add leave</button></div>` : null}
    ${add && html`<${HrAddLeave} onClose=${() => setAdd(false)} />`}
    <${AdminSub} value=${sub} onChange=${setSub} tabs=${type === 'attendance' ? [['requests', 'Requests (' + waiting + ')']] : (type === 'leave' ? [['overview', 'Overview'], ['leaves', 'Leaves'], ['requests', 'Requests (' + waiting + ')'], ['details', 'Balances']] : [['overview', 'Overview'], ['requests', 'Requests (' + waiting + ')'], ['details', 'Details']])} />
    ${sub === 'overview' && type === 'leave' && html`<div>
      ${(() => { const lv = store.requests.filter(r => r.type === 'leave' && r.status !== 'withdrawn'); const wk0 = mondayOf(TODAY), wk1 = addDays(wk0, 6); const m = monthOf(TODAY);
        const weekOff = new Set(lv.filter(r => r.status === 'approved' && r.data.from <= wk1 && r.data.to >= wk0).map(r => r.empId)).size;
        const takenM = lv.filter(r => r.status === 'approved' && monthOf(r.data.from) === m).reduce((t, r) => t + r.data.days, 0);
        const prob = EMP.filter(e => onProbation(store, e.id)).length;
        return html`<div className="stats" style=${{ gridTemplateColumns: 'repeat(5,minmax(0,1fr))' }}>
          <div className="panel stat"><div className="k">Off today</div><div className="v">${offToday.length}</div><div className="k">of ${EMP.length} employees</div></div>
          <div className="panel stat"><div className="k">Off this week</div><div className="v">${weekOff}</div><div className="k">people</div></div>
          <div className="panel stat"><div className="k">Waiting for you</div><div className="v">${waiting}</div><div className="k">requests</div></div>
          <div className="panel stat"><div className="k">Leave taken in ${fmtMonth(m).split(' ')[0]}</div><div className="v">${fd(takenM)}</div><div className="k">days, approved</div></div>
          <div className="panel stat"><div className="k">On probation</div><div className="v">${prob}</div><div className="k">employees</div></div></div>`; })()}
      <div className="panel pad" style=${{ marginBottom: '14px' }}><h3 style=${{ marginBottom: '6px' }}>Off today</h3>${offToday.length ? html`<div className="row" style=${{ gap: '6px' }}>${offToday.map(r => html`<span key=${r.id} className="chip">${EMAP[r.empId].name} \u00b7 ${r.data.leaveType}${r.data.half ? ' \u00bd' : ''}</span>`)}</div>` : html`<span className="small muted">Everyone is in today.</span>`}</div>
      <${TeamLeaveCal} mgr=${{ id: '__all', name: 'HR team' }} people=${EMP} level=${2} /></div>`}
    ${sub === 'overview' && type !== 'leave' && type !== 'attendance' && html`<${AdminTypeStats} type=${type} />`}
    ${sub === 'details' && type === 'leave' && html`<${AdminLeaveDetails} />`}
    ${sub === 'details' && type !== 'leave' && html`<${AdminTypeDetails} type=${type} />`}
    ${(sub === 'requests' || type === 'attendance') && html`<${AdminReqs} type=${type} extra=${type === 'leave' ? clash : null} hideApproved=${type === 'leave'} />`}
    ${sub === 'leaves' && type === 'leave' && html`<${AdminLeaves} />`}
  </div>`;
}
function AdminEmployees() {
  const { store } = useApp();

function Payroll() {
  const { store } = useApp();
  const [tab, setTab] = useState('timesheet');
  const mode = store.settings.mode;
  const w = t => store.requests.filter(r => (r.type === t || (t === 'leave' && (r.type === 'leavecancel' || r.type === 'compoff'))) && teamWaiting(r) && reqVisible(store, r)).length;
  const TABS = [
    (mode === 'timesheet' || mode === 'both') && { k: 'timesheet', label: 'Timesheet', n: payrollTimesheetItems(store).length },
    (mode === 'attendance' || mode === 'both') && { k: 'attendance', label: 'Attendance', n: w('attendance') },
    { k: 'leave', label: 'Leave', n: w('leave') },
    { k: 'overtime', label: 'Overtime', n: w('overtime') },
    { k: 'reimbursement', label: 'Reimbursements', n: w('reimbursement') },
    { k: 'employees', label: 'Employees', n: w('profile') },
    { k: 'settings', label: 'Payroll settings' },
  ].filter(Boolean);
  const cur = TABS.find(t => t.k === tab) ? tab : TABS[0].k;
  CUR.payTab = cur;
  return html`<div><${Tabs} tabs=${TABS} value=${cur} onChange=${setTab} />
    ${cur === 'timesheet' && html`<${AdminTimesheet} />`}
    ${['attendance', 'leave', 'overtime', 'reimbursement'].includes(cur) && html`<${AdminService} key=${cur} type=${cur} />`}
    ${cur === 'employees' && html`<${AdminEmployees} />`}
    ${cur === 'settings' && html`<${PayrollSettings} />`}
  </div>`;
}
function PayrollOld() {
  const { store } = useApp();

  const cur = TABS.find(t => t.k === tab) ? tab : TABS[0].k;
  return html`<div><${Tabs} tabs=${TABS} value=${cur} onChange=${setTab} />
    ${cur === 'approvals' && html`<${PayrollApprovals} />`}${cur === 'summary' && html`<${TimesheetSummary} />`}${cur === 'settings' && html`<${Settings} />`}${cur === 'employees' && html`<${Employees} />`}</div>`;

const DEV_NOTES = {"shared": {"title": "Shared platform (every module)", "sections": [["How to read the prototype", ["All business rules are plain functions in the prototype file (attOf, workedMins, dayStatus, expectedFor, otSuggestion, leaveYear, leaveBalances, leaveDayCount, l1For / l2For, personQueue, submitWeek, decideRequest, applyEffects). Port them as tested rules (src/prototype/rules or the backend). Screens should call the rules, never re-derive them.", "Demo personas: ESS - Employee = Rohan Mehta (ACME-002), ESS - Manager = Priya Nair. 21 employees, ACME-001 to ACME-021; ACME-021 (CEO) has no manager. Demo data is rebuilt each week and stored in localStorage.", "Times are shown in 12-hour format everywhere (9:30 AM). Inputs stay as time pickers. Dates as \"Tue 13 Oct\".", "The \"Demo controls\" and \"Developer notes\" buttons are prototype-only. Do not ship them."]], ["Tracking modes", ["Company setting: attendance only / timesheet only / attendance + timesheet / neither.", "Use two helpers everywhere: attOn = attendance or both; tsOn = timesheet or both. Never write \"not timesheet means attendance\", because \"neither\" breaks it.", "Neither: no attendance or timesheet UI at all (cards, recent days table, tabs, calendars). Leave, overtime and reimbursements still work."]], ["Approval engine (all request types)", ["Per function (attendance corrections, timesheets, overtime, leave, reimbursements) HR sets Level 1 and Level 2. Level 1: Reporting manager (default) / a team (Payroll, HR, Admin, Finance) / a specific person. Level 2: a team / a specific person / None (level 1 is final).", "Resolve the approvers when the item is submitted (and Level 2 again when Level 1 approves) and store them on the item. Changing settings later must not move items already in flight.", "No manager (CEO) or \"Reporting manager\" pointing at themselves: Level 1 is skipped.", "Actions at either level: Approve, Ask for update (comment required, goes straight back to the employee, status update_requested; resubmitting starts again at Level 1), Reject (requests only). Level 2 approval is final and runs the effects (attendance updated, leave applied, deduction reversed, etc).", "Queues: items waiting on a person appear in that person’s My team → Approvals. Items waiting on a team appear in Payroll → {service} → Requests. Payroll can see items sitting with people (read-only) and send a Remind notification.", "Leave cancellation and comp off requests use the leave approvers. Profile updates go straight to HR (no manager).", "Request statuses: pending_l1, pending_l2, update_requested, approved, rejected, withdrawn, cancelled (approved leave that was cancelled)."]], ["Payroll month", ["There is no month lock. Processing payroll only records the month as paid. Anything changed afterwards (leave, timesheets, attendance) is picked up by the next payroll. Loss of pay and retro adjustments are owned by the payroll team.", "Payroll for a month can only be processed when every timesheet period in it is Approved (when timesheet approval is on)."]], ["Employee working days", ["The prototype uses company-wide weekly offs. The real build must use each employee’s own working days and shift (the per-employee schedule already in the latest code) for: late marks, hours targets, leave day counts, half days, the sandwich rule, calendars and comp off eligibility."]]]}, "ess-shell": {"title": "ESS shell: Overview & navigation", "sections": [["ESS Overview · Cards", ["Profile: edits go to HR for approval (no manager step). Only one pending update at a time; the edited fields are locked while it’s pending.", "Attendance today: Check in · Start/End break · Check out. Status line, breaks today with Edit breaks, the late-deduction note after a late check-in, and the \"Working from\" switch only in attendance-only mode.", "If an earlier day is still open (no check-out, search back 60 days), Check in is disabled and \"Check out from {date}\" closes it with today’s time and outDays = days between. The server must refuse a check-in while an earlier session is open.", "Today’s timesheet: the same entry form as the Timesheet tab (labelled fields, location, project when on), the day bar, and Submit with the unlogged-hours check. Note: \"Every change saves automatically…\".", "Quick actions: one row. Managers / approvers also get My team (with a count badge).", "Recent days: last 10 working days with check in/out (next-day chip), hours worked, hours logged, overtime state."]], ["ESS Overview · Notifications → Needs your action (order)", ["Update requested on any of my requests (with the approver’s comment).", "Still checked in from an earlier day.", "Late check-in deductions from the last 7 days, not yet disputed (max 3), with Request correction.", "Sent-back timesheet, unclaimed overtime, and for approvers \"{N} waiting for your approval\"."]]]}, "attendance": {"title": "Attendance module", "sections": [["ESS · Attendance rules", ["One check-in and one check-out per day. No automatic check-out: a session stays open until the employee checks out, even across days.", "Overnight work counts to the check-in day: store outDays (0 = same day, 1 = next day…). Hours worked = check-out + outDays × 24h − check-in, breaks included.", "Breaks: multiple per day, { start, end, description }. Start/End only while checked in; checking out ends a running break. Today’s breaks can be edited directly (no overlaps, inside the session); past breaks only via a correction.", "Late mark: check-in after shift start + grace. With first-half leave, the shift start moves to mid-shift. No exceptions for working late the night before.", "Location (attendance-only mode): optional day-level timeline [{ at, location, client }], changeable any time; first entry from the pre-check-in choice."]], ["ESS · Attendance tab layout", ["Header: one \"Request correction\" button. Grid: Today | Month totals (3×3) | My correction requests (spans both rows, same height as the left side, scrolls inside). Calendar spans the first two columns.", "Totals: Present, Late, Half day, Absent, On leave, Holidays, Worked off-days, Break time, and \"Xh worked, Yh overtime\".", "Correction popup: date picker, \"Recorded now\", check-in, check-out, same day / next day, reason. Refuses future dates and days with a pending correction. Asks before replacing edited times when the date changes."]], ["Payroll · Scope", ["Keep the existing Attendance page. Add a Requests section for attendance corrections waiting on Payroll, using the shared admin requests list."]], ["Settings · Attendance", ["Tracking mode (attendance only / timesheet only / both / neither), working day rules (grace period, half-day threshold, break), and the Level 1 / Level 2 approvers for attendance corrections, all in Payroll settings → Attendance, timesheet & overtime."]], ["Link to Leave", ["Late check-ins deduct leave (see the Leave module: late check-in deduction). The Attendance tab shows the Notes panel for those deductions and the dispute (correction) flow."]]]}, "timesheet": {"title": "Timesheet module", "sections": [["ESS · Timesheet entries", ["Entry: { id, date, start|null, end|null, startNext, endNext, mins, description, project|null, location, client|null }. Hours-only entries allowed (parse 1:30, 1.5, 1h 30m).", "An end earlier than the start means the next morning (\"Ends next day\"). On an overnight day, a start before check-in means after midnight.", "Overlaps are blocked, including against breaks and leave/holiday rows.", "Location per entry (attendance + timesheet and timesheet-only): Office / Home / Client site (+ client name, required). Defaults to the last used.", "Project codes when HR turns them on: required on every entry."]], ["ESS · Rows the system adds (read-only, not stored as entries)", ["Breaks (description editable), approved leave (full shift, or the half for half days), weekday public holidays (skipped if the employee checked in that day).", "They count towards logged hours, never count as overtime, and never make a period \"Saved\" or need submitting."]], ["ESS · Targets and saving", ["Day target = hours worked (full check-in to check-out). Timesheet-only = shift length. Leave or public holiday (no check-in) = shift length. Half-day leave = worked + half shift.", "Every change saves immediately; changed dates are tracked (dirty set) and shown as \"Saved\" until submitted.", "Submit (view bar) sends every period overlapping the current Day/Week/Month view that is Draft or Update requested. If only edits of already-sent periods are included: \"Only your changes will be resubmitted\" + the changed dates. Day view notes that the whole filing period goes.", "Auto-submit at the HR-set day and time sends Draft periods with entries (and their attendance). Anything already sent is left alone.", "Editing a period after it was sent (even approved) moves it back to Draft with a baseline; reviewers see \"What changed\".", "Period statuses: draft → submitted (with Level 1) → with_payroll (with Level 2) → approved; rejected = Update requested."]], ["ESS · Timesheet screen", ["Calendar 65% / Notices 35% (same height, scrolls inside). Legend: Saved · Submitted · Update requested · Leave · Public holiday · Selected (red outline on the days in view).", "Notices: the focused week’s status, \"Needs your action\" across all weeks with Go to day, Unlogged hours, History. No Submit in Notices.", "Single bar per day (no second meter). The axis stretches past midnight on overnight days.", "Download timesheet: date range presets + custom, downloads .xlsx (template columns + Status), Copy rows as a fallback.", "Upload timesheet: .xlsx/.xls/.csv; Download template inside the popup; matches columns by name (synonyms), validates each row (date, times, hours, location, project, description, overlaps), imports only the ready rows as Saved. A downloaded file must upload back cleanly."]], ["Payroll · Sub-tabs", ["Overview: payroll readiness banner (blocked by N employees / ready / processed), counts of periods (Not submitted, With managers, Waiting for you, Update requested, Approved), department table (people, hours logged, hours worked, statuses).", "Details: every employee’s timesheets in the same Week/Month browser the manager uses, department filter. Read-only unless the period is waiting for Payroll.", "Requests: periods waiting for Level 2 (or a team at Level 1). Review opens the shared review screen at that level; \"This approval is final.\"", "The old Level 2 approvals and Timesheet status pages are retired; redirect their routes here."]], ["Settings · Timesheet", ["Timesheet approval on/off, auto-submit day and time, project codes (on/off + list), and the Level 1 / Level 2 approvers for timesheets, in Payroll settings → Attendance, timesheet & overtime."]]]}, "overtime": {"title": "Overtime module", "sections": [["ESS · Overtime", ["Suggestion = hours worked − shift length, at least the HR minimum. Weekends and public holidays count in full. Leave/holiday rows never count.", "No suggestion while the day is still open, while a correction for it is pending, or if the day was claimed as comp off.", "Overtime only exists once the employee claims it (planned overtime allowed)."]], ["Payroll · Sub-tabs", ["Overview (month): Requested, With managers, Waiting for you, Approved (hours + count), department table.", "Details (month): per employee requests, approved and pending hours; click for their requests.", "Requests: shared admin list."]], ["Settings · Overtime", ["\"Suggest overtime from N min extra\" and the Level 1 / Level 2 approvers for overtime, in Payroll settings → Attendance, timesheet & overtime.", "A day can be claimed as overtime or comp off, not both."]]]}, "leave": {"title": "Leave module", "sections": [["ESS · Layout", ["Sub-tabs: Overview · My requests (count of open) · Public holidays. \"Apply for leave\" is pinned top right; \"Request comp off\" next to it when comp off is on.", "Overview: one card per leave type that applies to the employee (gender), then Upcoming leave and Next public holiday.", "Clicking a card opens that type’s page: Available / Approved / In request cards, every request of that type (start, end, day type, days, reason, applied on, status), filters (status with counts, date range), and \"Credits and deductions this year\"."]], ["ESS · Balance (what \"available\" means)", ["Available = credited so far − approved leave − late deductions − leave still in request (pending or update requested). Example: 10 credited, 4 taken, 2 requested = 4 available.", "Show it as soon as a leave type is picked in the form, plus \"{n} days waiting for approval are already taken off\".", "Loss of pay only happens when a balance runs out (late deductions, or an approver approving anyway)."]], ["ESS · Applying", ["Leave types listed = active types that apply to the employee’s gender.", "Full days or Half days. Half days can cover a range: first or second half of every working day in it, one request (0.5 per working day).", "Duration counts the employee’s working days. With the sandwich rule on, days off strictly between two leave days in the same request count too (never at the edges, never for half days).", "Supporting document field appears only when the type’s rule needs it for that duration (\"longer than N days\", or always).", "Blocked: dates already covered by leave (approved, pending or update requested), not enough available balance, types set to \"Not available\" during probation."]], ["ESS · After applying", ["Pending: Withdraw. Update requested: Update and resubmit (starts again at Level 1).", "Approved and not finished: Cancel leave → a leave cancellation request (reason, same approvers). If the leave has started, only the days from today are cancelled. The leave stays booked until the cancellation is approved; then the days go back to the balance.", "Approved leave updates attendance (status, late mark at mid-shift for first-half leave, \"Absent (other half)\") and fills the timesheet automatically."]], ["ESS · Comp off", ["Only for a weekly off or public holiday the employee actually worked (attendance, or timesheet in timesheet-only mode). Half a shift or more = 0.5 day, a full shift = 1 day.", "Refused: working days, days not worked, days already claimed, days older than the expiry window, days claimed as overtime.", "Approved comp off becomes a \"Comp off\" balance usable in Apply for leave. Unused comp off expires N days after the day worked (oldest used first)."]], ["ESS Attendance · Late check-in deduction", ["Each late mark deducts settings.lateDays (default 0.5, 0 = off) immediately, from the order set in Leave settings (default Annual, then Casual, then loss of pay).", "It stays deducted while a dispute (correction) is pending. When the correction is approved and the day is no longer late, it’s reversed automatically and shown as \"+0.5 reversed\".", "Attendance tab Notes panel (latest 5): no dispute yet → Raise dispute; pending → waiting for {approver}; rejected → shows who and their comment, with Dispute again."]], ["My team · Leave", ["Leave requests in Approvals show \"{type}: X available now · Y after this\" (red when short). Approving when short opens \"Not enough leave\" (loss-of-pay amount, Approve anyway / Ask for update).", "Leave calendar: approved solid, pending dashed, ½ for half days; \"Leave to approve\" side panel with an \"Also off\" clash chip."]], ["Payroll · Sub-tabs", ["Overview: Off today, Off this week, Waiting for you, Leave taken this month, On probation; Off today strip; company leave calendar with the Level 2 \"Leave to approve\" panel.", "Leaves: approved leave as a table (name + email, type, from, to, duration, reason, applied on, added by, status Upcoming / On leave now / Taken). Filters: when, leave type, date range, search by name/email/type. Cancel (HR, reason, applies immediately, only the days from today if it has started).", "Requests: shared admin list. Views depend on the approval setup: \"Waiting for you\" only if a team is an approver at some level; \"With managers/approvers\" only if a person is; Update requested, Rejected, All always. A view stays while older items still sit in it. No \"Approved\" view here (that’s Leaves). Clash chip per request: approved leave in the same department overlapping.", "Balances: every employee, Status (Probation with \"Mark active\" → status Active, confirmedOn = today), and per type \"available / allocated\" (allocated = this year’s entitlement + carry forward; available excludes leave in request). Types that don’t apply to the employee show \"—\". Click a row for their cards and credits."]], ["Payroll · Add leave (HR)", ["Drawer: employee, start date, end date, duration worked out, full days or half days (first/second half of each day), leave type with available balance, note, optional attachment.", "Same checks as the employee form (overlap, balance, probation). Approved immediately, marked \"Added by HR\"; attendance and timesheet update straight away."]], ["Settings · Leave → Leave types", ["Table: leave type, days per year, credited, accrual rate, carry forward (\"Yes, up to N days\" / \"No\"), applies to, status, actions View / Edit / Deactivate or Remove. Search by name.", "All leave types are paid; there is no unpaid type. Loss of pay only when a balance runs out.", "Drawer fields (each with help text): name, days per year, credited (start of leave cycle / monthly / daily), during probation (credited monthly / full entitlement / not available), carry forward up to N days, encash on exit, supporting document when longer than N days (empty = never, 0 = always), applies to (all / female / male).", "A type that has been used can’t be removed or renamed, only deactivated (hidden from forms, history kept).", "Editing days, credit method, probation rule, carry forward or applies-to asks for confirmation with the number of employees affected."]], ["Settings · Leave → Public holidays", ["Dated list per year (add date + name, remove). Drives calendars, timesheet prefill, leave day counts and comp off eligibility. A holiday on a weekly off gives no extra day."]], ["Settings · Leave → Configuration", ["Leave year (company cycle start date, or joining date) + the automatic roll-forward note.", "Probation: no length setting; explains status-based probation.", "Half-day leave on/off. Sandwich rule: off / weekly offs count / weekly offs and holidays count.", "Comp off on/off + expiry days (0 = never).", "Late check-in deduction: days per late mark (0 = off) and the deduct-from order."]], ["Settings · Leave → Approvals", ["Level 1 / Level 2 dropdowns for leave. Leave cancellations and comp off requests use the same approvers."]], ["Leave engine (for the backend)", ["Leave year: company cycle (HR start date) or each employee’s joining date.", "Credits: at the start of the cycle (full year), monthly (quota/12 on the 1st, no rounding), or daily (quota × days elapsed / days in the cycle).", "Joining or leaving mid-year: a month counts if they join on or before the 15th, or leave on or after the 15th.", "Probation is a status, not a length: while status = Probation each type follows its probation rule (credited monthly / full entitlement / not available). When HR marks the employee Active (confirmedOn), the normal rule applies from that date; upfront types credit the rest of the year then.", "Carry forward at the start of a cycle = min(last year’s unused, the type’s limit); the rest lapses. This runs automatically on the last working day of the cycle.", "Exit: entitlement pro-rated to the last day; unused days of encashable types are encashed, extra days taken are recovered in the final settlement."]]]}, "reimbursement": {"title": "Reimbursements module", "sections": [["ESS · Claim form", ["Categories come from Payroll settings → Reimbursements. Under the amount: \"Limit ₹X a month · ₹Y left for {month}\" or \"No monthly limit\", plus the claim window.", "Monthly limit counts approved + pending + update-requested claims in the same category and month.", "Receipt upload required when the category says so. Claims older than the claim window are refused.", "Routing follows the reimbursement approvers (default manager → Admin). Update requested → Update and resubmit."]], ["Payroll · Sub-tabs", ["Overview (month): totals in ₹, department table, by category.", "Details (month): per employee totals; click for their claims.", "Requests: shared admin list (default Level 2 = Admin).", "Fold the existing Employee reimbursement page into this tab."]], ["Settings · Reimbursements", ["Categories (monthly limit per employee, receipt required), claim window in days, Level 1 / Level 2 approvers. Default Level 2 = Admin."]]]}, "people": {"title": "Profile & employees module", "sections": [["ESS · Rules", ["Edits go to HR for approval (no manager step). One pending update at a time; edited fields are locked while pending.", "Grade is still a placeholder (\"L4\" style) until Peko’s real format is confirmed."]], ["Payroll · Scope", ["Existing employee list, plus a \"Profile updates\" sub-tab (HR approvals for ESS profile edits).", "Employee status Probation / Active drives leave probation rules (see Leave)."]]]}, "myteam": {"title": "My team (approver surface)", "sections": [["Who sees it", ["Anyone with direct reports, or anyone named as a Level 1 / Level 2 approver for any function, or with items waiting on them. Same ESS as everyone else, plus this page.", "If the manager is on leave, items simply wait (no delegation in this version)."]], ["Tabs", ["Approvals: one inbox for everything waiting on this person (timesheets + requests, Level 1 or Level 2). Type filters with counts, Select all + \"Approve selected\". Timesheets open the review screen with \"What changed\".", "Leave items show \"Annual: 7 available now · 6.5 after this\" (red when short). Approving when short opens \"Not enough leave\" with the loss-of-pay amount, Approve anyway or Ask for update.", "Team today, Team attendance (month grid: P, L, ½, A, Lv, H, W, In; click a cell for the day), Team timesheets, Leave calendar (approved solid, pending dashed, ½; \"Leave to approve\" side panel with an \"Also off\" clash chip), Team reimbursements (month totals, by person, status filter, inline actions).", "Hide Team today / Team attendance in timesheet-only mode and Team timesheets in attendance-only mode."]]]}, "settings": {"title": "Payroll settings (where each module’s settings live)", "sections": [["General", ["All ESS settings live in the existing Payroll settings section, never inside service tabs. \"Run payroll\" is not a setting.", "Settings drive ESS behaviour directly; changing them affects employees from that moment (items already in flight keep their approvers)."]], ["Tabs", ["Attendance, timesheet & overtime → see the Attendance, Timesheet and Overtime modules.", "Leave (Leave types, Public holidays, Configuration, Approvals) → see the Leave module.", "Reimbursements → see the Reimbursements module."]]]}};
