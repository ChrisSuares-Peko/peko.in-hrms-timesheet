lso off: Sneha\" or \"No one else off\"), \"Show on calendar\", and Approve / Ask for update / Reject."]]], "prompt": "Build: ESS → My team → Leave calendar\n\nContext: we are building the ESS service module by module (Leave first, then Attendance, then Timesheet, then Overtime, Reimbursements, Profile). This page is part of the Leave (approver view) module.\nRead first: the Developer notes for this page (this panel), the Shared platform rules in \"How to use these notes\", and the prototype (docs/prototypes/leave-prototype.html): open it and go to this page.\n\nWhat this page is: Who in the team is off when, with the leave waiting for this approver beside it.\n\nBuild or change:\n- The team leave calendar with the Leave to approve side panel and clash chips.\n\nRules for this run:\n- Reuse the existing components, design system, routing and data layer. Put business rules in tested functions, not in the component.\n- Don't ask me questions. Make the most reasonable choice, note it in docs/progress.md, and carry on.\n- Work on main, commit in small steps, run type-check, lint and tests, and fix what you break.\n\nDone when:\n- Approved vs pending styles correct; clash chip counts overlapping approved leave; approving removes it from the panel.\n- No console errors; type-check, lint, tests and the production build pass.\n\nReport: what changed (files), decisions, and each check pass/fail."}, "pay:dashboard": {"title": "Payroll → Dashboard", "module": "Shared", "what": "The admin’s entry point. There are no service tabs on the Payroll side; each service opens from Quick actions.", "sections": [["What’s on the page", ["Quick actions tiles: Timesheet, Attendance, Leave, Overtime, Reimbursements, Employees, Payroll settings (Timesheet/Attendance hidden by tracking mode). Each shows a short description and a red count of items waiting for the admin.", "Opening a tile shows the service page with the breadcrumb \"Payroll › Services › {service}\" and a way back to the dashboard. Old tab routes redirect."]]], "prompt": "Build: Payroll → Dashboard\n\nContext: we are building the ESS service module by module (Leave first, then Attendance, then Timesheet, then Overtime, Reimbursements, Profile). This page is part of the Shared module.\nRead first: the Developer notes for this page (this panel), the Shared platform rules in \"How to use these notes\", and the prototype (docs/prototypes/leave-prototype.html): open it and go to this page.\n\nWhat this page is: The admin’s entry point. There are no service tabs on the Payroll side; each service opens from Quick actions.\n\nBuild or change:\n- Quick actions tiles on the Payroll dashboard opening each service page, breadcrumb + back, redirects from old tab routes.\n\nRules for this run:\n- Reuse the existing components, design system, routing and data layer. Put business rules in tested functions, not in the component.\n- Don't ask me questions. Make the most reasonable choice, note it in docs/progress.md, and carry on.\n- Work on main, commit in small steps, run type-check, lint and tests, and fix what you break.\n\nDone when:\n- No service tabs; each tile opens its service with the breadcrumb; counts match each service’s waiting items.\n- No console errors; type-check, lint, tests and the production build pass.\n\nReport: what changed (files), decisions, and each check pass/fail."}, "pay:leave:overview": {"title": "Payroll → Leave → Overview", "module": "Leave", "what": "The company-wide leave picture for HR, and a quick place to approve.", "sections": [["What’s on the page", ["Header: \"Leave\", one-line description, \"Add leave\" button (top right, on every Leave sub-tab).", "Sub-tabs: Overview · Leaves · Requests (count) · Balances.", "Five counts: Off today (of N employees), Off this week, Waiting for you, Leave taken this month (approved days), On probation.", "Off today strip (name · type · ½).", "Company leave calendar with the \"Leave to approve\" side panel at Level 2 (items waiting for the HR team), clash chips."]], ["Add leave (HR drawer)", ["Employee → Start date → End date → duration worked out (\"3 working days\") → Full days / first half of each day / second half of each day → Leave type with that employee’s available balance → note → optional attachment.", "Same checks as the employee form (overlap, balance, probation, applies-to). Approved immediately, marked \"Added by HR\"; attendance and timesheet update straight away; the employee sees it in My requests.", "Follows the leave type’s rules like the employee form: half days only for types that allow them; per-event types ask for the event date (and, for Maternity, \"Which child is this?\"), check the start window and the limit, and allow one block per event."]]], "prompt": "Build: Payroll → Leave → Overview\n\nContext: we are building the ESS service module by module (Leave first, then Attendance, then Timesheet, then Overtime, Reimbursements, Profile). This page is part of the Leave module.\nRead first: the Developer notes for this page (this panel), the Shared platform rules in \"How to use these notes\", and the prototype (docs/prototypes/leave-prototype.html): open it and go to this page.\n\nWhat this page is: The company-wide leave picture for HR, and a quick place to approve.\n\nBuild or change:\n- Payroll Leave Overview (counts, Off today, company calendar with Level 2 approval panel).\n- The HR Add leave drawer with all checks, approved immediately.\n\nRules for this run:\n- Reuse the existing components, design system, routing and data layer. Put business rules in tested functions, not in the component.\n- Don't ask me questions. Make the most reasonable choice, note it in docs/progress.md, and carry on.\n- Work on main, commit in small steps, run type-check, lint and tests, and fix what you break.\n\nDone when:\n- Counts correct; calendar shows approved/pending; panel approves at Level 2.\n- Add leave creates approved leave (half days over a range work) and updates attendance and timesheet.\n- No console errors; type-check, lint, tests and the production build pass.\n\nReport: what changed (files), decisions, and each check pass/fail."}, "pay:leave:leaves": {"title": "Payroll → Leave → Leaves", "module": "Leave", "what": "All approved leave across the company (replaces the live \"Leaves\" tab), with HR cancel.", "sections": [["What’s on the page", ["Filters: All / Upcoming / On leave now / Taken; leave type; date range (any overlap); search by name, email or leave type.", "Table: Name (photo, name, email) · Leave type · From · To · Duration (\"1 day\", \"Half day (first)\", \"2.5 days (second halves)\") · Reason · Applied on · Added by (Employee/HR) · Status (Upcoming / On leave now / Taken) · Cancel (for leave not finished).", "Count line under the table."]], ["HR cancel", ["Reason required. Applies immediately. If the leave has started, HR can choose \"Cancel from\" (past days allowed for HR). Days go back to the balance, the request shows as Cancelled, attendance and timesheet update."]], ["View and export", ["Each row has View (opens the request drawer read-only: details, document, approval chain, history) next to Cancel. \"Export\" downloads the filtered table as Excel."]]], "prompt": "Build: Payroll → Leave → Leaves\n\nContext: we are building the ESS service module by module (Leave first, then Attendance, then Timesheet, then Overtime, Reimbursements, Profile). This page is part of the Leave module.\nRead first: the Developer notes for this page (this panel), the Shared platform rules in \"How to use these notes\", and the prototype (docs/prototypes/leave-prototype.html): open it and go to this page.\n\nWhat this page is: All approved leave across the company (replaces the live \"Leaves\" tab), with HR cancel.\n\nBuild or change:\n- The Leaves table with filters and search, and HR Cancel.\n\nRules for this run:\n- Reuse the existing components, design system, routing and data layer. Put business rules in tested functions, not in the component.\n- Don't ask me questions. Make the most reasonable choice, note it in docs/progress.md, and carry on.\n- Work on main, commit in small steps, run type-check, lint and tests, and fix what you break.\n\nDone when:\n- Filters and search narrow the table; Cancel applies immediately and returns the days.\n- No console errors; type-check, lint, tests and the production build pass.\n\nReport: what changed (files), decisions, and each check pass/fail."}, "pay:leave:requests": {"title": "Payroll → Leave → Requests", "module": "Leave", "what": "Leave-related requests waiting for HR (Level 2 or a team at Level 1), plus a read-only view of what’s still with managers.", "sections": [["What’s on the page", ["Views depend on the approval setup: \"Waiting for you\" only if a team is an approver at some level; \"With managers\" / \"With approvers\" only if a person is; \"Update requested\", \"Rejected\", \"All\" always. A view stays while older items still sit in it. No \"Approved\" view here (that’s Leaves).", "Rows: request with employee, summary, approval chain; clash chip (approved leave in the same department overlapping); balance line (\"X available now · Y after this\").", "Waiting for you: Select all, checkboxes, \"Approve selected (N)\"; per row Approve / Ask for update / Reject. Approving short shows \"Not enough leave\".", "With managers/approvers: read-only, \"Waiting for {name}. You can decide once they approve.\", Remind {name}. Update requested: Remind employee.", "Includes leave cancellations, leave changes and comp off requests."]], ["View", ["Every leave, cancellation, change and comp off request has a View button that opens the full request read-only (details, attached document, approval chain, history). Attached documents also show on the row (\"📎 file name\"), so approvers can check them before deciding."]]], "prompt": "Build: Payroll → Leave → Requests\n\nContext: we are building the ESS service module by module (Leave first, then Attendance, then Timesheet, then Overtime, Reimbursements, Profile). This page is part of the Leave module.\nRead first: the Developer notes for this page (this panel), the Shared platform rules in \"How to use these notes\", and the prototype (docs/prototypes/leave-prototype.html): open it and go to this page.\n\nWhat this page is: Leave-related requests waiting for HR (Level 2 or a team at Level 1), plus a read-only view of what’s still with managers.\n\nBuild or change:\n- The Requests sub-tab with setup-driven views, bulk approve, clash chips, balance line and warning, remind actions.\n\nRules for this run:\n- Reuse the existing components, design system, routing and data layer. Put business rules in tested functions, not in the component.\n- Don't ask me questions. Make the most reasonable choice, note it in docs/progress.md, and carry on.\n- Work on main, commit in small steps, run type-check, lint and tests, and fix what you break.\n\nDone when:\n- Set leave approvers to a team only: no \"With managers\" view.\n- Bulk approve finalises leave and runs the effects.\n- Cancellation and change requests apply correctly on approval.\n- No console errors; type-check, lint, tests and the production build pass.\n\nReport: what changed (files), decisions, and each check pass/fail."}, "pay:leave:details": {"title": "Payroll → Leave → Balances", "module": "Leave", "what": "Every employee’s leave position, and where HR confirms employees out of probation.", "sections": [["What’s on the page", ["Table: Employee · Department · Status (Active, or Probation with \"Mark active\") · one column per leave type \"available / allocated\" (available excludes leave in request, with \"N in request\" under it; \"—\" if the type doesn’t apply) · Late deductions · Loss of pay.", "Click a row: that employee’s balance cards and ledger."]], ["Probation", ["Probation is a status, not a length. \"Mark active\" sets status Active with confirmedOn = today; from that date the normal leave rules apply (upfront types credit the rest of the year; \"not available\" types start crediting)."]], ["Adjust, import, export", ["Each row has \"Adjust balance\": leave type (with current availability), Add days / Deduct days, days, reason (required, shown in the employee’s ledger and Recent activity), a live \"9.5 → 11.5 days available after this\" preview. Saved as an adjustment {employee, type, ±days, reason, date, by} that the engine counts as a credit or deduction in that cycle. Also reachable from the employee’s balance popup.", "\"Import opening balances\" (for companies moving to Peko mid-year): upload → review, like the holiday upload. Template columns: Employee ID, Leave type, Opening balance (days), As of date. Review statuses: Ready, Employee ID not found, Leave type not found (yearly types only), This type doesn’t apply to the employee, Opening balance isn’t a number, Duplicate row, Already imported. Imports Ready rows as \"Opening balance\" ledger lines.", "\"Export\" downloads the table as Excel (employee, department, status, available and allocated per type)."]]], "prompt": "Build: Payroll → Leave → Balances\n\nContext: we are building the ESS service module by module (Leave first, then Attendance, then Timesheet, then Overtime, Reimbursements, Profile). This page is part of the Leave module.\nRead first: the Developer notes for this page (this panel), the Shared platform rules in \"How to use these notes\", and the prototype (docs/prototypes/leave-prototype.html): open it and go to this page.\n\nWhat this page is: Every employee’s leave position, and where HR confirms employees out of probation.\n\nBuild or change:\n- The Balances sub-tab with available / allocated per type, status and Mark active.\n\nRules for this run:\n- Reuse the existing components, design system, routing and data layer. Put business rules in tested functions, not in the component.\n- Don't ask me questions. Make the most reasonable choice, note it in docs/progress.md, and carry on.\n- Work on main, commit in small steps, run type-check, lint and tests, and fix what you break.\n\nDone when:\n- Numbers match the employee’s own cards; Mark active switches the employee to full-employee rules.\n- No console errors; type-check, lint, tests and the production build pass.\n\nReport: what changed (files), decisions, and each check pass/fail."}, "pay:settings:leave:types": {"title": "Payroll settings → Leave → Leave types", "module": "Leave", "what": "Where HR defines every leave type. These settings decide what employees see and can do in ESS.", "sections": [["Design notes", ["Field explanations, panel descriptions, worked examples and policy notes on this page are tooltips (info icon next to the label or title), not visible text. Keep only values, choices, statuses and errors always visible."]], ["What’s on the page", ["Scope: everything here is per leave type. Company-wide rules (credit date, rounding, leave year, sandwich rule, LOP, comp off) are in Configuration.", "Table columns only: Leave type (with a small line: Yearly balance / Per event / Statutory · required or optional / Inactive) · Number of days (\"12 days a year\", \"7 days per event\", \"182 days per birth\") · Accrual type and rate (\"Monthly · 1 day a month\", \"Per event\") · Leave balance carryover (\"Yes, up to 30 days\" / \"No\") · Applicable gender · Action (View, Edit, Delete).", "View shows every rule of the type, grouped as in the drawer. Delete is disabled for used types and for Maternity.", "Maternity is set up for every company and can’t be deleted or renamed. Required when the company has more than 10 current employees (headcount from Employees, people without a past leaving date): always on, switch locked. 10 or fewer: optional, off by default.", "Delete asks for confirmation (\"Delete Paternity?\" … can’t be undone; disable instead if you might use it again)."]], ["Drawer: every type", ["Name; Kind: Yearly balance / Per event; Count leave in: Working days / Calendar days; Applicable gender. Maternity skips kind, count and gender (fixed: per event, calendar days, female).", "Footer (existing types only): \"Disable leave type\" (red outline, left) / \"Enable leave type\" when disabled, plus Cancel and Save. It applies straight away: disabling hides the type from employees without deleting it; balances and past leave stay. Tooltip explains this. For Maternity the button is disabled while it’s legally required (more than 10 employees); with 10 or fewer it switches maternity on/off. Disabled types show \"Inactive\" in the table."]], ["Drawer: Yearly balance (three phases)", ["Days per year (shows the monthly amount).", "1 · During probation (new joiners): \"Can employees on probation use it?\" Yes / No. If yes, \"How it’s credited during probation\": Monthly / Daily / All at once. If no, nothing is credited until HR marks the employee Active. Stored as prob = none / monthly / daily / full.", "2 · After probation (regular employees): \"How it’s credited\": All at once / Monthly / Daily. \"At the end of the leave cycle\", four options: All lapse · All encashed · Carry forward (up to the limit; days above it lapse) · Carry forward, encash the rest (up to the limit moves on; days above it are paid out). The two carry options show \"Carry forward up to N days\". Stored as yearEnd lapse / encash / carry + excess lapse / encash. Runs automatically on the last working day of the cycle.", "3 · When an employee leaves: pro-rated to the last working day, then Unused leave: Encash / Bring last working day forward / Lapse (store the rule; F&F is a later module).", "Requests: Half days (on/off, per type; the Apply form only offers half days for types that allow it); Supporting documents (on/off; when on, \"for leave longer than N days\", 0 = every request)."]], ["Drawer: Maternity (statutory per-event type)", ["Banner: statutory, numbers follow the Code on Social Security, 2020; more generous than the law is allowed, less is not.", "Offer maternity leave (headcount rule above). Triggered by: Expected or actual date of delivery (fixed).", "Days of leave by child: First child, Second child, Third child or later, each a number of days with the legal minimum shown (182 / 182 / 84). Saving below the minimum is refused.", "When the leave can start: \"From N weeks before the delivery date to M weeks after it\" (defaults 8 and 0). The law caps \"before\" at 8 weeks (6 for the third child or later, applied automatically). All the days run on from the start date in one go. A worked example under the fields updates live (due date 1 December).", "Supporting documents: on by default, plus what to ask for."]], ["Drawer: other per-event types", ["Triggered by (Childbirth or adoption / Childbirth / Adoption / Miscarriage or medical termination / Surgery or medical procedure / Other event); Number of days (days or weeks, for one event, in one go); When the leave can start (N days before to M days after the event, empty = no limit, with a live example); Supporting documents (on/off + what to ask for)."]]], "prompt": "Build: Payroll settings → Leave → Leave types\n\nContext: we are building the ESS service module by module (Leave first, then Attendance, then Timesheet, then Overtime, Reimbursements, Profile). This page is part of the Leave module.\nRead first: the Developer notes for this page (this panel), the Shared platform rules in \"How to use these notes\", and the prototype (docs/prototypes/leave-prototype.html): open it and go to this page.\n\nWhat this page is: Where HR defines every leave type. These settings decide what employees see and can do in ESS.\n\nBuild or change:\n- The Leave types sub-tab: table with an Action column (View, Edit, Delete; Delete disabled for used types), search, View popup, Add/Edit drawer with help text and the sections Joins (probation) / Leaves (encash in F&F or bring the last working day forward, stored only) / Other (incl. Show to employees = deactivate), change confirmation.\n- Map existing leave policy data into the new model without losing anything.\n\nRules for this run:\n- Reuse the existing components, design system, routing and data layer. Put business rules in tested functions, not in the component.\n- Don't ask me questions. Make the most reasonable choice, note it in docs/progress.md, and carry on.\n- Work on main, commit in small steps, run type-check, lint and tests, and fix what you break.\n\nDone when:\n- Adding a daily-credit type and a female-only type works and shows correctly in ESS.\n- Editing a used type asks for confirmation with the affected count.\n- No console errors; type-check, lint, tests and the production build pass.\n\nReport: what changed (files), decisions, and each check pass/fail."}, "pay:settings:leave:holidays": {"title": "Payroll settings → Leave → Public holidays", "module": "Leave", "what": "The company’s dated public holiday list per year.", "sections": [["Design notes", ["Field explanations, panel descriptions, worked examples and policy notes on this page are tooltips (info icon next to the label or title), not visible text. Keep only values, choices, statuses and errors always visible."]], ["Holidays with ranges", ["A holiday can be one day or a range (e.g. Diwali, 3 days). Add holiday / Edit open a popup: Holiday name, From, To (same as From for one day), max 31 days, no overlap with other holidays. The table groups consecutive dates with the same name: Holiday · Date (range) · Days · Action (Edit, Remove). Remove asks for confirmation. Stored per date; the grouping is for display and editing."]], ["What’s on the page", ["Year switcher (last / this / next), add date + name, table (date, day, \"Weekly off\" tag, name, Remove), summary \"N holidays in 2026 · M on working days\"."]], ["Rules", ["Holidays drive calendars, timesheet prefill, leave day counts (never counted as leave) and comp off eligibility. A holiday on a weekly off gives no extra day. Duplicate dates refused."]], ["Bulk upload", ["\"Bulk upload\" next to Add holiday opens a two-step popup: 1 · Upload file, 2 · Review (same pattern as bulk employee upload in Payroll).", "Upload: one row per holiday with Start date, End date (same as start for one day) and Holiday name. \"Download template\" gives an Excel file with the header and two sample rows. Accepts .xlsx, .xls and .csv; dates as YYYY-MM-DD or DD/MM/YYYY (or Excel dates).", "Review: table of Row, Holiday, From, To, Days, Status. Status is Ready, Already added (date already a holiday; duplicates are skipped), or a problem (\"Start date isn’t a date\", \"Holiday name is missing\", \"End date is before the start date\", \"More than 31 days long\"). Summary line with counts. \"Import N days\" adds only the Ready rows (a multi-day holiday becomes one entry per date with the same name); Back returns to the upload step."]]], "prompt": "Build: Payroll settings → Leave → Public holidays\n\nContext: we are building the ESS service module by module (Leave first, then Attendance, then Timesheet, then Overtime, Reimbursements, Profile). This page is part of the Leave module.\nRead first: the Developer notes for this page (this panel), the Shared platform rules in \"How to use these notes\", and the prototype (docs/prototypes/leave-prototype.html): open it and go to this page.\n\nWhat this page is: The company’s dated public holiday list per year.\n\nBuild or change:\n- The Public holidays sub-tab with add/remove per year.\n\nRules for this run:\n- Reuse the existing components, design system, routing and data layer. Put business rules in tested functions, not in the component.\n- Don't ask me questions. Make the most reasonable choice, note it in docs/progress.md, and carry on.\n- Work on main, commit in small steps, run type-check, lint and tests, and fix what you break.\n\nDone when:\n- Adding a holiday shows it in ESS (holidays tab, calendars) and leave counts skip it.\n- No console errors; type-check, lint, tests and the production build pass.\n\nReport: what changed (files), decisions, and each check pass/fail."}, "pay:settings:leave:config": {"title": "Payroll settings → Leave → Configuration", "module": "Leave", "what": "Company-wide leave rules.", "sections": [["Design notes", ["Field explanations, panel descriptions, worked examples and policy notes on this page are tooltips (info icon next to the label or title), not visible text. Keep only values, choices, statuses and errors always visible.", "Negative balance: on/off; \"Up to N days below zero per leave type\" (empty = no limit). When on, employees (and HR) can book more than the available balance up to that limit; the balance goes negative and is recovered from the next credits, or in the full & final settlement if they leave. Yearly balance types only. Approvers see \"−1.5 after this (negative balance, recovered from the next credits)\"."]], ["Panels", ["Scope: these rules apply to every leave type (note at the top of the page). Rules for one leave type are set on that type in Leave types.", "Credit date: Start / End / Custom, applied to both monthly and daily credits (types credited all at once aren’t affected). Start: monthly on the 1st for the month ahead; daily at the start of each day. End: monthly on the last day once the month is worked; daily once the day is over. Custom: monthly on a set day (1–28); daily from a set time (default 12:00 PM). Two small cards under the choice spell out what it means for monthly and for daily credits. Joiners follow the same schedule from their joining date.", "Rounding: No rounding / Nearest half day / Nearest day. Applied to credited-so-far and the year’s total (e.g. 14 a year = 1.167 a month).", "Leave year: company cycle (start day + month) or each employee’s joining date. Balances roll forward automatically on the last working day of the cycle, following each type’s year-end rule.", "Loss of pay (unpaid leave): \"Only once paid leave is used up\" / \"Any time, even with paid leave left\". \"Used up\" = all yearly balances (and comp off) at 0; per-event leave doesn’t count. LOP has no limit and follows the leave approvers.", "Comp off: on/off + expires after N days.", "Half-day leave is no longer here: it’s a per-type setting in the leave type drawer.", "Sandwich rule: on/off. When on, \"When it applies\": Always / Only for longer leave (\"when a request covers more than N days in total, from the first to the last day\"); \"What counts as leave\": Weekly offs, Public holidays (checkboxes). Only days off between the first and last working day of the request count. A worked example updates live: leave 1st–9th with the 6th and 7th weekly offs and the 4th a holiday = 6 days without the rule, 9 with it (if the request is longer than the threshold)."]], ["Not settings (fixed rules, documented in the leave engine, not shown here)", ["Probation: employees on Probation follow each leave type’s probation rule until HR marks them Active (Payroll → Leave → Balances). There is no probation length to set.", "Pro-rating: a month counts if someone joins on or before the 15th, or leaves on or after the 15th. Credits aren’t rounded.", "Late check-in deduction is an Attendance setting (Payroll settings → Attendance, timesheet & overtime), not a Leave one."]]], "prompt": "Build: Payroll settings → Leave → Configuration\n\nContext: we are building the ESS service module by module (Leave first, then Attendance, then Timesheet, then Overtime, Reimbursements, Profile). This page is part of the Leave module.\nRead first: the Developer notes for this page (this panel), the Shared platform rules in \"How to use these notes\", and the prototype (docs/prototypes/leave-prototype.html): open it and go to this page.\n\nWhat this page is: Company-wide leave rules.\n\nBuild or change:\n- The Configuration sub-tab with the Leave year, Leave requests, Sandwich rule and Comp off panels, wired to the leave rules. No probation/pro-rating panel and no late check-in panel here.\n- The automatic year-end roll-forward job (last working day of the cycle).\n\nRules for this run:\n- Reuse the existing components, design system, routing and data layer. Put business rules in tested functions, not in the component.\n- Don't ask me questions. Make the most reasonable choice, note it in docs/progress.md, and carry on.\n- Work on main, commit in small steps, run type-check, lint and tests, and fix what you break.\n\nDone when:\n- Each setting changes ESS behaviour as described (half day option, sandwich count, comp off button, deduction order).\n- No console errors; type-check, lint, tests and the production build pass.\n\nReport: what changed (files), decisions, and each check pass/fail."}, "pay:settings:leave:approvals": {"title": "Payroll settings → Leave → Approvals", "module": "Leave", "what": "Who approves leave.", "sections": [["Rules", ["Level 1 and Level 2 each offer: Reporting manager · Admin / HR (decided in that service in Payroll) · a specific person (managers and the CEO). Level 2 also has None (level 1 is final).", "Typical setup: Reporting manager → Admin / HR. The manager approves first, then it comes to Payroll → Leave → Requests for the final approval.", "\"Reporting manager\" at Level 2 resolves to the employee’s manager when Level 1 approves; if that’s the same person who approved Level 1, the request is final.", "Approvers are fixed on each request when it’s submitted, so changing this doesn’t move requests in flight. Leave cancellations, changes and comp off use the same approvers. Older team values (Payroll, HR, Admin, Finance) all show as Admin / HR.", "Extra approval for longer leave (on/off): when a request is longer than N days, an endorsement step is added after Level 1 and before Level 2. Endorser: Department head of the employee’s department, or a specific person. Skipped if the endorser is the Level 1 approver or the employee. Shown in the approval chain as \"{name} (endorsement)\"; the item waits in that person’s My team → Approvals. Applies to leave and leave changes."]]], "prompt": "Build: Payroll settings → Leave → Approvals\n\nContext: we are building the ESS service module by module (Leave first, then Attendance, then Timesheet, then Overtime, Reimbursements, Profile). This page is part of the Leave module.\nRead first: the Developer notes for this page (this panel), the Shared platform rules in \"How to use these notes\", and the prototype (docs/prototypes/leave-prototype.html): open it and go to this page.\n\nWhat this page is: Who approves leave.\n\nBuild or change:\n- The leave approvals row with Level 1 / Level 2 dropdowns, wired to the routing rules.\n\nRules for this run:\n- Reuse the existing components, design system, routing and data layer. Put business rules in tested functions, not in the component.\n- Don't ask me questions. Make the most reasonable choice, note it in docs/progress.md, and carry on.\n- Work on main, commit in small steps, run type-check, lint and tests, and fix what you break.\n\nDone when:\n- Changing approvers routes new requests correctly and leaves in-flight ones alone.\n- No console errors; type-check, lint, tests and the production build pass.\n\nReport: what changed (files), decisions, and each check pass/fail."}, "ess:home": {"title": "ESS → Overview", "module": "ESS shell", "what": "The employee’s home page.", "sections": [["Cards", ["Profile: edits go to HR for approval (no manager step). Only one pending update at a time; the edited fields are locked while it’s pending.", "Attendance today: Check in · Start/End break · Check out. Status line, breaks today with Edit breaks, the late-deduction note after a late check-in, and the \"Working from\" switch only in attendance-only mode.", "If an earlier day is still open (no check-out, search back 60 days), Check in is disabled and \"Check out from {date}\" closes it with today’s time and outDays = days between. The server must refuse a check-in while an earlier session is open.", "Today’s timesheet: the same entry form as the Timesheet tab (labelled fields, location, project when on), the day bar, and Submit with the unlogged-hours check. Note: \"Every change saves automatically…\".", "Quick actions: one row. Managers / approvers also get My team (with a count badge).", "Recent days: last 10 working days with check in/out (next-day chip), hours worked, hours logged, overtime state."]], ["Notifications → Needs your action (order)", ["Update requested on any of my requests (with the approver’s comment).", "Still checked in from an earlier day.", "Late check-in deductions from the last 7 days, not yet disputed (max 3), with Request correction.", "Sent-back timesheet, unclaimed overtime, and for approvers \"{N} waiting for your approval\"."]]], "prompt": "Build: ESS → Overview\n\nContext: we are building the ESS service module by module (Leave first, then Attendance, then Timesheet, then Overtime, Reimbursements, Profile). This page is part of the ESS shell module.\nRead first: the Developer notes for this page (this panel), the Shared platform rules in \"How to use these notes\", and the prototype (docs/prototypes/leave-prototype.html): open it and go to this page.\n\nWhat this page is: The employee’s home page.\n\nBuild or change:\n- The ESS Overview cards and Notifications as described.\n\nRules for this run:\n- Reuse the existing components, design system, routing and data layer. Put business rules in tested functions, not in the component.\n- Don't ask me questions. Make the most reasonable choice, note it in docs/progress.md, and carry on.\n- Work on main, commit in small steps, run type-check, lint and tests, and fix what you break.\n\nDone when:\n- Behaviour matches the notes and the prototype on this page.\n- No console errors; type-check, lint, tests and the production build pass.\n\nReport: what changed (files), decisions, and each check pass/fail."}, "ess:time:attendance": {"title": "ESS → Attendance", "module": "Attendance", "what": "Check in/out, breaks, the month and corrections. (Attendance is the next module after Leave.)", "sections": [["Attendance rules", ["One check-in and one check-out per day. No automatic check-out: a session stays open until the employee checks out, even across days.", "Overnight work counts to the check-in day: store outDays (0 = same day, 1 = next day…). Hours worked = check-out + outDays × 24h − check-in, breaks included.", "Breaks: multiple per day, { start, end, description }. Start/End only while checked in; checking out ends a running break. Today’s breaks can be edited directly (no overlaps, inside the session); past breaks only via a correction.", "Late mark: check-in after shift start + grace. With first-half leave, the shift start moves to mid-shift. No exceptions for working late the night before.", "Location (attendance-only mode): optional day-level timeline [{ at, location, client }], changeable any time; first entry from the pre-check-in choice."]], ["Late check-in deduction", ["Each late mark deducts settings.lateDays (default 0.5, 0 = off) immediately, from the order set in Leave settings (default Annual, then Casual, then loss of pay).", "It stays deducted while a dispute (correction) is pending. When the correction is approved and the day is no longer late, it’s reversed automatically and shown as \"+0.5 reversed\".", "Attendance tab Notes panel (latest 5): no dispute yet → Raise dispute; pending → waiting for {approver}; rejected → shows who and their comment, with Dispute again."]], ["Attendance tab layout", ["Header: one \"Request correction\" button. Grid: Today | Month totals (3×3) | My correction requests (spans both rows, same height as the left side, scrolls inside). Calendar spans the first two columns.", "Totals: Present, Late, Half day, Absent, On leave, Holidays, Worked off-days, Break time, and \"Xh worked, Yh overtime\".", "Correction popup: date picker, \"Recorded now\", check-in, check-out, same day / next day, reason. Refuses future dates and days with a pending correction. Asks before replacing edited times when the date changes."]]], "prompt": "Build: ESS → Attendance\n\nContext: we are building the ESS service module by module (Leave first, then Attendance, then Timesheet, then Overtime, Reimbursements, Profile). This page is part of the Attendance module.\nRead first: the Developer notes for this page (this panel), the Shared platform rules in \"How to use these notes\", and the prototype (docs/prototypes/leave-prototype.html): open it and go to this page.\n\nWhat this page is: Check in/out, breaks, the month and corrections. (Attendance is the next module after Leave.)\n\nBuild or change:\n- The Attendance tab as described.\n\nRules for this run:\n- Reuse the existing components, design system, routing and data layer. Put business rules in tested functions, not in the component.\n- Don't ask me questions. Make the most reasonable choice, note it in docs/progress.md, and carry on.\n- Work on main, commit in small steps, run type-check, lint and tests, and fix what you break.\n\nDone when:\n- Behaviour matches the notes and the prototype on this page.\n- No console errors; type-check, lint, tests and the production build pass.\n\nReport: what changed (files), decisions, and each check pass/fail."}, "ess:time:timesheet": {"title": "ESS → Timesheet", "module": "Timesheet", "what": "Logging work, submitting and Excel import/export. (Timesheet comes after Attendance.)", "sections": [["Timesheet entries", ["Entry: { id, date, start|null, end|null, startNext, endNext, mins, description, project|null, location, client|null }. Hours-only entries allowed (parse 1:30, 1.5, 1h 30m).", "An end earlier than the start means the next morning (\"Ends next day\"). On an overnight day, a start before check-in means after midnight.", "Overlaps are blocked, including against breaks and leave/holiday rows.", "Location per entry (attendance + timesheet and timesheet-only): Office / Home / Client site (+ client name, required). Defaults to the last used.", "Project codes when HR turns them on: required on every entry."]], ["Rows the system adds (read-only, not stored as entries)", ["Breaks (description editable), approved leave (full shift, or the half for half days), weekday public holidays (skipped if the employee checked in that day).", "They count towards logged hours, never count as overtime, and never make a period \"Saved\" or need submitting."]], ["Targets and saving", ["Day target = hours worked (full check-in to check-out). Timesheet-only = shift length. Leave or public holiday (no check-in) = shift length. Half-day leave = worked + half shift.", "Every change saves immediately; changed dates are tracked (dirty set) and shown as \"Saved\" until submitted.", "Submit (view bar) sends every period overlapping the current Day/Week/Month view that is Draft or Update requested. If only edits of already-sent periods are included: \"Only your changes will be resubmitted\" + the changed dates. Day view notes that the whole filing period goes.", "Auto-submit at the HR-set day and time sends Draft periods with entries (and their attendance). Anything already sent is left alone.", "Editing a period after it was sent (even approved) moves it back to Draft with a baseline; reviewers see \"What changed\".", "Period statuses: draft → submitted (with Level 1) → with_payroll (with Level 2) → approved; rejected = Update requested."]], ["Timesheet screen", ["Calendar 65% / Notices 35% (same height, scrolls inside). Legend: Saved · Submitted · Update requested · Leave · Public holiday · Selected (red outline on the days in view).", "Notices: the focused week’s status, \"Needs your action\" across all weeks with Go to day, Unlogged hours, History. No Submit in Notices.", "Single bar per day (no second meter). The axis stretches past midnight on overnight days.", "Download timesheet: date range presets + custom, downloads .xlsx (template columns + Status), Copy rows as a fallback.", "Upload timesheet: .xlsx/.xls/.csv; Download template inside the popup; matches columns by name (synonyms), validates each row (date, times, hours, location, project, description, overlaps), imports only the ready rows as Saved. A downloaded file must upload back cleanly."]]], "prompt": "Build: ESS → Timesheet\n\nContext: we are building the ESS service module by module (Leave first, then Attendance, then Timesheet, then Overtime, Reimbursements, Profile). This page is part of the Timesheet module.\nRead first: the Developer notes for this page (this panel), the Shared platform rules in \"How to use these notes\", and the prototype (docs/prototypes/leave-prototype.html): open it and go to this page.\n\nWhat this page is: Logging work, submitting and Excel import/export. (Timesheet comes after Attendance.)\n\nBuild or change:\n- The Timesheet tab as described.\n\nRules for this run:\n- Reuse the existing components, design system, routing and data layer. Put business rules in tested functions, not in the component.\n- Don't ask me questions. Make the most reasonable choice, note it in docs/progress.md, and carry on.\n- Work on main, commit in small steps, run type-check, lint and tests, and fix what you break.\n\nDone when:\n- Behaviour matches the notes and the prototype on this page.\n- No console errors; type-check, lint, tests and the production build pass.\n\nReport: what changed (files), decisions, and each check pass/fail."}, "ess:time:overtime": {"title": "ESS → Overtime", "module": "Overtime", "what": "Overtime suggestions and claims.", "sections": [["Overtime", ["Suggestion = hours worked − shift length, at least the HR minimum. Weekends and public holidays count in full. Leave/holiday rows never count.", "No suggestion while the day is still open, while a correction for it is pending, or if the day was claimed as comp off.", "Overtime only exists once the employee claims it (planned overtime allowed)."]]], "prompt": "Build: ESS → Overtime\n\nContext: we are building the ESS service module by module (Leave first, then \nContext: we are building the ESS service module by module (Leave first, then Attendance, then Timesheet, then Overtime, Reimbursements, Profile). This page is part of the Reimbursements module.\nRead first: the Developer notes for this page (this panel), the Shared platform rules in \"How to use these notes\", and the prototype (docs/prototypes/leave-prototype.html): open it and go to this page.\n\nWhat this page is: Expense claims.\n\nBuild or change:\n- The claim form and list as described.\n\nRules for this run:\n- Reuse the existing components, design system, routing and data layer. Put business rules in tested functions, not in the component.\n- Don't ask me questions. Make the most reasonable choice, note it in docs/progress.md, and carry on.\n- Work on main, commit in small steps, run type-check, lint and tests, and fix what you break.\n\nDone when:\n- Behaviour matches the notes and the prototype on this page.\n- No console errors; type-check, lint, tests and the production build pass.\n\nReport: what changed (files), decisions, and each check pass/fail."}, "ess:profile": {"title": "ESS → My profile", "module": "Profile", "what": "The employee’s profile.", "sections": [["Rules", ["Edits go to HR for approval (no manager step). One pending update at a time; edited fields are locked while pending.", "Grade is still a placeholder (\"L4\" style) until Peko’s real format is confirmed."]]], "prompt": "Build: ESS → My profile\n\nContext: we are building the ESS service module by module (Leave first, then Attendance, then Timesheet, then Overtime, Reimbursements, Profile). This page is part of the Profile module.\nRead first: the Developer notes for this page (this panel), the Shared platform rules in \"How to use these notes\", and the prototype (docs/prototypes/leave-prototype.html): open it and go to this page.\n\nWhat this page is: The employee’s profile.\n\nBuild or change:\n- Profile editing as described.\n\nRules for this run:\n- Reuse the existing componen ed (files), decisions, and each check pass/fail."}, "pay:employees": {"title": "Payroll → Employees", "module": "Profile & employees", "what": "Admin view of profile & employees.", "sections": [["Scope", ["Existing employee list, plus a \"Profile updates\" sub-tab (HR approvals for ESS profile edits).", "Employee status Probation / Active drives leave probation rules (see Leave)."]]], "prompt": "Build: Payroll → Employees\n\nContext: we are building the ESS service module by module (Leave first, then Attendance, then Timesheet, then Overtime, Reimbursements, Profile). This page is part of the Profile & employees module.\nRead first: the Developer notes for this page (this panel), the Shared platform rules in \"How to use these notes\", and the prototype (docs/prototypes/leave-prototype.html): open it and go to this page.\n\nWhat this page is: Admin view of profile & employees.\n\nBuild or change:\n- Payroll → Employees as described.\n\nRules for this run:\n- Reuse the existing components, design system, routing and data layer. Put business rules in tested functions, not in the component.\n- Don't ask me questions. Make the most reasonable choice, note it in docs/progress.md, and carry on.\n- Work on main, commit in small steps, run type-check, lint and tests, and fix what you break.\n\nDone when:\n- Behaviour matches the notes and the prototype on this page.\n- No console errors; type-check, lint, tests and the production build pass.\n\nReport: what changed (files), decisions, and each check pass/fail."}, "pay:settings:ato": {"title": "Payroll settings → Attendance, timesheet & overtime", "module": "Attendance / Timesheet / Overtime", "what": "Settings for attendance, timesheets and overtime.", "sections": [["General", ["All ESS settings live in the existing Payroll settings section, never inside service tabs. \"Run payroll\" is not a setting.", "Settings drive ESS behaviour directly; changing them affects employees from that moment (items already in flight keep their approvers)."]], ["Attendance, timesheet & overtime", ["Tracking mode (4 options), working day rules (grace, half-day threshold, break), timesheet approval + auto-submit day/time, project codes (on/off + list), overtime minimum, approvals table (Level 1 / Level 2 dropdowns for attendance corrections, timesheets, overtime; rows greyed when the mode turns them off)."]], ["Late check-in deduction (attendance setting)", ["Days of leave deducted per late check-in (0 = off) and the deduct-from order (first leave type, then second, then loss of pay). Shown only when attendance is tracked. Deductions are reversed automatically when a dispute is approved."]], ["Approvers", ["Level 1 / Level 2 for attendance corrections, timesheets and overtime offer the same choices as leave: Reporting manager · Admin / HR · a specific person (+ None at Level 2)."]]], "prompt": "Build: Payroll settings → Attendance, timesheet & overtime\n\nContext: we are building the ESS service module by module (Leave first, then Attendance, then Timesheet, then Overtime, Reimbursements, Profile). This page is part of the Attendance / Timesheet / Overtime module.\nRead first: the Developer notes for this page (this panel), the Shared platform rules in \"How to use these notes\", and the prototype (docs/prototypes/leave-prototype.html): open it and go to this page.\n\nWhat this page is: Settings for attendance, timesheets and overtime.\n\nBuild or change:\n- These settings as described.\n\nRules for this run:\n- Reuse the existing components, design system, routing and data layer. Put business rules in tested functions, not in the component.\n- Don't ask me questions. Make the most reasonable choice, note it in docs/progress.md, and carry on.\n- Work on main, commit in small steps, run type-check, lint and tests, and fix what you break.\n\nDone when:\n- Behaviour matches the notes and the prototype on this page.\n- No console errors; type-check, lint, tests and the production build pass.\n\nReport: what changed (files), decisions, and each check pass/fail."}, "pay:settings:reimb": {"title": "Payroll settings → Reimbursements", "module": "Reimbursements", "what": "Reimbursement settings.", "sections": [["Leave → Approvals and Reimbursements", ["Leave approvals: Level 1 / Level 2 dropdowns (also used by cancellations and comp off).", "Reimbursements: categories (monthly limit per employee, receipt required), claim window in days, approvals."]]], "prompt": "Build: Payroll settings → Reimbursements\n\nContext: we are building the ESS service module by module (Leave first, then Attendance, then Timesheet, then Overtime, Reimbursements, Profile). This page is part of the Reimbursements module.\nRead first: the Developer notes for this page (this panel), the Shared platform rules in \"How to use these notes\", and the prototype (docs/prototypes/leave-prototype.html): open it and go to this page.\n\nWhat this page is: Reimbursement settings.\n\nBuild or change:\n- Reimbursement settings as described.\n\nRules for this run:\n- Reuse the existing components, design system, routing and data layer. Put business rules in tested functions, not in the component.\n- Don't ask me questions. Make the most reasonable choice, note it in docs/progress.md, and carry on.\n- Work on main, commit in small steps, run type-check, lint and tests, and fix what you break.\n\nDone when:\n- Behaviour matches the notes and the prototype on this page.\n- No console errors; type-check, lint, tests and the production build pass.\n\nReport: what changed (files), decisions, and each check pass/fail."}, "pay:settings:ess": {"title": "Payroll settings → ESS", "module": "ESS shell", "what": "Controls which ESS pages employees can see. Payslips and My pay stay hidden until the company turns them on.", "sections": [["What’s on the page", ["Panel \"What employees see in ESS\" (tooltip explains it). Two rows, each with a switch and a status line (Visible to employees / Hidden from employees):", "Payslips: monthly payslips in ESS. Off by default.", "My pay: salary structure, earnings, deductions and tax details in ESS. Off by default.", "Turning one on adds it to every employee’s ESS menu (and Payslips to the Overview quick tiles) straight away; turning it off hides it again. Nothing is deleted. Stored as settings.essShow = { payslips, mypay }."]], ["Rules", ["When hidden, the pages, menu items, Overview tiles and any direct links to them are hidden for employees and managers alike. The pages themselves belong to the Payroll service (not part of this prototype); only the visibility control is built here."]]], "prompt": "Build: Payroll settings → ESS\n\nAdd an \"ESS\" tab to Payroll settings with \"What employees see in ESS\": switches for Payslips and My pay (both off by default). When off, hide those ESS pages, menu items, Overview tiles and direct links for everyone; when on, show them. Store per company. Read the developer notes for this page and match the prototype (docs/prototypes/leave-prototype.html). Don't ask questions; log decisions in docs/progress.md; keep tests green."}}, "guide": {"intro": ["These notes follow you: open any page in the prototype, click \"Developer notes\", and you see what that page is, everything on it, its rules and the data it needs. Move to another page (or sub-tab) and the notes switch with you.", "At the bottom of every page’s notes is \"Build it with Claude\": a ready prompt for Claude Code that builds that page in the real code base. Copy it, paste it in, and it will read these notes and the prototype.", "We’re building ESS module by module: Leave first, then Attendance, then Timesheet, then Overtime, Reimbursements and Profile. Leave pages have the most detail. Other pages have notes too, but build them when their module comes up."], "read": ["The prototype has three areas in the left sidebar: ESS - Employee (an employee, Rohan Mehta), ESS - Manager (a manager and approver, Priya Nair) and Payroll (the admin/HR side, opened from the Payroll dashboard’s Quick actions).", "Demo controls (bottom right) change the scenario: tracking mode, employee dates and status, payroll processing, resetting data. They’re for demos only and must not ship. Developer notes are prototype-only too.", "Data in the prototype is fake and stored in your browser. The rules (balances, accruals, approvals) are real: build them the same way, as tested functions on the backend or the shared rules layer.", "When the notes and the prototype disagree, the notes win. If something isn’t covered, copy how the prototype behaves and write the decision down.", "Design: follow the Peko One design system (Figma: Peko One - Design System) on top of the Payroll antd theme. Primary #FF4F4F (tints #FFF2F2 / #FFE7E7 / #FFD6D6), neutral slate greys (#F8FAFC → #0F172A), success #43B75D, warning #F59E0B, error #EF4444; Roboto; headings 20/18/16 semibold, body 14, hints and tags 12. Buttons: primary solid red, secondary red outline, neutral grey outline, tertiary red text. Inputs: #E2E8F0 border, 8px radius, red focus ring. Page sections use underline tabs; filters use the compact segmented control.", "Help text: only core information is always on screen. Explanations, rules and examples go in a tooltip: a 13px grey info icon (antd InfoCircleOutlined, #8993A4) next to the field label, panel title or button, showing an antd Tooltip on hover or focus. This is the same pattern the Payroll code already uses (e.g. \"Rollout Salary\")."], "order": ["Leave module, in this order: Payroll settings → Leave (Leave types, Public holidays, Configuration, Approvals) → the leave rules (balances, accruals, probation, carry forward, sandwich, comp off) → ESS Leave (Overview, Apply, Leave type details, My requests + drawer, Public holidays) → approver views (My team Approvals and Leave calendar) → Payroll Leave (Overview, Leaves, Requests, Balances, Add leave) → links to Attendance and Timesheet (late deductions, leave rows).", "Settings come first because they decide how every other Leave screen behaves."], "shared": [["How to read the prototype", ["All business rules are plain functions in the prototype file (attOf, workedMins, dayStatus, expectedFor, otSuggestion, leaveYear, leaveBalances, leaveDayCount, l1For / l2For, personQueue, submitWeek, decideRequest, applyEffects). Port them as tested rules (src/prototype/rules or the backend). Screens should call the rules, never re-derive them.", "Demo personas: ESS - Employee = Rohan Mehta (ACME-002), ESS - Manager = Priya Nair. 21 employees, ACME-001 to ACME-021; ACME-021 (CEO) has no manager. Demo data is rebuilt each week and stored in localStorage.", "Times are shown in 12-hour format everywhere (9:30 AM). Inputs stay as time pickers. Dates as \"Tue 13 Oct\".", "The \"Demo controls\" and \"Developer notes\" buttons are prototype-only. Do not ship them."]], ["Tracking modes", ["Company setting: attendance only / timesheet only / attendance + timesheet / neither.", "Use two helpers everywhere: attOn = attendance or both; tsOn = timesheet or both. Never write \"not timesheet means attendance\", because \"neither\" breaks it.", "Neither: no attendance or timesheet UI at all (cards, recent days table, tabs, calendars). Leave, overtime and reimbursements still work."]], ["Approval engine (all request types)", ["Per function (attendance corrections, timesheets, overtime, leave, reimbursements) HR sets Level 1 and Level 2. Each can be: Reporting manager, Admin / HR (decided in Payroll), or a specific person. Level 2 can also be None (level 1 is final).", "Resolve the approvers when the item is submitted (and Level 2 again when Level 1 approves) and store them on the item. Changing settings later must not move items already in flight.", "No manager (CEO) or \"Reporting manager\" pointing at themselves: Level 1 is skipped.", "Actions at either level: Approve, Ask for update (comment required, goes straight back to the employee, status update_requested; resubmitting starts again at Level 1), Reject (requests only). Level 2 approval is final and runs the effects (attendance updated, leave applied, deduction reversed, etc).", "Queues: items waiting on a person appear in that person’s My team → Approvals. Items waiting on a team appear in Payroll → {service} → Requests. Payroll can see items sitting with people (read-only) and send a Remind notification.", "Leave cancellation and comp off requests use the leave approvers. Profile updates go straight to HR (no manager).", "Request statuses: pending_l1, pending_l2, update_requested, approved, rejected, withdrawn, cancelled (approved leave that was cancelled)."]], ["Payroll month", ["There is no month lock. Processing payroll only records the month as paid. Anything changed afterwards (leave, timesheets, attendance) is picked up by the next payroll. Loss of pay and retro adjustments are owned by the payroll team.", "Payroll for a month can only be processed when every timesheet period in it is Approved (when timesheet approval is on)."]], ["Employee working days", ["The prototype uses company-wide weekly offs. The real build must use each employee’s own working days and shift (the per-employee schedule already in the latest code) for: late marks, hours targets, leave day counts, half days, the sandwich rule, calendars and comp off eligibility."]]], "kickoff": "Kickoff: Leave module\n\nWe are building the ESS service module by module, starting with Leave (then Attendance, Timesheet, Overtime, Reimbursements, Profile).\n\nBefore writing any code:\n1. Open the prototype (docs/prototypes/leave-prototype.html) in a browser. Click through ESS - Employee → Leave, ESS - Manager → My team, and Payroll → Leave and Payroll settings → Leave. On each page open \"Developer notes\" and read the notes for that page, and \"How to use these notes\" for the shared rules.\n2. Find where leave lives in this code base today (Payroll → Employee Leaves, Payroll settings → Leave Policies, ESS → Leaves) and how data is loaded (API or mock layer).\n3. Write docs/leave/plan.md: the screens to build or change, the rules to implement as tested functions, the data model and endpoints needed, how existing leave policy data maps to the new model, and the build order (settings → rules → ESS → approvers → Payroll → attendance/timesheet links).\n4. Then build in that order, page by page, using the \"Build it with Claude\" prompt from each page’s notes.\n\nRules: don’t ask me questions (make the reasonable choice and log it in docs/progress.md), work on main, small commits, keep type-check/lint/tests green, and keep each employee’s own working days in every leave day count."}};
