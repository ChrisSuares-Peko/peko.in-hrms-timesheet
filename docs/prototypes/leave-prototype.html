<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peko Attendance & Timesheet prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --surface-2:#FAFAFB; --ink:#101828; --ink-2:#475467; --muted:#8A94A6;
  --line:#EAECF0; --line-2:#D0D5DD;
  --red:#E30000; --red-hover:#C40000; --red-soft:#FEF2F2; --red-ink:#B42318;
  --green:#05A357; --green-soft:#E7F8EE; --green-ink:#067647;
  --amber:#FDA700; --amber-soft:#FFF6E0; --amber-ink:#93370D;
  --blue:#2E62E8; --blue-soft:#EEF3FF; --blue-ink:#1D3F9E;
  --track:#F0F2F5; --entry:#344054; --entry-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.06);
  --overlay:rgba(16,24,40,.45);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1116; --surface:#161A21; --surface-2:#1B2029; --ink:#E7EAF0; --ink-2:#B4BCC9; --muted:#7D8696;
    --line:#262C37; --line-2:#363D4A;
    --red:#FF4545; --red-hover:#FF6161; --red-soft:#3A1717; --red-ink:#FFB4AB;
    --green:#2BC77A; --green-soft:#12301F; --green-ink:#8BE3B5;
    --amber:#FDB022; --amber-soft:#33270E; --amber-ink:#FEC84B;
    --blue:#6E95FF; --blue-soft:#172440; --blue-ink:#AFC4FF;
    --track:#1F2530; --entry:#9AA7BD; --entry-ink:#0E1116;
    --shadow:0 1px 2px rgba(0,0,0,.4);
    --overlay:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1116; --surface:#161A21; --surface-2:#1B2029; --ink:#E7EAF0; --ink-2:#B4BCC9; --muted:#7D8696;
  --line:#262C37; --line-2:#363D4A;
  --red:#FF4545; --red-hover:#FF6161; --red-soft:#3A1717; --red-ink:#FFB4AB;
  --green:#2BC77A; --green-soft:#12301F; --green-ink:#8BE3B5;
  --amber:#FDB022; --amber-soft:#33270E; --amber-ink:#FEC84B;
  --blue:#6E95FF; --blue-soft:#172440; --blue-ink:#AFC4FF;
  --track:#1F2530; --entry:#9AA7BD; --entry-ink:#0E1116;
  --shadow:0 1px 2px rgba(0,0,0,.4); --overlay:rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Roboto,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* shell */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:22px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.logo{font-weight:700;font-size:24px;letter-spacing:-.5px;padding:0 14px 22px;display:flex;align-items:center;gap:8px}
.logo-mark{width:22px;height:22px;border-radius:4px;background:var(--ink);position:relative}
.logo-mark::after{content:"";position:absolute;right:-3px;bottom:-3px;width:10px;height:10px;background:var(--red);border-radius:2px}
.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:10px 14px;border-radius:8px;color:var(--ink-2);font-weight:500}
.nav:hover{background:var(--surface-2)}
.nav[aria-current="page"]{background:var(--red-soft);color:var(--red-ink)}
.nav svg{width:18px;height:18px;flex:none}
.nav .count{margin-left:auto;background:var(--red);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px;font-weight:500}
.side-foot{margin-top:auto;padding:12px 14px;font-size:12px;color:var(--muted)}
.main{min-width:0;display:flex;flex-direction:column}
.top{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;gap:16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top h1{font-size:18px;margin:0;font-weight:500}
.top .sub{color:var(--muted);font-size:13px}
.who{margin-left:auto;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:6px 12px 6px 6px}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:500;font-size:13px;background:var(--red-soft);color:var(--red-ink);flex:none}
.who b{display:block;font-size:13px;font-weight:500}
.who span{display:block;font-size:12px;color:var(--muted)}
.content{padding:20px 28px 96px;max-width:1240px;width:100%}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;color:var(--ink-2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tab[aria-selected="true"]{color:var(--red);border-bottom-color:var(--red)}
.tab .n{background:var(--track);color:var(--ink-2);border-radius:10px;padding:0 7px;font-size:12px}
.tab[aria-selected="true"] .n{background:var(--red-soft);color:var(--red-ink)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 14px;font-weight:500;color:var(--ink-2);border-right:1px solid var(--line-2)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

/* basics */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.pad{padding:18px 20px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted)}
.small{font-size:12px}
h2{font-size:16px;font-weight:500;margin:0}
h3{font-size:14px;font-weight:500;margin:0}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:var(--red-hover)}
.btn.good{background:var(--green);border-color:var(--green);color:#fff}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2);padding:6px 8px}
.btn.ghost:hover{background:var(--track)}
.btn.link{border:0;background:none;padding:0;color:var(--blue);font-weight:500}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--track);color:var(--ink-2)}
.chip.green{background:var(--green-soft);color:var(--green-ink)}
.chip.red{background:var(--red-soft);color:var(--red-ink)}
.chip.amber{background:var(--amber-soft);color:var(--amber-ink)}
.chip.blue{background:var(--blue-soft);color:var(--blue-ink)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.banner{border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;margin-bottom:14px;border:1px solid}
.banner.red{background:var(--red-soft);border-color:transparent;color:var(--red-ink)}
.banner.amber{background:var(--amber-soft);border-color:transparent;color:var(--amber-ink)}
.banner.blue{background:var(--blue-soft);border-color:transparent;color:var(--blue-ink)}
.banner.grey{background:var(--track);border-color:transparent;color:var(--ink-2)}
.banner b{font-weight:500}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:13px;color:var(--ink-2);font-weight:500}
.input{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%}
textarea.input{min-height:76px;resize:vertical}
.err{color:var(--red-ink);font-size:12px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2)}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.scroll-x{overflow-x:auto}

/* timesheet */
.ts-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.weekbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.weekbar .range{font-size:16px;font-weight:500;min-width:170px}
.day{display:grid;grid-template-columns:118px minmax(0,1fr);gap:16px;padding:16px 18px;border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:0}
.day.off{background:var(--surface-2)}
.day.today .dname{color:var(--red)}
.dname{font-weight:500}
.dsub{font-size:12px;color:var(--muted)}
.win{font-size:12px;color:var(--ink-2);margin-bottom:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.track{position:relative;height:18px;background:var(--track);border-radius:4px;margin-bottom:6px;overflow:hidden}
.track .w{position:absolute;top:0;bottom:0;background:var(--blue-soft);border-left:2px solid var(--blue);border-right:2px solid var(--blue)}
.track .seg-in{position:absolute;top:4px;bottom:4px;background:var(--entry);border-radius:2px}
.track .seg-out{position:absolute;top:4px;bottom:4px;border-radius:2px;background:repeating-linear-gradient(135deg,var(--amber) 0 4px,#FFD27A 4px 8px)}
.ticks{position:relative;height:14px;font-size:10px;color:var(--muted);margin-bottom:8px}
.ticks span{position:absolute;transform:translateX(-50%)}
.entry{display:grid;grid-template-columns:118px 58px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-top:1px dashed var(--line)}
.entry:first-of-type{border-top:0}
.entry .t{font-variant-numeric:tabular-nums;font-weight:500}
.entry .d{color:var(--ink-2);font-variant-numeric:tabular-nums}
.entry .desc{min-width:0;overflow-wrap:anywhere}
.entry .acts{display:flex;gap:2px}
.ot{margin-top:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--amber-soft);color:var(--amber-ink);border-radius:8px;padding:8px 10px;font-size:13px}
.ot b{font-weight:500}
.editor{display:grid;grid-template-columns:110px 110px minmax(0,1fr) auto;gap:8px;align-items:start;padding:8px 0}
.editor .err{grid-column:1/-1}
.addline{margin-top:6px}
.empty-day{color:var(--muted);font-size:13px;padding:2px 0}
.lockline{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:4px}
.card{position:sticky;top:84px}
.card .big{font-size:22px;font-weight:500;letter-spacing:-.3px}
.bars{display:flex;flex-direction:column;gap:7px;margin:14px 0}
.bar{display:grid;grid-template-columns:34px 1fr 64px;gap:8px;align-items:center;font-size:12px}
.bar .b{height:6px;background:var(--track);border-radius:3px;overflow:hidden;position:relative}
.bar .b i{position:absolute;left:0;top:0;bottom:0;background:var(--ink-2);border-radius:3px}
.bar .b i.over{background:var(--amber)}
.bar .v{text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}
.divider{height:1px;background:var(--line);margin:14px 0}
.hist{list-style:none;margin:0;padding:0}
.hist li{padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;display:grid;grid-template-columns:86px 1fr;gap:10px}
.hist li:last-child{border-bottom:0}

/* diff */
.diffday{padding:12px 0;border-bottom:1px solid var(--line)}
.diffday:last-child{border-bottom:0}
.drow{display:grid;grid-template-columns:20px 120px 1fr;gap:8px;padding:6px 8px;border-radius:6px;margin-top:4px;font-size:13px}
.drow.add{background:var(--green-soft);color:var(--green-ink)}
.drow.del{background:var(--red-soft);color:var(--red-ink)}
.drow.del .x{text-decoration:line-through}
.drow.edit{background:var(--amber-soft);color:var(--amber-ink)}
.old{text-decoration:line-through;opacity:.75}

/* requests */
.req{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line)}
.req:last-child{border-bottom:0}
.req .title{font-weight:500}
.chain{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:12px}
.step{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;background:var(--track);color:var(--ink-2)}
.step.done{background:var(--green-soft);color:var(--green-ink)}
.step.pending{background:var(--blue-soft);color:var(--blue-ink)}
.step.rejected{background:var(--red-soft);color:var(--red-ink)}
.step.skipped{background:transparent;border:1px dashed var(--line-2);color:var(--muted)}
.arrow{color:var(--muted)}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-weight:500;margin-bottom:4px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.stat{padding:14px 16px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:22px;font-weight:500;margin-top:2px}
.headline{display:flex;align-items:baseline;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.headline .num{font-size:34px;font-weight:700;letter-spacing:-1px}

/* settings */
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mode{border:1px solid var(--line-2);border-radius:10px;padding:14px;text-align:left;background:var(--surface)}
.mode[aria-pressed="true"]{border-color:var(--red);box-shadow:0 0 0 1px var(--red);background:var(--red-soft)}
.mode b{display:block;font-weight:500;margin-bottom:4px}
.mode span{color:var(--ink-2);font-size:13px}
.setgrid{display:grid;gap:16px}

/* modal + toast + demo */
.overlay{position:fixed;inset:0;background:var(--overlay);display:grid;place-items:center;padding:20px;z-index:50}
.modal{background:var(--surface);border-radius:14px;width:min(560px,100%);max-height:calc(100vh - 40px);overflow:auto;box-shadow:0 20px 50px rgba(16,24,40,.25)}
.modal.wide{width:min(980px,100%)}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--surface);z-index:1}
.modal-b{padding:18px 20px}
.modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--surface)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:500;z-index:60;box-shadow:var(--shadow)}
.demo{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.demo-pop{width:300px;padding:16px}
.demo-btn{background:var(--ink);color:var(--surface);border:0;border-radius:999px;padding:10px 16px;font-weight:500;box-shadow:var(--shadow)}

@media (max-width:1020px){
  .ts-layout{grid-template-columns:1fr}
  .card{position:static;order:-1}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;padding:8px 10px;overflow-x:auto;z-index:10;border-right:0;border-bottom:1px solid var(--line);top:env(safe-area-inset-top,0px)}
  .logo{padding:0 10px 0 4px;font-size:20px}
  .side-foot{display:none}
  .nav{width:auto;white-space:nowrap}
  .top{position:static;padding:12px 16px;flex-wrap:wrap}
  .who{margin-left:0}
  .content{padding:16px 14px 96px}
  .day{grid-template-columns:1fr;gap:6px;padding:14px}
  .entry{grid-template-columns:96px 52px minmax(0,1fr);}
  .entry .acts{grid-column:1/-1;justify-content:flex-end}
  .editor{grid-template-columns:1fr 1fr}
  .editor .input.desc{grid-column:1/-1}
  .modes{grid-template-columns:1fr}
  .req{grid-template-columns:1fr}
  .demo-pop{width:min(300px,calc(100vw - 40px))}
}

/* v2 additions */
.crumb{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:13px;color:var(--muted)}
.crumb button{border:0;background:none;color:var(--blue);padding:0;font-weight:500}
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px;text-align:left;min-height:168px}
.hcard.link{cursor:pointer}
.hcard.link:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.hcard .hk{font-weight:500;font-size:15px;display:flex;align-items:center;gap:8px}
.hcard .hv{font-size:20px;font-weight:500;letter-spacing:-.3px}
.hcard .hs{color:var(--ink-2);font-size:13px}
.hcard .hf{margin-top:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hcard.feature{border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset}
.hcard.dim{opacity:.6}
.viewbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.viewbar .range{font-size:16px;font-weight:500;min-width:150px}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal-h{font-size:12px;color:var(--muted);padding:8px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface-2)}
.cal-cell{min-height:88px;padding:8px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:4px;border-top:0;border-left:0;font:inherit;color:inherit;cursor:pointer}
.cal-cell:hover{background:var(--surface-2)}
.cal-cell.out{background:var(--surface-2);color:var(--muted);cursor:default}
.cal-cell.sel{box-shadow:inset 0 0 0 2px var(--red)}
.cal-cell .dn{font-size:12px;font-weight:500}
.cal-cell.today .dn{color:var(--red)}
.cal-cell .cv{font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
.cal-cell .cs{font-size:11px;color:var(--ink-2);line-height:1.3}
.mini{display:inline-flex;align-items:center;gap:4px;font-size:11px;border-radius:999px;padding:1px 7px;font-weight:500;width:max-content;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini.present{background:var(--green-soft);color:var(--green-ink)}
.mini.late,.mini.half,.mini.ot{background:var(--amber-soft);color:var(--amber-ink)}
.mini.absent{background:var(--red-soft);color:var(--red-ink)}
.mini.leave,.mini.holiday,.mini.open{background:var(--blue-soft);color:var(--blue-ink)}
.mini.off,.mini.offwork,.mini.notin{background:var(--track);color:var(--ink-2)}
.mini.offwork{background:var(--amber-soft);color:var(--amber-ink)}

.split{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.todaybox{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.todaybox .clock{font-size:28px;font-weight:500;letter-spacing:-.5px;font-variant-numeric:tabular-nums}

.daystrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:12px}
.daystrip button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--ink-2)}
.daystrip button b{font-size:15px;font-weight:500;color:var(--ink)}
.daystrip button[aria-pressed="true"]{border-color:var(--red);background:var(--red-soft)}
.daystrip button[aria-pressed="true"] b{color:var(--red-ink)}
.daybig .track{height:26px}
.daybig .day{grid-template-columns:1fr}

/* ===================== Peko design language (antd v5 + Peko tokens) =====================
   Source: Peko-IN-Frontend src/antd.config.tsx, src/whitelabel/peko.ts, tailwind.config.js, Payroll pages.
   colorPrimary #FF4F4F (hover #E53E3E, active #B91C1C) · text #0F172A · Roboto · controls 36px · radius 6 (controls), 8 (cards) */
:root,:root[data-theme="light"]{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F8FAFC; --ink:#0F172A; --ink-2:#475569; --muted:#64748B;
  --line:#E2E8F0; --line-2:#CBD5E1;
  --red:#FF4F4F; --red-hover:#E53E3E; --red-active:#B91C1C; --red-soft:#FFF2F2; --red-ink:#B91C1C; --red-border:#FFD6D6;
  --green:#43B75D; --green-soft:#ECF8EF; --green-ink:#308242;
  --amber:#FAAD14; --amber-soft:#FFFBEB; --amber-ink:#B45309;
  --blue:#1677FF; --blue-soft:#E6F4FF; --blue-ink:#0958D9;
  --track:#F1F5F9; --entry:#0F172A; --entry-ink:#FFFFFF;
  --shadow:0px 1px 12px 1px rgba(122,122,122,.06);
  --overlay:rgba(0,0,0,.45);
  --cal-ok:#ECF8EF; --cal-ok-ink:#308242;
}
body{font-family:Roboto,system-ui,Avenir,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5715;color:#0F172A;background:#FFFFFF}

/* app shell: antd Menu sidebar + white header */
.side{background:#FFFFFF;border-right:1px solid #F1F5F9;padding:20px 14px}
.logo{font-size:26px;font-weight:700;letter-spacing:-.5px;color:#0F172A;padding:4px 10px 18px}
.nav{height:44px;padding:0 16px;border-radius:8px;color:#64748B;font-weight:400;font-size:14px}
.nav:hover{background:#FFFCFC;color:#0F172A}
.nav[aria-current="page"],.nav[aria-expanded="true"]{background:#FFF2F2;color:#FF4F4F;font-weight:500}
.nav .count{background:#FF4F4F}
.subnav{padding:4px 0 8px}
.subnav-i{height:36px;padding:0 16px 0 34px;border-radius:8px;color:#475569;font-size:14px;display:flex;align-items:center;width:100%}
.subnav-i:hover{background:#FFFCFC;color:#0F172A}
.subnav-i[aria-current="page"]{background:#FFF2F2;color:#FF4F4F;font-weight:500}
.side-foot{color:#9C9DA1}
.top{background:#FFFFFF;border-bottom:1px solid #F1F5F9;padding:16px 32px;min-height:72px}
.top h1{font-size:20px;font-weight:500;color:#0F172A}
.top .sub{color:#64748B;font-size:14px}
.content{padding:24px 32px 96px;max-width:1320px}
.crumb{font-size:14px;color:#64748B}
.crumb button{color:#FF4F4F;font-weight:400}

/* typography */
h2{font-size:18px;font-weight:500;color:#0F172A}
h3{font-size:16px;font-weight:500;color:#0F172A}
.muted,.small.muted{color:#64748B}
.small{font-size:13px}

/* buttons: antd Button (radius 6, 36px) */
.btn{height:36px;padding:0 15px;border-radius:6px;border:1px solid #CBD5E1;background:#FFFFFF;color:#0F172A;font-weight:400;font-size:14px;box-shadow:0 2px 0 rgba(0,0,0,.02);transition:color .2s,border-color .2s,background .2s;justify-content:center}
.btn:hover{background:#FFFFFF;border-color:#E53E3E;color:#E53E3E}
.btn:active{border-color:#B91C1C;color:#B91C1C}
.btn.primary{background:#FF4F4F;border-color:#FF4F4F;color:#FFFFFF;box-shadow:0 2px 0 rgba(255,58,58,.1)}
.btn.primary:hover{background:#E53E3E;border-color:#E53E3E;color:#FFFFFF}
.btn.primary:active{background:#B91C1C;border-color:#B91C1C}
.btn.good{background:#FFFFFF;border-color:#43B75D;color:#43B75D}
.btn.good:hover{background:#ECF8EF;border-color:#43B75D;color:#308242}
.btn.ghost{border-color:transparent;background:transparent;box-shadow:none;color:#475569;padding:0 8px}
.btn.ghost:hover{background:rgba(0,0,0,.06);color:#0F172A;border-color:transparent}
.btn.link{height:auto;border:0;box-shadow:none;background:none;padding:0;color:#FF4F4F;font-weight:400}
.btn.link:hover{color:#E53E3E;background:none}
.btn.sm{height:28px;padding:0 10px;font-size:13px;border-radius:4px}
.btn.sm.link{height:auto;padding:0}
.btn:disabled,.btn:disabled:hover{background:rgba(0,0,0,.04);border-color:#CBD5E1;color:rgba(0,0,0,.25);box-shadow:none;opacity:1;cursor:not-allowed}
.btn.link:disabled{background:none}

/* inputs: antd Input / Select / DatePicker */
.input{height:36px;padding:4px 11px;border:1px solid #CBD5E1;border-radius:6px;background:#FFFFFF;color:#0F172A;font-size:14px;transition:border-color .2s,box-shadow .2s}
.input:hover{border-color:#E53E3E}
.input:focus{outline:0;border-color:#FF4F4F;box-shadow:0 0 0 2px rgba(255,58,58,.1)}
.input:disabled{background:rgba(0,0,0,.04);color:rgba(0,0,0,.25);border-color:#CBD5E1}
textarea.input{height:auto;min-height:76px;padding:6px 11px}
select.input{padding-right:28px}
.input::placeholder{color:#94A3B8}
.field{gap:6px;margin-bottom:16px}
.field label{font-size:14px;color:#0F172A;font-weight:400}
.err{color:#DC2626}
input[type="checkbox"]{accent-color:#FF4F4F;width:16px;height:16px}

/* tabs: antd Tabs (line) */
.tabs{gap:32px;border-bottom:1px solid #F1F5F9;margin-bottom:24px}
.tab{padding:12px 0;color:#0F172A;font-weight:400;font-size:14px;border-bottom-width:2px}

function BarTrack({ win, list }) {
  const segs = [];
  (list || []).filter(timed).forEach(e => {
    const a = eS(e), b = eE(e);
    if (e.isBreak) { segs.push({ a, b, brk: true, e }); return; }
    if (e.isLeave) { segs.push({ a, b, lvx: true, e }); return; }
    if (win.start == null) { segs.push({ a, b, out: true, e }); return; }
    if (a < win.start) segs.push({ a, b: Math.min(b, win.start), out: true, e });
    const ia = Math.max(a, win.start), ib = Math.min(b, win.end);

  </div>`;
}

      const w = markEdited(s, emp.id, mondayOf(k), emp.name, k); const list = w.entries[k] || [];
      w.entries[k] = entry.id ? list.map(e => e.id === entry.id ? entry : e) : list.concat([Object.assign({}, entry, { id: 'e' + (s.seq++) })]);
    });
  };
  const del = (k, id) => {
    if (draft && draft.ws === mondayOf(k)) { setDraft(prev => { const d = clone(prev); d.entries[k] = (d.entries[k] || []).filter(e => e.id !== id); return d; }); return; }
    update(s => { const w = markEdited(s, emp.id, mondayOf(k), emp.name, k); w.entries[k] = (w.entries[k] || []).filter(e => e.id !== id); });
  };
  const p = periodOf(store, emp, view, cursor, entriesFor);
  const step = n => { setSel(null); setCursor(view === 'day' ? addDays(cursor, n) : view === 'week' ? addDays(cursor, 7 * n) : firstOf(addMonths(monthOf(cursor), n))); };
  const pick = k => { setCursor(k); setSel(view === 'day' ? null : k); };
  const changeView = v => { setView(v); if (v === 'day') { setCursor(sel || cursor); setSel(null); } };
  const totLogged = p.days.reduce((t, k) => t + sumMins(entriesFor(k)), 0);
  const totExp = p.days.reduce((t, k) => t + expectedFor(store, emp, k), 0);
  const wks = p.days.map(k => workedFor(store, emp, k));
  const totWorked = wks.reduce((t, w) => t + (w.mins || 0), 0);
  const unknownDays = wks.filter(w => w.kind === 'unknown').length;
  const ofWord = store.settings.mode === 'timesheet' ? 'shift' : 'worked';
  const onOT = (k, o) => setOtModal({ k, o, mins: o.extra });
  const onFix = store.settings.mode === 'both' ? (k, pr) => setFix({ k, prefill: pr }) : null;

  const allLocked = weekDays(fws).every(k => isLocked(store, k));
  const editingThis = draft && draft.ws === fws;
  const pendingChanges = editingThis ? diffEntries(fweek.approved || fweek.entries, draft.entries) : [];
  let statusLine, actions = null;
  const lastSub = fweek.history.slice().reverse().find(h => /submit/i.test(h.text));
  const autoTxt = 'Auto-submits ' + DAY_LONG[store.settings.submitDay] + ' at ' + t12(store.settings.submitTime || '23:00') + '.';
  const mgrName = mgr ? mgr.name : 'HR';
  if (!appr) statusLine = 'Approval is off. ' + (mgr ? mgr.name : 'Your manager') + ' can see your timesheet, and you can edit it until payroll is processed.';
  else if (allLocked) statusLine = 'Payroll is processed for this period, so it can’t be changed.';
  else if (fweek.status === 'rejected') statusLine = mgrName + ' sent it back: ' + fweek.comment + ' Fix it, then submit again.';
  else if (fweek.status === 'draft') statusLine = (fweek.baseline ? 'Edited after it was sent. Submit again to get it re-approved. ' : 'Draft. ') + 'Changes save automatically. ' + autoTxt;
  else if (fweek.status === 'submitted') statusLine = 'With ' + mgrName + (lastSub ? ' since ' + fmtShort(lastSub.at) : '') + '. You can still edit it, but it goes back to draft and needs submitting again.';
  else if (fweek.status === 'with_payroll') statusLine = 'Approved by ' + mgrName + ', now with Payroll. Editing moves it back to draft.';
  else statusLine = 'Approved. You can still edit it until payroll is processed; edits need submitting again.';
  actions = null; // submitting happens from the view bar

  // timesheet notices: things that need the employee's attention, across all weeks
  const notices = [];
  const openWeek = (ws, day) => { setDraft(null); const w = store.weeks[emp.id + '|' + ws]; const d = day || (w && w.dirty && Object.keys(w.dirty).sort()[0]) || weekDays(ws).find(k => !isOff(k)) || ws; setView('day'); setCursor(d); setSel(null); };
  if (appr) Object.keys(store.weeks).filter(x => x.startsWith(emp.id + '|')).sort().forEach(x => { const ws = x.split('|')[1]; const w = store.weeks[x]; if (ws === fws) return;
    if (w.status === 'rejected') notices.push({ id: 'sb' + ws, tone: 'back', title: 'Week of ' + fmtShort(ws) + ' sent back', text: w.comment, btn: 'Go to day', go: () => openWeek(ws) });
    else if (w.change) notices.push({ id: 'ch' + ws, tone: 'info', title: 'Change waiting · week of ' + fmtShort(ws), text: 'With ' + (mgr ? mgr.name : 'HR') + '. ' + w.change.reason, btn: 'Go to day', go: () => openWeek(ws) }); });
  { const pd = store.settings.mode === 'both' ? openSessionBefore(store, emp, TODAY) : null; if (pd && onGoTab) notices.push({ id: 'open' + pd, tone: 'info', title: 'Still checked in from ' + fmtDate(pd), text: 'Check out of that day before you check in today, then request a correction if needed.', btn: 'Go to attendance', go: () => onGoTab('attendance') }); }
  { let n = 0, m = 0; for (let i = 1; i <= 35; i++) { const d = addDays(TODAY, -i); if (isLocked(store, d)) continue; const o = otSuggestion(store, emp, d); if (o && !otRequestFor(store, emp.id, d)) { n++; m += o.extra; } }
    if (n && onGoTab) notices.push({ id: 'ot', tone: 'amber', title: dur(m) + ' of overtime not claimed', text: n + ' day' + (n === 1 ? '' : 's') + ' beyond your standard hours.', btn: 'Review overtime', go: () => onGoTab('overtime') }); }
  return html`<div>
    <div className="ts-top">
      <${Calendar3} emp=${emp} cursor=${cursor} sel=${view === 'day' ? cursor : sel} rangeFn=${p.rangeFn} onPick=${pick}
        onShift=${n => { setCursor(firstOf(addMonths(monthOf(cursor), n))); setSel(null); }} onToday=${() => { setCursor(TODAY); setSel(view === 'day' ? null : TODAY); }} />
      <div className="ts-notices">
        <section className="panel ts-notices-in" aria-label="Notices">
          <div className="pad" style=${{ paddingBottom: '8px' }}><div className="row"><h3>Notices</h3><span className="spacer"></span>${notices.length ? html`<span className="chip red">${notices.length} to do</span>` : null}</div></div>
          <div className="ts-notices-body">
            <div className="nt-week">
              <div className="row"><b>Week of ${fmtShort(fws)}</b><span className="spacer"></span><${WeekChip} w=${fweek} /></div>
              <div className="small" style=${{ margin: '6px 0', color: 'var(--ink-2)' }}>${statusLine}</div>
              ${actions && html`<div className="row" style=${{ gap: '6px' }}>${kids(actions)}</div>`}
            </div>
            ${notices.length > 0 && html`<div className="ov-grp">Needs your action</div>`}
            ${notices.map(x => html`<div key=${x.id} className=${'ov-note act ' + x.tone}><div><b>${x.title}</b><div className="small">${x.text}</div></div><button className="btn sm" onClick=${x.go}>${x.btn}</button></div>`)}
            <div className="ov-grp">Unlogged hours</div>
            <${UnloggedList} emp=${emp} days=${p.days} entriesFor=${entriesFor} view=${view} onPick=${k => { if (view === 'day') setCursor(k); else setSel(k); }} />
            ${appr && fweek.history.length > 0 && html`<div><div className="ov-grp">History</div><${HistoryInline} key=${fws} week=${fweek} /></div>`}
          </div>
        </section>
      </div>
    </div>
    <div className="viewbar" style=${{ marginTop: '18px' }}>
      <${Seg} label="View" value=${view} onChange=${changeView} options=${[['day', 'Day'], ['week', 'Week'], ['month', 'Month']]} />
      <button className="btn sm" aria-label="Previous" onClick=${() => step(-1)}>‹</button>
      <span className="range">${p.label}</span>
      <button className="btn sm" aria-label="Next" onClick=${() => step(1)}>›</button>
      ${appr ? html`<button className="btn sm primary" onClick=${() => setSubAsk(true)}>Submit</button>` : null}
      <span className="spacer"></span>
      <span className="small" style=${{ color: 'var(--ink-2)' }}>Logged <b style=${{ fontWeight: 500 }}>${dur(totLogged)}</b> of ${dur(totWorked)} ${ofWord}${unknownDays ? ' (' + unknownDays + ' day' + (unknownDays === 1 ? '' : 's') + ' not known)' : ''}</span>
      <button className="btn sm" onClick=${() => setTpl(true)}>Download timesheet</button>
      <button className="btn sm" onClick=${() => setUp(true)}>Upload timesheet</button>
      ${editingThis && html`<span className="chip amber">Editing a change</span>`}
      ${showProposed && fweek.change && !editingThis && html`<span className="chip amber">Showing your proposed changes</span>`}
    </div>
    <${DayLines} emp=${emp} days=${p.days} entriesFor=${entriesFor} view=${view} sel=${sel} onToggle=${k => { if (view !== 'day') setSel(sel === k ? null : k); }}
      panel=${k => html`<${EntriesPanel} emp=${emp} k=${k} list=${entriesFor(k)} editable=${canEdit(k)} onSave=${save} onDelete=${del} onRequestOT=${draft ? null : onOT} onFix=${draft ? null : onFix} />`} />
    ${askReason && html`<${CommentModal} title="Send change for approval" label=${'Why are you changing this week? ' + (mgr ? mgr.name : 'HR') + ' will see this.'} confirm="Send for approval" required onClose=${() => setAskReason(false)}
      onSubmit=${reason => { update(s => { const w = writeWeek(s, emp.id, draft.ws);
        if (!emp.mgr) { w.entries = clone(draft.entries); w.approved = clone(draft.entries); hist(w, TODAY, emp.name, 'Changed an approved week. Auto-approved (no reporting manager): ' + reason); }
        else { w.change = { entries: clone(draft.entries), reason, at: TODAY, by: emp.name }; hist(w, TODAY, emp.name, 'Requested a change: ' + reason); } });
        setDraft(null); setAskReason(false); notify('Change sent to ' + (mgr ? mgr.name : 'HR')); }} />`}
    ${otModal && html`<${OvertimeModal} emp=${emp} prefill=${otModal} onClose=${() => setOtModal(null)} />`}
    ${fix && html`<${AttendanceFixModal} emp=${emp} k=${fix.k} prefill=${fix.prefill} onClose=${() => setFix(null)} />`}
    ${tpl && html`<${DownloadModal} emp=${emp} onClose=${() => setTpl(false)} />`}
    ${subAsk && html`<${SubmitViewModal} emp=${emp} view=${view} label=${p.label} days=${p.days} onClose=${() => setSubAsk(false)} />`}
    ${up && html`<${UploadModal} emp=${emp} onClose=${() => setUp(false)} />`}
  </div>`;
}

  const p = periodOf(store, emp, view, cursor, entriesFor);

  const fws = mondayOf(focus);
  const step = n => { setSel(null); setCursor(view === 'day' ? addDays(cursor, n) : view === 'week' ? addDays(cursor, 7 * n) : firstOf(addMonths(monthOf(cursor), n))); };
  const totLogged = p.days.reduce((t, k) => t + sumMins(entriesFor(k)), 0);
  const totExp = p.days.reduce((t, k) => t + expectedFor(store, emp, k), 0);
  const wks = p.days.map(k => workedFor(store, emp, k));
  const totWorked = wks.reduce((t, w) => t + (w.mins || 0), 0);

        onShift=${n => { setCursor(firstOf(addMonths(monthOf(cursor), n))); setSel(null); }} onToday=${() => { setCursor(TODAY); setSel(view === 'day' ? null : TODAY); }} />
      <div className="ts-side">
        ${statusFor(fws)}
        <${UnloggedCard} emp=${emp} days=${p.days} entriesFor=${entriesFor} view=${view} who=${first(emp.name)} onPick=${k => { if (view === 'day') setCursor(k); else setSel(k); }} />
        ${approvalOn(store) && html`<${HistoryCard} key=${fws} week=${readWeek(store, emp.id, fws)} />`}
      </div>
    </div>
    <div className="viewbar" style=${{ marginTop: '18px' }}>
      <${Seg} label="View" value=${view} onChange=${v => { setView(v); if (v === 'day') { setCursor(sel || cursor); setSel(null); } }} options=${[['day', 'Day'], ['week', 'Week'], ['month', 'Month']]} />
      <button className="btn sm" aria-label="Previous" onClick=${() => step(-1)}>‹</button>

    </div>
    <${DayLines} emp=${emp} days=${p.days} entriesFor=${entriesFor} view=${view} sel=${sel} onToggle=${k => { if (view !== 'day') setSel(sel === k ? null : k); }}
      panel=${k => html`<${EntriesPanel} emp=${emp} k=${k} list=${entriesFor(k)} editable=${false} onSave=${() => {}} onDelete=${() => {}} />`} />
  </div>`;
}
function weekStatusText(store, emp, w) {
  const mgr = emp.mgr ? EMAP[emp.mgr] : null;
  if (!approvalOn(store)) return 'Approval is off for timesheets.';
  if (w.change) return 'Asked to change this approved week: ' + w.change.reason;
  if (w.status === 'submitted') { const sub = w.history.slice().reverse().find(h => /submit/i.test(h.text)); return 'Submitted' + (sub ? ' on ' + fmtShort(sub.at) : '') + '. Waiting for ' + (mgr ? mgr.name : 'approval') + '.'; }
  if (w.status === 'approved') return 'Approved.';
  if (w.status === 'rejected') return 'Sent back: ' + w.comment;
  return 'Not submitted yet.';
}
function TimesheetViewer({ emp, start, startView, onClose, onReview }) {
  const { store } = useApp();
  return html`<${Modal} wide title=${emp.name + "'s timesheet"} onClose=${onClose} footer=${[html`<button key="c" className="btn" onClick=${onClose}>Close</button>`]}>
    <${TimesheetBrowser} emp=${emp} start=${start} startView=${startView}

          <div className="small" style=${{ margin: '8px 0', color: 'var(--ink-2)' }}>${weekStatusText(store, emp, w)}</div>
          ${pending && onReview ? html`<button className="btn sm primary" onClick=${() => onReview({ id: emp.id, ws, kind: w.change ? 'change' : 'week' })}>${w.change ? 'Review change' : 'Review and approve'}</button>` : null}</section>`; }} />
  <//>`;
}
function WeekReview({ item, mgr, onClose, level }) {
  const { store, update, notify } = useApp();
  const emp = EMAP[item.id];
  const w = readWeek(store, item.id, item.ws);
  const lvl = item.level || level || 1;
  const isChange = !!w.baseline;
  const [tab, setTab] = useState(isChange ? 'changes' : 'sheet');
  const [rejecting, setRejecting] = useState(false);
  if (w.status !== (lvl === 2 ? 'with_payroll' : 'submitted')) return null;
  const shown = w.entries;
  const diffs = isChange ? diffEntries(w.baseline, w.entries) : [];
  const lockedChange = isChange && diffs.some(d => isLocked(store, d.day));
  const approve = () => {
    const toPayroll = lvl === 1 && store.settings.l2.timesheet !== 'None';
    update(s => { const x = writeWeek(s, item.id, item.ws);
      if (toPayroll) { x.status = 'with_payroll'; hist(x, TODAY, mgr.name, 'Approved, sent to Payroll'); }
      else { x.status = 'approved'; x.approved = clone(x.entries); delete x.baseline; hist(x, TODAY, mgr.name, 'Approved'); } });
    notify('Timesheet approved for ' + emp.name + (toPayroll ? ', sent to Payroll' : '')); onClose();
  };
  const reject = c => {
    update(s => { const x = writeWeek(s, item.id, item.ws);
      x.status = 'rejected'; x.comment = c; hist(x, TODAY, mgr.name, 'Sent back: ' + c); });
    notify('Timesheet sent back to ' + emp.name); setRejecting(false); onClose();
  };
  const weekTotal = Object.values(shown).reduce((t, l) => t + sumMins(l), 0);
  const cell = r => html`<span>${timed(r) ? r.start + ' – ' + r.end : 'No set time'}<span className="muted"> · ${dur(entryMins(r))}</span></span>`;
  return html`<${Modal} wide title=${emp.name + ', week of ' + weekRange(item.ws)} onClose=${onClose} footer=${[
      html`<span key="n" className="muted small" style=${{ marginRight: 'auto' }}>${lvl === 1 && store.settings.l2.timesheet !== 'None' ? 'After you approve, it goes to Payroll.' : 'This approval is final.'}</span>`,
      html`<button key="r" className="btn" onClick=${() => setRejecting(true)}>Ask for update</button>`,
      html`<button key="a" className="btn good" disabled=${lockedChange} onClick=${approve}>Approve timesheet</button>`]}>
    <div className="row" style=${{ marginBottom: '14px' }}>
      ${isChange ? html`<${Seg} label="Review" value=${tab} onChange=${setTab} options=${[['changes', 'What changed'], ['sheet', 'Full timesheet']]} />` : null}
      <span className="spacer"></span><span className="muted small">${dur(weekTotal)} logged this week${isChange ? ' after the change' : ''}</span></div>
    ${isChange && html`<div className="banner blue"><div><b>Edited after it was approved.</b> “What changed” compares it with the last approved version.</div></div>`}
    ${lockedChange && html`<div className="banner grey">${Icon.lock}<div>Payroll is already processed for part of this change, so it can't be approved. Reject it and ask ${first(emp.name)} to raise it for next month.</div></div>`}
    ${tab === 'changes' && html`<div>${diffs.map(d => html`<div key=${d.day} className="diffday">
        <div className="row"><b style=${{ fontWeight: 500 }}>${fmtDate(d.day)}</b><span className="muted small">${dur(d.before)} → ${dur(d.after)}</span></div>
        ${d.rows.map((r, i) => r.kind === 'add' ? html`<div key=${i} className="drow add"><span>+</span>${cell(r.after)}<span>${r.after.desc}</span></div>`
          : r.kind === 'del' ? html`<div key=${i} className="drow del"><span>−</span><span className="x">${cell(r.before)}</span><span className="x">${r.before.desc}</span></div>`
          : html`<div key=${i} className="drow edit"><span>~</span>
              <span>${entTime(r.before) !== entTime(r.after) || entryMins(r.before) !== entryMins(r.after) ? kids(html`<span className="old">${cell(r.before)}</span><br/>${cell(r.after)}`) : cell(r.after)}</span>
              <span>${r.before.desc !== r.after.desc ? kids(html`<span className="old">${r.before.desc}</span><br/>${r.after.desc}`) : r.after.desc}</span></div>`)}
      </div>`)}</div>`}
    ${tab === 'sheet' && html`<${TimesheetBrowser} emp=${emp} start=${item.ws} startView="week" override=${{ ws: item.ws, entries: shown }}
      statusFor=${ws => { const x = readWeek(store, emp.id, ws); return html`<section className="panel pad" aria-label="Week status"><div className="row"><h3>Week of ${fmtShort(ws)}</h3><span className="spacer"></span><${WeekChip} w=${x} /></div>
        <div className="small" style=${{ marginTop: '8px', color: 'var(--ink-2)' }}>${ws === item.ws ? (isChange ? 'Showing the week with the proposed change. Approve or reject below.' : 'This is the week you’re reviewing. Approve or send back below.') : weekStatusText(store, emp, x)}</div></section>`; }} />`}
    ${rejecting && html`<${CommentModal} title=${isChange ? 'Reject change' : 'Send timesheet back'} label=${'What should ' + first(emp.name) + ' fix?'} confirm=${isChange ? 'Reject change' : 'Send back'} danger required onClose=${() => setRejecting(false)} onSubmit=${reject} />`}
  <//>`;
}

/* ---------------- Overtime tab ---------------- */
function MyOvertime({ emp }) {
  const { store } = useApp();
  const [modal, setModal] = useState(null);
  const mine = store.requests.filter(r => r.empId === emp.id && r.type === 'overtime');
  const m = monthOf(TODAY);
  const approvedMin = mine.filter(r => r.status === 'approved' && monthOf(r.data.date) === m).reduce((t, r) => t + r.data.minutes, 0);
  const waiting = mine.filter(r => r.status === 'pending_l1' || r.status === 'pending_l2').length;
  const sugg = [];
  for (let i = 1; i <= 35; i++) { const k = addDays(TODAY, -i); if (isLocked(store, k)) continue; const o = otSuggestion(store, emp, k); if (o && !otRequestFor(store, emp.id, k)) sugg.push({ k, o }); }
  const basis = store.settings.mode === 'timesheet' ? 'hours logged in your timesheet' : 'your check-in and check-out times';
  return html`<div>
    <div className="stats" style=${{ gridTemplateColumns: 'repeat(3,minmax(0,1fr))' }}>
      <div className="panel stat"><div className="k">Approved in ${fmtMonth(m)}</div><div className="v">${dur(approvedMin)}</div><div className="k">goes into this month's payroll</div></div>
      <div className="panel stat"><div className="k">Waiting for approval</div><div className="v">${waiting}</div><div className="k">request${waiting === 1 ? '' : 's'}</div></div>
      <div className="panel stat"><div className="k">Suggested</div><div className="v">${sugg.length}</div><div className="k">day${sugg.length === 1 ? '' : 's'} with extra hours, not claimed</div></div>
    </div>
    <div className="row" style=${{ marginBottom: '10px' }}><h3>Suggested overtime</h3><span className="spacer"></span>
      <button className="btn" onClick=${() => setModal({ kind: 'planned' })}>Plan overtime</button><button className="btn primary" onClick=${() => setModal({ kind: 'worked' })}>Request overtime</button></div>
    <div className="small muted" style=${{ marginBottom: '10px' }}>Based on ${basis}. Overtime is anything over your ${dur(store.settings.mode === 'timesheet' ? shiftLen(emp) - store.settings.breakMin : shiftLen(emp))} day, by at least ${dur(store.settings.otMin)}. Weekends and holidays count in full.</div>
    <div className="panel" style=${{ marginBottom: '22px' }}>
      ${sugg.length ? sugg.map(({ k, o }) => html`<div key=${k} className="req"><div><div className="title">${fmtLong(k)}${holidayOf(k) ? ', ' + holidayOf(k) : ''}</div><div style=${{ color: 'var(--ink-2)', marginTop: '2px' }}>${otText(o, emp)}</div></div>
        <div className="row" style=${{ alignItems: 'flex-start' }}><button className="btn sm primary" onClick=${() => setModal({ kind: 'worked', prefill: { k, o, mins: o.extra } })}>Request ${dur(o.extra)}</button></div></div>`)
        : html`<${Empty} title="Nothing to claim">Days where you work beyond your standard hours show up here.<//>`}
    </div>
    <h3 style=${{ marginBottom: '10px' }}>My overtime requests</h3>
    <div className="panel">${mine.length ? mine.map(r => html`<${ReqRow} key=${r.id} r=${r} />`) : html`<${Empty} title="No requests yet">Request overtime for extra hours, or plan it in advance.<//>`}</div>
    ${modal && html`<${OvertimeModal} emp=${emp} kind=${modal.kind} prefill=${modal.prefill} onClose=${() => setModal(null)} />`}
  </div>`;
}

// one leave type: available / approved / in request, then every request of that type, with filters
function LeaveTypePage({ emp, t, onBack, onApply }) {

// time cell from Excel or text: 09:30, 9:30 AM, 18:05, or an Excel time fraction
const parseClock = v => {
  if (v == null || v === '') return null;
  if (typeof v === 'number') { const m = Math.round((v % 1) * 1440); return pad(Math.floor(m / 60)) + ':' + pad(m % 60); }
  const t = String(v).trim().toUpperCase(); const m = t.match(/^(\d{1,2})[:.](\d{2})\s*(AM|PM)?$/); if (!m) return null;
  let h = +m[1]; const mi = +m[2]; if (mi > 59) return null; if (m[3]) { if (h < 1 || h > 12) return null; if (m[3] === 'PM' && h < 12) h += 12; if (m[3] === 'AM' && h === 12) h = 0; } else if (h > 23) return null;
  return pad(h) + ':' + pad(mi);
};

function AdminReqs({ type, extra, hideApproved }) {

  const cnt = k => all.filter(B[k]).length;

  const v1 = type === 'profile' ? 'HR' : ((store.settings.l1 || {})[type] || 'Manager'), v2 = type === 'profile' ? 'None' : (store.settings.l2[type] || 'None');
  const teamStep = (v1 !== 'Manager' && !isPerson(v1)) || (v2 !== 'None' && !isPerson(v2));
  const personStep = v1 === 'Manager' || isPerson(v1) || isPerson(v2);

    (personStep || cnt('mgr')) && ['mgr', (v1 === 'Manager' && !isPerson(v2) ? 'With managers' : 'With approvers') + ' (' + cnt('mgr') + ')'],
    ['upd', 'Update requested (' + cnt('upd') + ')'],

    ['no', 'Rejected (' + cnt('no') + ')'],
    ['all', 'All (' + (hideApproved ? all.filter(r => r.status !== 'approved').length : all.length) + ')'],
  ].filter(Boolean);

  const chosen = list.filter(r => sel[r.id] && teamWaiting(r));
  const bulk = () => { const n = chosen.length; update(s => chosen.forEach(r => decideRequest(s, r.id, r.status === 'pending_l2' ? 2 : 1, 'approve', '', team))); setSel({}); notify(n + ' approved'); };
  const remind = r => { const e = EMAP[r.empId]; notify(waitingWith(r) ? 'Reminder sent to ' + routeLabel(waitingWith(r)) : 'Reminder sent to ' + e.name); };
  return html`<div>

    <div className="panel">${list.map(r => html`<div key=${r.id} className="ap-row">
        ${teamWaiting(r) ? html`<input type="checkbox" aria-label="Select" checked=${!!sel[r.id]} onChange=${e => setSel(Object.assign({}, sel, { [r.id]: e.target.checked }))} />` : html`<span></span>`}
        <div>${((waitingWith(r) && !teamWaiting(r)) || r.status === 'update_requested' || extra) ? html`<div className="row" style=${{ gap: '6px', padding: '10px 14px 0' }}>${extra ? extra(r) : null}<span className="spacer"></span>${waitingWith(r) && !teamWaiting(r) ? kids(html`<span className="small muted">Waiting for ${routeLabel(waitingWith(r))}. You can decide once they approve.</span><button className="btn sm" onClick=${() => remind(r)}>Remind ${first(routeLabel(waitingWith(r)))}</button>`) : r.status === 'update_requested' ? html`<button className="btn sm" onClick=${() => remind(r)}>Remind employee</button>` : null}</div>` : null}
        <${ReqRow} r=${r} showEmp level=${teamWaiting(r) ? (r.status === 'pending_l2' ? 2 : 1) : undefined} actor=${team} /></div></div>`)}
      ${list.length === 0 && html`<${Empty} title=${f === 'you' ? 'Nothing waiting for you' : 'Nothing here'}>${f === 'you' ? 'Requests reach you after the employee\u2019s manager approves them.' : 'Try another filter.'}<//>`}</div>

ll / female / male). Comp off appears only when comp off is on.", "Available = credited so far − approved leave − late check-in deductions − leave still in request (pending or update requested). Example: 10 credited, 4 taken, 2 requested = 4 available.", "Total = this leave cycle’s entitlement (pro-rated for joiners/leavers) + carried forward. Comp off total = earned and not expired.", "Recent activity sources: leave / comp off / cancellation / change requests (with their latest action), credits (start of cycle, monthly, daily, carry forward), late deductions (and \"dispute pending\"), reversals, comp off expiries. Sorted by the date of the change, not the leave date."]], ["Apply for leave (modal, opened from the button)", ["Fields: Leave type → the available balance appears immediately (\"7 days available of 17 this year\", plus \"2 days waiting for approval are already taken off\"); Full days / Half days; From; To; Which half (half days only, applies to every working day in the range); Supporting document (only when the type’s rule needs it for that duration); Reason.", "Duration line: working days only (employee’s own schedule; weekly offs and public holidays not counted). Half days = 0.5 per working day. With the sandwich rule on: \"+ N days off in between\".", "Refuse with a clear message: end before start; no working days; dates overlapping existing leave (approved, pending or update requested); not enough available; type \"not available\" during probation; document missing when required; no reason.", "Sends a leave request into the approval chain (leave approvers from settings). Footer line names the approvers.", "Calendar-day types count every day in the range (\"12 calendar days, weekends and public holidays included\").", "Footer note: \"Need unpaid leave (loss of pay)? That’s only once all your paid leave is used. Email Admin / HR to arrange it.\"", "Per-event types: the Duration (full/half) choice is hidden. Fields: the event date (label from the trigger, e.g. \"Date of birth or adoption\"); Start date (only dates inside the window can be picked; disabled until the event date is set); End date fills in automatically for the full entitlement (working or calendar days per the type), can be shortened but not extended; hint \"Can start between … and …. …taken in one go\"; the supporting document field with HR’s wording when required. Refused: no event date, start outside the window, longer than the entitlement, or a second request for the same event (\"It has to be taken in one go; change that request instead\").", "Maternity in the form: \"Which child is this?\" First child / Second child / Third child or later (\"This sets your entitlement. HR checks it when they approve.\"). It sets the number of days and the earliest start (up to the before-weeks, 6 for the third child or later); the latest start is the after-weeks. Event date label: \"Expected or actual date of delivery\".", "Half days are offered only for leave types that allow them (per-type setting)."]], ["Request LOP (modal)", ["Loss of pay is the only unpaid leave. Same form as a regular leave without the type: Full / Half days, From, To, Which half, Reason. Working days only. Box: \"Unpaid leave · these days are deducted from your salary\".", "Setting (Leave → Configuration → Loss of pay): \"Only once paid leave is used up\" (default) or \"Any time\". With the default, if any yearly balance (incl. comp off; per-event types don’t count) is above 0, the modal shows \"You still have paid leave: 9.5 Annual · 6.5 Casual…\" and Send is disabled.", "Creates a leave request with leaveType \"Loss of pay\" (lop = true): same approvers, same overlap check, no balance and no limit. Approvers see \"Unpaid: payroll treats these days as loss of pay.\" instead of a balance line. In the drawer: Withdraw / Cancel only (no Edit or Change). Attendance and timesheet show the days as leave; payroll/LOP (owned by another team) reads them as loss of pay."]], ["Request comp off (modal)", ["Day picker is a calendar: only weekly offs and public holidays can be selected (working days are disabled; extra hours on a working day are overtime). Also disabled: future days, days older than the expiry window, days already claimed. Days the employee worked are marked with a dot.", "Legend: Public holiday · Weekly off · You worked · Not available.", "Hours come from attendance (or timesheet in timesheet-only mode). Half a shift or more = 0.5 day, full shift = 1 day. Refused if the day was claimed as overtime."]], ["Data the page needs", ["Balances per type: available, total, credited, approved, in request, carried forward.", "Activity feed (last 10, newest change first). Upcoming leave. Holidays for the year. Employee status (probation) and leaving date."]]], "prompt": "Build: ESS → Leave → Overview\n\nContext: we are building the ESS service module by module (Leave first, then Attendance, then Timesheet, then Overtime, Reimbursements, Profile). This page is part of the Leave module.\nRead first: the Developer notes for this page (this panel), the Shared platform rules in \"How to use these notes\", and the prototype (docs/prototypes/leave-prototype.html): open it and go to this page.\n\nWhat this page is: The employee’s leave home: balances at a glance, recent leave activity, upcoming leave and the next public holiday. Also where they start a leave or comp off request.\n\nBuild or change:\n- The Overview sub-tab of the ESS Leave page as described in these notes: compact leave cards (available / total + View details, 4 per row), Recent activity (last 10 changes), Upcoming leave, Next public holiday, banners.\n- The Apply for leave, Request comp off and Request LOP modals with every rule and message listed, and the dynamic card grid (yearly + per-event cards + Upcoming leave + Next public holiday).\n- Balance and activity calculations as tested functions.\n\nRules for this run:\n- Reuse the existing components, design system, routing and data layer. Put business rules in tested functions, not in the component.\n- Don't ask me questions. Make the most reasonable choice, note it in docs/progress.md, and carry on.\n- Work on main, commit in small steps, run type-check, lint and tests, and fix what you break.\n\nDone when:\n- Cards show only \"available / total\" and View details; 4 per row on desktop, 2 on phone.\n- Available excludes leave in request (10 credited, 4 taken, 2 requested shows 4).\n- Recent activity shows the 10 latest changes, newest first; a leave row opens the request drawer.\n- Apply form shows the balance on type pick, counts half days over a range, applies the sandwich rule, and shows the document field only when required.\n- No console errors; type-check, lint, tests and the production build pass.\n\nReport: what changed (files), decisions, and each check pass/fail."}, "ess:leave:type": {"title": "ESS → Leave → Leave type details", "module": "Leave", "what": "Everything about one leave type for the employee: where they stand, and a full log of every movement.", "sections": [["What’s on the page", ["Back button, the type name, Apply for leave.", "Four cards: Available (of total) · Approved (days taken or booked) · In request · Carried forward (with the yearly limit, or \"No carry forward\").", "One summary line: credited so far of total · credit method · next credit (or \"accrues daily\") · probation rule if on probation · what lapses at the end of the cycle. Comp off: how it’s earned and when it expires.", "ONE log table with everything for this type (no separate credits button): Date, Entry, Period, Days (+/−), Status, Reason.", "Filters: Show (All / Leave / Credits / Deductions, with counts), status (approved or credited / in request / rejected / withdrawn or cancelled), date range with Clear.", "Clicking a leave row opens the request drawer (same drawer as My requests).", "\"Apply for leave\" on this page opens the form with this leave type already selected."]], ["What goes in the log", ["Leave type-check, lint, tests and the production build pass.\n\nReport: what changed (files), decisions, and each check pass/fail."}, "ess:leave:requests": {"title": "ESS → Leave → My requests", "module": "Leave", "what": "Every leave-related request the employee has raised, and the place to view, edit, change, cancel or withdraw them.", "sections": [["What’s on the page", ["Status filter: All · In progress · Approved · Rejected / withdrawn (with counts).", "Table: Leave type · Start date · End date · Duration (with half-day info) · Status · Action (View). Comp off, cancellation and change requests are listed too (\"Comp off (earned)\", \"Cancel Annual\", \"Change Annual\"). A pending cancellation or change of a leave shows under its status.", "Clicking a row (or View) opens a right-side drawer."]], ["The drawer", ["Details: type, from, to, day type (full / first half / second half, \"of each day\" for ranges), duration, reason, document; for change requests also \"Was: …\". For comp off: day worked, hours, comp off days.", "Banners: the approver’s comment when an update was requested; \"A cancellation/change of this leave is waiting for {approver}\".", "Approval chain, then History (every action with who, when and comment).", "Actions by state: Pending → Edit request, Withdraw. Update requested → Update and resubmit, Withdraw. Approved → Change leave (if not finished), Cancel leave. Rejected / withdrawn / cancelled → read only.", "Withdraw asks for confirmation (\"Withdraw this request?\")."]], ["Editing and changing", ["Editing a pending request updates it in place and sends it back to the start of the approval chain (Level 1).", "Changing APPROVED leave creates a \"leave change\" request (new type/dates/half/reason) that goes through the leave approvers. The original leave stays exactly as it is until the change is approved; then it is replaced. Balance check allows the original days back if it’s the same type.", "Same validations as Apply (overlap with other leave, balance, working days, sandwich rule)."]], ["Cancelling and past dates", ["Cancel leave asks for \"Cancel from\" (whole leave, or from a later date) and a reason, then goes for approval. The leave stays booked until approved; then the days return to the balance and attendance / timesheet update.", "Past dates: the employee may cancel or shorten approved leave in the past ONLY for days they actually worked: a check-in on each past working day being removed (attendance modes), or timesheet entries (timesheet-only). Otherwise refuse: \"Past leave can only be cancelled for days you actually worked. There’s no check-in on Mon 9 Nov. Raise an attendance correction for those days first.\"", "HR cancelling from Payroll is not limited by this rule and applies immediately."]], ["Data / API", ["List the employee’s leave, comp off, cancellation and change requests with status and trail. Endpoints to edit a pending request, create change/cancel requests, withdraw."]]], "prompt": "Build: ESS → Leave → My requests\n\nContext: we are building the ESS service module by module (Leave first, then Attendance, then Timesheet, then Overtime, Reimbursements, Profile). This page is part of the Leave module.\nRead first: the Developer notes for this page (this panel), the Shared platform rules in \"How to use these notes\", and the prototype (docs/prototypes/leave-prototype.html): open it and go to this page.\n\nWhat this page is: Every leave-related request the employee has raised, and the place to view, edit, change, cancel or withdraw them.\n\nBuild or change:\n- The My requests sub-tab as a table with status filters.\n- The request drawer with details, approval chain, history and state-based actions (edit/resubmit, withdraw, change leave, cancel leave).\n- Leave change requests (approval needed, original kept until approved) and the past-date cancel rule.\n\nRules for this run:\n- Reuse the existing components, design system, routing and data layer. Put business rules in tested functions, not in the component.\n- Don't ask me questions. Make the most reasonable choice, note it in docs/progress.md, and carry on.\n- Work on main, commit in small steps, run type-check, lint and tests, and fix what you break.\n\nDone when:\n- Editing a pending request restarts it at Level 1.\n- Changing approved leave creates a change request; the original stays until approved, then is replaced.\n- Cancelling a past day with no check-in is refused with the message; a day with a check-in can be cancelled after approval and attendance/timesheet update.\n- No console errors; type-check, lint, tests and the production build pass.\n\nReport: what changed (files), decisions, and each check pass/fail."}, "ess:leave:holidays": {"title": "ESS → Leave → Public holidays", "module": "Leave", "what": "The company’s public holidays for the year, so employees don’t have to ask.", "sections": [["What’s on the page", ["Title with the year, count of holidays and how many fall on working days, and the note \"You don’t need to apply for these.\"", "Table: Date · Day · Holiday · tag. Past holidays faded, the next one tagged \"Next\", holidays on a weekly off tagged \"Weekly off\"."]], ["Rules", ["The list comes from Payroll settings → Leave → Public holidays. Holidays also feed calendars, leave day counts (never counted as leave) and the timesheet (prefilled holiday rows)."]]], "prompt": "Build: ESS → Leave → Public holidays\n\nContext: we are building the ESS service module by module (Leave first, then Attendance, then Timesheet, then Overtime, Reimbursements, Profile). This page is part of the Leave module.\nRead first: the Developer notes for this page (this panel), the Shared platform rules in \"How to use these notes\", and the prototype (docs/prototypes/leave-prototype.html): open it and go to this page.\n\nWhat this page is: The company’s public holidays for the year, so employees don’t have to ask.\n\nBuild or change:\n- The Public holidays sub-tab reading the company holiday list for the current year.\n\nRules for this run:\n- Reuse the existing components, design system, routing and data layer. Put business rules in tested functions, not in the component.\n- Don't ask me questions. Make the most reasonable choice, note it in docs/progress.md, and carry on.\n- Work on main, commit in small steps, run type-check, lint and tests, and fix what you break.\n\nDone when:\n- Shows the year’s holidays from settings with Next / Weekly off / Past states.\n- No console errors; type-check, lint, tests and the production build pass.\n\nReport: what changed (files), decisions, and each check pass/fail."}, "ess:team:approvals": {"title": "ESS → My team → Approvals", "module": "Leave (approver view)", "what": "The approver’s inbox. For the Leave module, this is where leave, cancellation, change and comp off requests are decided at Level 1 (or Level 2 when a person is the Level 2 approver).", "sections": [["Leave items in the inbox", ["Each leave request shows the balance for the approver: \"Annual: 7 available now · 4.5 after this\", red when short (\"short by 1.5, would be loss of pay\").", "Approve when short opens \"Not enough leave\": how many days become loss of pay, with Approve anyway or Ask for update.", "Actions: Approve, Ask for update (comment required, goes straight to the employee), Reject. Type filter \"Leave\" includes cancellations, changes and comp off. Bulk approve for selected items."]], ["Rules", ["Items appear for whoever the leave approvers resolve to (reporting manager by default, or a specific person). Approving at Level 1 sends it to Level 2 if one is set; otherwise it’s final and the effects run (balances, attendance, timesheet)."]], ["View", ["Every leave, cancellation, change and comp off request has a View button that opens the full request read-only (details, attached document, approval chain, history). Attached documents also show on the row (\"📎 file name\"), so approvers can check them before deciding."]]], "prompt": "Build:
